name: Debian 13 sandboxed browser startup diagnostic
on:
  push:
    branches: [verify/native-debian-browser-diagnostic-20261031]
permissions:
  contents: read
jobs:
  browser-startup:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Build unchanged Debian 13 browser image
        run: docker build --file .github/containers/debian13-browser.Dockerfile --tag zxs-debian13-browser .github/containers
      - name: Probe same non-root sandboxed Chromium without product compilation
        run: |
          docker run --rm --init --network none --user "$(id -u):$(id -g)" \
            --volume "$PWD:/work" --env HOME=/tmp zxs-debian13-browser \
            bash .github/scripts/check-debian13-browser.sh
      - name: Preserve exact startup diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: debian13-browser-startup
          path: artifacts/debian13-browser-*
          if-no-files-found: error
