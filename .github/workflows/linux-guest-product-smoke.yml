name: Linux disposable ZXS product smoke

on:
  workflow_dispatch:
    inputs:
      workspace_h2:
        description: 'Also exercise the real Workspace HTTPS/HTTP2 client in loopback'
        type: boolean
        required: false
        default: false
      workspace_fuse:
        description: 'Also exercise the real editable Linux mount and explicit R3 submission'
        type: boolean
        required: false
        default: false

permissions: {}

jobs:
  smoke:
    if: github.repository == 'isarmg/zxs' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Snapshot the exact source and prepare verified Rust inputs
        id: inputs
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test "$(id -u)" -ne 0
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          work=$(mktemp -d "$RUNNER_TEMP/zxs-paired-build.XXXXXXXX")
          printf 'PAIR_BUILD=%s\n' "$work" >> "$GITHUB_ENV"
          cd "$work"
          mkdir source home rust cargo target
          git_env=(env -i PATH=/usr/bin:/bin LC_ALL=C HOME="$work/home"
            GIT_CONFIG_NOSYSTEM=1 GIT_TERMINAL_PROMPT=0)
          "${git_env[@]}" git init --quiet --bare source.git
          "${git_env[@]}" git --git-dir=source.git fetch --quiet --no-tags --depth=1 \
            https://github.com/isarmg/zxs.git "$GITHUB_SHA"
          test "$(git --git-dir=source.git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git --git-dir=source.git archive "$GITHUB_SHA" helper zxs | tar -xf - -C source
          printf 'Source commit: %s\n' "$GITHUB_SHA"
          for project in helper zxs; do
            printf '%s source tree: %s\n' "$project" "$(git --git-dir=source.git rev-parse "$GITHUB_SHA:$project")"
            sha256sum "source/$project/Cargo.lock"
          done

          release=https://static.rust-lang.org/dist/2026-11-12
          while read -r hash target component member; do
            name="$component-1.100.0-$target"
            curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
              --connect-timeout 15 --max-time 120 --retry 2 --max-filesize 120000000 "$release/$name.tar.xz" -o "$name.tar.xz"
            printf '%s  %s.tar.xz\n' "$hash" "$name" | sha256sum -c -
            if [[ "$target" == x86_64-unknown-linux-gnu ]]; then
              tar -xJf "$name.tar.xz" -C rust --no-same-owner --no-same-permissions \
                --strip-components=2 --exclude="$name/$member/manifest.in" "$name/$member"
            fi
          done <<'RUST'
          f1d0b1dec81dab6f523cd098507763487b0d4bd7fd2c87582f154128719be03b x86_64-unknown-linux-gnu rustc rustc
          7e29ce07d7c6e92d1826870575ba27d57fff6cb3e754aa57d99099cb88fab35d x86_64-unknown-linux-gnu cargo cargo
          4591b6486594ded52ecd6135db95bf9355bbd3ca7a380888b141528bbcf9a5d4 x86_64-unknown-linux-gnu rust-std rust-std-x86_64-unknown-linux-gnu
          RUST
          sha256sum /usr/bin/gcc /usr/bin/ar /usr/bin/ld

      - name: Build and verify the standalone ZXS ELF
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          cd "$PAIR_BUILD/source/zxs"
          sha256sum build_release.py
          python3 build_release.py "$PAIR_BUILD/rust/bin"
          sha256sum target/standalone/zxs

      - name: Build and inspect the standalone Helper
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          cd "$PAIR_BUILD/source/helper"
          toolchain="$PAIR_BUILD/rust/bin"
          build_env=(env -i PATH=/usr/bin:/bin HOME="$PAIR_BUILD/home" TMPDIR="$PAIR_BUILD" LC_ALL=C TZ=UTC
            CARGO_HOME="$PAIR_BUILD/cargo" CARGO_TARGET_DIR="$PAIR_BUILD/target" CARGO_BUILD_JOBS=2 CARGO_INCREMENTAL=0
            RUSTC="$toolchain/rustc" RUSTDOC="$toolchain/rustdoc" CC=/usr/bin/gcc AR=/usr/bin/ar
            CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER=/usr/bin/gcc)
          target=x86_64-unknown-linux-gnu
          "${build_env[@]}" "$toolchain/cargo" fetch --locked --target "$target"
          "${build_env[@]}" "$toolchain/cargo" build --locked --offline --release --target "$target" \
            --bin helper
          image="$PAIR_BUILD/target/$target/release/helper"
          size=$(stat -c %s "$image")
          [[ "$size" -ge 64 && "$size" -le 67108864 ]]
          LC_ALL=C /usr/bin/readelf -hlWd "$image" > "$PAIR_BUILD/helper.readelf"
          grep -E '^ *(Class:|Type:|Machine:|GNU_STACK |INTERP )|\(NEEDED\)' "$PAIR_BUILD/helper.readelf"
          grep -qE '^ *Class: +ELF64$' "$PAIR_BUILD/helper.readelf"
          grep -qE '^ *Machine: +Advanced Micro Devices X86-64$' "$PAIR_BUILD/helper.readelf"
          awk '$1 == "GNU_STACK" {++stacks; for(i=7; i<NF; ++i) if($i ~ /E/) bad=1} END {exit stacks!=1 || bad}' \
            "$PAIR_BUILD/helper.readelf"
          if grep -qE '\(NEEDED\).*(libgcrypt|libgpg-error)' "$PAIR_BUILD/helper.readelf"; then exit 1; fi
          printf 'Helper: %s bytes\n' "$size"
          sha256sum "$image"

      - name: Verify the signed guest and prepare local QEMU tools
        shell: bash
        env:
          WORKSPACE_FUSE: ${{ inputs.workspace_fuse }}
        run: |
          set -euo pipefail
          umask 077
          test "$(id -u)" -ne 0
          work=$(mktemp -d "$RUNNER_TEMP/zxs-guest.XXXXXXXX")
          printf 'ZXS_GUEST_WORK=%s\n' "$work" >> "$GITHUB_ENV"
          cd "$work"

          if [[ "$WORKSPACE_FUSE" == true ]]; then
            image=ubuntu-26.10-minimal-cloudimg-amd64.img
            release=https://cloud-images.ubuntu.com/minimal/releases/stonking/release-20261105
            pin=154b19deda3a6be396b6ddc65c38af7043ae695457038d61f3937023d2209890
          else
            image=ubuntu-26.04-minimal-cloudimg-amd64.img
            release=https://cloud-images.ubuntu.com/minimal/releases/resolute/release-20261118
            pin=f6c630c04d4fad012f2c4ed3a21a2b0c0f814f13f6873568da4c31d8df65c12e
          fi
          printf 'ZXS_GUEST_IMAGE=%s\n' "$image" >> "$GITHUB_ENV"
          fetch() {
            curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
              --connect-timeout 15 --max-time 240 --retry 2 --max-filesize 600000000 "$release/$1" -o "$1"
          }
          fetch SHA256SUMS
          fetch SHA256SUMS.gpg
          mkdir gnupg
          GNUPGHOME="$work/gnupg" gpgv --keyring /usr/share/keyrings/ubuntu-cloudimage-keyring.gpg \
            --status-fd 1 SHA256SUMS.gpg SHA256SUMS > image.signature
          grep -qF '[GNUPG:] VALIDSIG D2EB44626FDDC30B513D5BB71A5D6C4C7DB87C81 ' image.signature
          grep -qxF "$pin *$image" SHA256SUMS
          fetch "$image"
          printf '%s *%s\n' "$pin" "$image" | sha256sum -c -

          mkdir -p apt/{etc/empty,lists/partial,archives/partial} tools
          : > apt/status
          export APT_CONFIG="$work/apt/config"
          cat > "$APT_CONFIG" <<EOF
          Dir::Etc "$work/apt/etc";
          Dir::Etc::main "/dev/null";
          Dir::Etc::parts "empty";
          Dir::Etc::sourceparts "empty";
          Dir::Etc::sourcelist "sources.list";
          Dir::State "$work/apt";
          Dir::State::status "$work/apt/status";
          Dir::Cache "$work/apt";
          Dir::Log "$work/apt";
          Dir::Cache::pkgcache "";
          Dir::Cache::srcpkgcache "";
          Acquire::Languages "none";
          Acquire::Retries "2";
          APT::Get::Always-Include-Phased-Updates "true";
          APT::Update::Error-Mode "any";
          EOF
          snapshot=https://snapshot.ubuntu.com/ubuntu/20261118T120000Z
          archive_key=/etc/apt/trusted.gpg.d/ubuntu-keyring-2018-archive.gpg
          for suite in noble noble-updates noble-security; do
            printf 'deb [arch=amd64 signed-by=%s] %s %s main universe\n' "$archive_key" "$snapshot" "$suite"
          done > apt/etc/sources.list
          /usr/bin/apt-get update
          (
            cd apt/lists
            cat <<'PINS' | sha256sum -c -
          cdb2f31d809f589719a53c6ad15f255b27569c4059542ada282aaa21b8e164b0  snapshot.ubuntu.com_ubuntu_20261118T120000Z_dists_noble_InRelease
          a4dfe9c58d77db89e8b45240d1cc14a3e6dd9159bc29395aebfe6e893594dccb  snapshot.ubuntu.com_ubuntu_20261118T120000Z_dists_noble-updates_InRelease
          65a6f9c5cf5b8d887e45c2a638b19bedd86e9d3630afee8b3a7b46ea5803dc22  snapshot.ubuntu.com_ubuntu_20261118T120000Z_dists_noble-security_InRelease
          PINS
          )
          /usr/bin/apt-get --assume-yes --download-only --no-install-recommends install \
            qemu-system-x86 ovmf genisoimage e2fsprogs
          for package in apt/archives/*.deb; do
            dpkg-deb --extract "$package" tools
          done
          sha256sum apt/archives/*.deb


      - name: Download the pinned Ubuntu FUSE guest inputs into a verified offline repository
        if: ${{ inputs.workspace_fuse }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          cd "$ZXS_GUEST_WORK"
          work="$PWD/fuse-download"
          mkdir -p "$work"/{etc/empty,lists/partial,archives/partial,offline}
          : > "$work/status"
          export APT_CONFIG="$work/config"
          cat > "$APT_CONFIG" <<EOF
          Dir::Etc "$work/etc";
          Dir::Etc::main "/dev/null";
          Dir::Etc::parts "empty";
          Dir::Etc::sourceparts "empty";
          Dir::Etc::sourcelist "sources.list";
          Dir::State "$work";
          Dir::State::status "$work/status";
          Dir::Cache "$work";
          Dir::Log "$work";
          Dir::Cache::pkgcache "";
          Dir::Cache::srcpkgcache "";
          Acquire::Languages "none";
          Acquire::Retries "2";
          Apt::Architecture "amd64";
          APT::Get::Always-Include-Phased-Updates "true";
          APT::Update::Error-Mode "any";
          EOF
          snapshot=https://snapshot.ubuntu.com/ubuntu/20261118T120000Z
          archive_key=/etc/apt/trusted.gpg.d/ubuntu-keyring-2018-archive.gpg
          for suite in stonking stonking-updates stonking-security; do
            printf 'deb [arch=amd64 signed-by=%s] %s %s main universe\n' "$archive_key" "$snapshot" "$suite"
          done > "$work/etc/sources.list"
          /usr/bin/apt-get update
          (
            cd "$work/lists"
            cat <<'PINS' | sha256sum -c -
          432b0f2ad42b2a997e2b373f5b61cabb3e80b3c5348cd0ff4b9cfc4df2e3d8fb  snapshot.ubuntu.com_ubuntu_20261118T120000Z_dists_stonking_InRelease
          f6ac982cb6a4f78a3b84eca852c3dad5f1b69f72987be7eb7db0dc6a708e7288  snapshot.ubuntu.com_ubuntu_20261118T120000Z_dists_stonking-updates_InRelease
          53c81861dabda003a9c64e23b8b17b643c88e43d3bacea40317470689c6d2d6c  snapshot.ubuntu.com_ubuntu_20261118T120000Z_dists_stonking-security_InRelease
          PINS
          )
          /usr/bin/apt-get --assume-yes --download-only --no-install-recommends install \
            fuse3=3.18.3-1 libfuse3-4=3.18.3-1 python3-pyfuse3=3.5.0-3 python3-trio=0.34.0-1
          shopt -s nullglob
          packages=("$work"/archives/*.deb)
          (( ${#packages[@]} > 0 && ${#packages[@]} <= 150 ))
          for package in "${packages[@]}"; do
            name=${package##*/}
            case "$name" in *[!a-zA-Z0-9._+%~-]*) exit 1 ;; esac
            install -m 0644 "$package" "$work/offline/$name"
            dpkg-deb --info "$package" control
            size=$(stat -c %s "$package")
            sha=$(sha256sum < "$package")
            printf 'Filename: ./%s\nSize: %s\nSHA256: %s\n\n' "$name" "$size" "${sha%% *}"
          done > "$work/offline/Packages"
          chmod 0644 "$work/offline/Packages"

      - name: Prepare the exact Workspace source and H2 runtime without installing on the runner
        if: ${{ inputs.workspace_h2 || inputs.workspace_fuse }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          cd "$ZXS_GUEST_WORK"
          mkdir -m 0755 workspace-h2 workspace-h2/packages
          git --git-dir="$PAIR_BUILD/source.git" archive "$GITHUB_SHA" \
            zxs-workspace/zipworkspace \
            zxs-workspace/tests/qualification/live_r3_loopback.py \
            zxs-workspace/tests/qualification/live_linux_edit_mount.py \
            zxs-workspace/packaging/network-r3/requirements.txt |
            tar -xf - -C workspace-h2 --no-same-owner --no-same-permissions
          printf 'Workspace source tree: %s\n' "$(git --git-dir="$PAIR_BUILD/source.git" rev-parse "$GITHUB_SHA:zxs-workspace")"
          python3 -I -B -m venv h2-venv
          mkdir h2-wheels
          pip=(h2-venv/bin/python -I -B -m pip --isolated --disable-pip-version-check --no-input)
          lock=(--no-deps --only-binary=:all: --require-hashes --no-cache-dir
                -r workspace-h2/zxs-workspace/packaging/network-r3/requirements.txt)
          "${pip[@]}" download --index-url https://pypi.org/simple --dest h2-wheels "${lock[@]}"
          test "$(find h2-wheels -maxdepth 1 -name '*-py3-none-any.whl' -type f | wc -l)" -eq 6
          "${pip[@]}" install --no-index --find-links h2-wheels --target workspace-h2/packages "${lock[@]}"
          # Isolated, short-lived certificate material for this fixture only.
          mkdir -m 0755 workspace-h2/certs
          openssl req -new -newkey rsa:2048 -nodes -x509 -days 2 -sha256 \
            -subj '/CN=ZXS workspace fixture root' -addext 'basicConstraints=critical,CA:TRUE' \
            -addext 'keyUsage=critical,keyCertSign,cRLSign' -keyout fixture-ca.key \
            -out workspace-h2/certs/ca.pem 2>cert-generation.log
          openssl req -new -newkey rsa:2048 -nodes -subj '/CN=127.0.0.1' \
            -keyout workspace-h2/certs/server.key -out fixture-leaf.csr 2>>cert-generation.log
          cat > fixture-leaf.extensions <<'EXTENSIONS'
          basicConstraints=critical,CA:FALSE
          keyUsage=critical,digitalSignature,keyEncipherment
          extendedKeyUsage=serverAuth
          subjectAltName=IP:127.0.0.1
          EXTENSIONS
          openssl x509 -req -days 1 -sha256 -CA workspace-h2/certs/ca.pem -CAkey fixture-ca.key \
            -CAcreateserial -in fixture-leaf.csr -extfile fixture-leaf.extensions \
            -out workspace-h2/certs/server.pem 2>>cert-generation.log
          openssl verify -purpose sslserver -verify_ip 127.0.0.1 -CAfile workspace-h2/certs/ca.pem \
            workspace-h2/certs/server.pem
          test -z "$(find workspace-h2 ! -type f ! -type d -print -quit)"
          tar -cf workspace-h2.tar -C workspace-h2 .

      - name: Run the same-commit products in an isolated guest
        shell: bash
        env:
          WORKSPACE_H2: ${{ inputs.workspace_h2 || inputs.workspace_fuse }}
          WORKSPACE_FUSE: ${{ inputs.workspace_fuse }}
        run: |
          set -euo pipefail
          umask 077
          cd "$ZXS_GUEST_WORK"
          tools="$PWD/tools"
          libs="$tools/usr/lib/x86_64-linux-gnu:$tools/lib/x86_64-linux-gnu"
          loader="$tools/usr/lib/x86_64-linux-gnu/ld-linux-x86-64.so.2"
          tool_env=(env -i LANG=C PATH=/usr/bin:/bin HOME="$PWD" TMPDIR="$PWD"
            QEMU_MODULE_DIR="$tools/usr/lib/x86_64-linux-gnu/qemu"
            MKE2FS_CONFIG="$tools/etc/mke2fs.conf" "$loader" --inhibit-cache --library-path "$libs")
          for exe in usr/sbin/mke2fs usr/bin/genisoimage usr/bin/qemu-system-x86_64; do
            "${tool_env[@]}" --list "$tools/$exe" |
              awk -v base="$tools/" '$2 == "=>" && index($3, base) != 1 {exit 1}'
          done
          mkdir -m 0755 empty seed
          roles=(data-a data-b recycle)
          if [[ "$WORKSPACE_FUSE" == true ]]; then roles+=(workspace); fi
          for role in "${roles[@]}"; do
            truncate -s 64M "$role.ext4"
            "${tool_env[@]}" "$tools/usr/sbin/mke2fs" -q -t ext4 -d empty -L "zxs-$role" "$role.ext4"
          done
          install -m 0755 "$PAIR_BUILD/source/zxs/target/standalone/zxs" seed/zxs
          install -m 0755 "$PAIR_BUILD/target/x86_64-unknown-linux-gnu/release/helper" seed/helper
          install -m 0444 "$PAIR_BUILD/source/zxs/tests/acceptance/guest_product_smoke.py" seed/guest_product_smoke.py
          seed_members=(zxs helper guest_product_smoke.py)
          if [[ "$WORKSPACE_H2" == true ]]; then
            install -m 0400 workspace-h2.tar seed/workspace-h2.tar
            seed_members+=(workspace-h2.tar)
          fi
          if [[ "$WORKSPACE_FUSE" == true ]]; then
            install -d -m 0755 seed/fuse-deb
            cp -t seed/fuse-deb fuse-download/offline/*
          fi
          (
            cd seed
            sha256sum "${seed_members[@]}"
            if [[ "$WORKSPACE_FUSE" == true ]]; then sha256sum fuse-deb/*; fi
          ) | tee seed/SHA256SUMS
          printf '%s\n' 'instance-id: zxs-acceptance-product-smoke' > seed/meta-data
          cat > seed/user-data <<'CLOUD'
          #cloud-config
          users: []
          ssh_pwauth: false
          ssh_genkeytypes: []
          package_update: false
          package_upgrade: false
          runcmd:
            - - /bin/bash
              - -ec
              - |
                exec > /dev/ttyS0 2>&1
                stage=guard
                trap 'rc=$?; if [ "$rc" -ne 0 ]; then printf "ZXS-PRODUCT-SMOKE failed at %s (exit %s)\n" "$stage" "$rc"; fi' EXIT
                for ns in pid user mnt net; do
                  test "$(stat -Lc '%d:%i' "/proc/thread-self/ns/$ns")" = "$(stat -Lc '%d:%i' "/proc/1/ns/$ns")"
                done
                test "$(stat -Lc '%d:%i' /)" = "$(stat -Lc '%d:%i' /proc/1/root)"
                test -z "$(getent passwd 23100 || :)"
                test ! -e /zxs
                udevadm settle --timeout=15
                mkdir /mnt/zxs-acceptance-payload
                mount -o ro,nosuid,nodev,noexec /dev/disk/by-id/virtio-zxs-seed /mnt/zxs-acceptance-payload
                stage=install
                cd /mnt/zxs-acceptance-payload
                sha256sum -c SHA256SUMS
                install -d -m 0755 /zxs /zxs/bin /zxs/state
                install -m 0755 zxs helper /zxs/bin/
                install -m 0444 guest_product_smoke.py /run/zxs-acceptance-smoke.py
                h2_args=()
                if test -f workspace-h2.tar; then
                  install -d -m 0755 /opt/zxs-fixture-workspace
                  tar -xf workspace-h2.tar -C /opt/zxs-fixture-workspace --no-same-owner --no-same-permissions
                  find /opt/zxs-fixture-workspace -type d -exec chmod 0755 {} +
                  key=/opt/zxs-fixture-workspace/certs/server.key
                  find /opt/zxs-fixture-workspace -type f ! -path "$key" -exec chmod 0644 {} +
                  chmod 0400 "$key"
                  chown 23100:23100 "$key"
                  h2_args+=(--workspace-h2)
                fi
                user_flags=(--no-new-privs)
                fuse_requested=false
                if test -d fuse-deb; then
                  stage=offline-fuse-inputs
                  repo=/mnt/zxs-acceptance-payload/fuse-deb
                  printf 'deb [trusted=yes] file://%s ./\n' "$repo" > /run/zxs-fuse-fixture.list
                  install -d -m 0755 /run/zxs-fuse-fixture-lists
                  opts=(-o Dir::Etc::main=/dev/null -o Dir::Etc::parts=-
                        -o Dir::Etc::sourceparts=- -o Dir::Etc::sourcelist=/run/zxs-fuse-fixture.list
                        -o Dir::State::lists=/run/zxs-fuse-fixture-lists
                        -o Acquire::Languages=none -o APT::Update::Error-Mode=any)
                  apt-get "${opts[@]}" update
                  DEBIAN_FRONTEND=noninteractive apt-get "${opts[@]}" --yes --no-remove \
                    --no-install-recommends install fuse3=3.18.3-1 libfuse3-4=3.18.3-1 \
                    python3-pyfuse3=3.5.0-3 python3-trio=0.34.0-1
                  [[ "$(dpkg-query -W -f='${Version}' fuse3)" == 3.18.3-1 ]]
                  [[ "$(dpkg-query -W -f='${Version}' libfuse3-4)" == 3.18.3-1 ]]
                  [[ "$(dpkg-query -W -f='${Version}' python3-pyfuse3)" == 3.5.0-3 ]]
                  [[ "$(dpkg-query -W -f='${Version}' python3-trio)" == 0.34.0-1 ]]
                  modprobe fuse
                  udevadm settle --timeout=15
                  test -c /dev/fuse
                  test "$(stat -c '%u:%a' /usr/bin/fusermount3)" = 0:4755
                  test "$(/usr/bin/fusermount3 --version)" = 'fusermount3 version: 3.18.3'
                  fuse_requested=true
                  user_flags=()
                  h2_args=(--workspace-fuse)
                fi
                cd /
                umount /mnt/zxs-acceptance-payload
                install -d -m 0700 -o 23100 -g 23100 /zxs/state/headless /var/lib/zxs-acceptance-system
                stage=writable-mounts
                for role in data-a data-b recycle; do
                  dest="/mnt/zxs-acceptance-$role"
                  mkdir -m 0755 "$dest"
                  mount -t ext4 -o rw,nosuid,nodev,noexec "/dev/disk/by-id/virtio-zxs-smoke-$role" "$dest"
                  rmdir "$dest/lost+found"
                  chown 23100:23100 "$dest"
                  chmod 0700 "$dest"
                done
                if [[ "$fuse_requested" == true ]]; then
                  stage=private-workspace-device
                  dest=/mnt/zxs-acceptance-workspace
                  mkdir -m 0755 "$dest"
                  mount -t ext4 -o rw,nosuid,nodev,noexec /dev/disk/by-id/virtio-zxs-smoke-workspace "$dest"
                  mount --make-private "$dest"
                  rmdir "$dest/lost+found"
                  chown 23100:23100 "$dest"
                  chmod 0700 "$dest"
                fi
                printf '%s\n' same-sha-disposable-guest > /run/zxs-acceptance-fixture
                chmod 0444 /run/zxs-acceptance-fixture
                stage=ordinary-product-smoke
                setpriv --reuid=23100 --regid=23100 --clear-groups "${user_flags[@]}" \
                  python3 -I -B /run/zxs-acceptance-smoke.py "${h2_args[@]}"
                stage=cold-start-missing-data
                umount /mnt/zxs-acceptance-data-a
                if mountpoint -q /mnt/zxs-acceptance-data-a; then exit 1; fi
                test "$(stat -c '%u:%a' /mnt/zxs-acceptance-data-a)" = 0:755
                status=0
                timeout -k 2s 15s setpriv --reuid=23100 --regid=23100 --clear-groups --no-new-privs \
                  /zxs/bin/zxs --listen 127.0.0.1:38831 > /run/zxs-cold-start.log 2>&1 || status=$?
                test "$status" -eq 1
                grep -qxF 'zxs: selected storage requires its exact private directory' /run/zxs-cold-start.log
                printf '%s\n' 'ZXS-PRODUCT-SMOKE cold start rejected absent enrolled DATA disk'
                stage=remount-positive-control
                mount -t ext4 -o rw,nosuid,nodev,noexec \
                  /dev/disk/by-id/virtio-zxs-smoke-data-a /mnt/zxs-acceptance-data-a
                setpriv --reuid=23100 --regid=23100 --clear-groups --no-new-privs \
                  python3 -I /run/zxs-acceptance-smoke.py --remount-control
          power_state:
            mode: poweroff
            timeout: 60
            condition: true
          CLOUD
          "${tool_env[@]}" "$tools/usr/bin/genisoimage" -quiet -volid cidata -joliet -rock -output seed.iso seed
          firmware="$tools/usr/share/OVMF"
          cp "$firmware/OVMF_VARS_4M.fd" vars.fd
          extra_drives=()
          if [[ "$WORKSPACE_FUSE" == true ]]; then
            extra_drives=(-drive if=none,id=workspace,format=raw,file=workspace.ext4
                          -device virtio-blk-pci,drive=workspace,serial=zxs-smoke-workspace)
          fi
          boot_status=0
          timeout -k 15s 12m "${tool_env[@]}" "$tools/usr/bin/qemu-system-x86_64" \
            -no-user-config -nodefaults -machine q35 -accel tcg,thread=multi -smp 2 -m 2048 \
            -nic none -display none -monitor none -serial file:serial.log -no-reboot \
            -L "$tools/usr/share/qemu" \
            -drive if=pflash,format=raw,readonly=on,file="$firmware/OVMF_CODE_4M.fd" \
            -drive if=pflash,format=raw,file=vars.fd \
            -drive if=virtio,format=qcow2,file="$ZXS_GUEST_IMAGE" \
            -drive if=none,id=seed,format=raw,readonly=on,file=seed.iso \
            -device virtio-blk-pci,drive=seed,serial=zxs-seed \
            -drive if=none,id=dataa,format=raw,file=data-a.ext4 \
            -device virtio-blk-pci,drive=dataa,serial=zxs-smoke-data-a \
            -drive if=none,id=datab,format=raw,file=data-b.ext4 \
            -device virtio-blk-pci,drive=datab,serial=zxs-smoke-data-b \
            -drive if=none,id=recycle,format=raw,file=recycle.ext4 \
            -device virtio-blk-pci,drive=recycle,serial=zxs-smoke-recycle "${extra_drives[@]}" || boot_status=$?
          if test -f serial.log; then
            tr -d '\r' < serial.log | grep -aE '^ZXS-(PRODUCT-SMOKE|WORKSPACE-H2|WORKSPACE-FUSE) ' || true
          fi
          test "$boot_status" -eq 0
          test "$(tr -d '\r' < serial.log | grep -aFxc 'ZXS-PRODUCT-SMOKE setup, full append, two DATA disks, recycle and exact retries passed')" -eq 1
          test "$(tr -d '\r' < serial.log | grep -aFxc 'ZXS-PRODUCT-SMOKE cold start rejected absent enrolled DATA disk')" -eq 1
          test "$(tr -d '\r' < serial.log | grep -aFxc 'ZXS-PRODUCT-SMOKE same service became ready after original DATA remount')" -eq 1
          if [[ "$WORKSPACE_H2" == true ]]; then
            test "$(tr -d '\r' < serial.log | grep -aFxc 'ZXS-WORKSPACE-H2 fixture negotiated TLS, saved, looked up, and read exact bytes')" -eq 1
          fi
          if [[ "$WORKSPACE_FUSE" == true ]]; then
            test "$(tr -d '\r' < serial.log | grep -aFxc 'ZXS-WORKSPACE-FUSE original editable kernel mount, normal detach and exact full R3 submit passed')" -eq 1
          fi
