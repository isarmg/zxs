  diagnostic:
    name: Diagnostic (${{ matrix.id }})
    needs: select
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.browser_smoke == true && 60 || (matrix.web_production == true || matrix.smb_sdk == true) && 45 || 30 }}
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix: ${{ fromJSON(needs.select.outputs.matrix) }}
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      SOURCE_TREE: ${{ inputs.source_tree }}
      WORKFLOW_SHA: ${{ github.workflow_sha }}
      DIAGNOSTIC_ID: ${{ matrix.id }}
      TEST_COMMAND: ${{ matrix.command }}
      EXACT_TEST: ${{ matrix.exact_test }}
      EXACT_TESTS: ${{ matrix.exact_tests }}
      TEST_GROUPS: ${{ matrix.test_groups }}
      TEST_PACKAGE: ${{ matrix.package }}
      TEST_FILTER: ${{ matrix.test_filter }}
      TEST_TARGET: ${{ matrix.test_target }}
      TEST_RELEASE: ${{ matrix.release }}
      EXPECTED_COUNT: ${{ matrix.expected_count }}
      EXPECTED_IGNORED: ${{ matrix.expected_ignored || 0 }}
      REQUIRED_NAMES: ${{ matrix.required_names }}
      VERIFY_UNIT_INVENTORY: ${{ matrix.unit_inventory }}
      FORMAT_BASE: ${{ matrix.format_base }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: ${{ matrix.format_base != '' && '0' || '1' }}
          persist-credentials: false
      - name: Verify exact checkout and record source identity
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          if [[ -n "$SOURCE_TREE" ]]; then
            test "$(git rev-parse 'HEAD^{tree}')" = "$SOURCE_TREE"
          fi
          mkdir -p .diagnostics
          python3 - <<'PY' | tee .diagnostics/identity.json
          import json
          import os
          import subprocess
          print(json.dumps(dict(
              source_sha=os.environ['SOURCE_SHA'],
              checkout_sha=subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
              tree_sha=subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip(),
              workflow_sha=os.environ['WORKFLOW_SHA'],
              workflow_ref=os.environ['GITHUB_WORKFLOW_REF'],
              run_id=os.environ['GITHUB_RUN_ID'],
              run_attempt=os.environ['GITHUB_RUN_ATTEMPT'],
              diagnostic=os.environ['DIAGNOSTIC_ID'],
              command=os.environ['TEST_COMMAND'],
          ), indent=2))
          PY
          cat .diagnostics/identity.json >> "$GITHUB_STEP_SUMMARY"
          git ls-files -z | xargs -0 sha256sum --zero > .diagnostics/source-before.sha256z
          sha256sum .diagnostics/source-before.sha256z | tee .diagnostics/source-before.txt
      - name: Initialize isolated Cargo home
        if: matrix.tooling_only != true
        run: bash .github/scripts/initialize-cargo-home.sh
      - name: Install repository Rust toolchain
        if: matrix.tooling_only != true
        run: |
          rustup show active-toolchain
          rustc --version
          cargo --version
      - name: Install the official production Web WASM target
        if: matrix.web_production == true || matrix.quality == true
        run: rustup target add wasm32-unknown-unknown
      - name: Verify matching real Chrome and ChromeDriver
        if: matrix.browser_smoke == true
        run: |
          chrome="$(command -v google-chrome)"
          driver="$(command -v chromedriver)"
          "$chrome" --version
          "$driver" --version
          chrome_major=$("$chrome" --version | grep -oE '[0-9]+' | head -1)
          driver_major=$("$driver" --version | grep -oE '[0-9]+' | head -1)
          test "$chrome_major" = "$driver_major"
          echo "CHROME_BIN=$chrome" >> "$GITHUB_ENV"
          echo "CHROMEDRIVER=$driver" >> "$GITHUB_ENV"
      - name: Install official browser CJK fonts
        if: matrix.browser_smoke == true
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y fonts-noto-cjk
      - name: Cache locally compiled Rust build helpers
        if: matrix.web_production == true
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/rust-build-tools
          key: rust-build-tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'compliance/rust-sources.json') }}
          restore-keys: |
            rust-build-tools-${{ runner.os }}-${{ runner.arch }}-
      - name: Install official Ubuntu Samba SDK build prerequisites
        if: matrix.smb_sdk == true
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential pkg-config python3 perl libparse-yapp-perl flex bison m4 \
            clang libclang-dev libgnutls28-dev libkrb5-dev zlib1g-dev libpopt-dev
      - name: Cache pinned configured Samba source and real libraries
        if: matrix.smb_sdk == true
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/smb-sdk
          key: samba-4.23.0-${{ runner.os }}-${{ runner.arch }}-ubuntu24-${{ hashFiles('.github/scripts/smb-sdk.sh') }}
      - name: Check feature-changed Rust files without modifying source
        if: matrix.format_base != ''
        run: |
          python3 - <<'PY' 2>&1 | tee .diagnostics/format.log
          import json
          import os
          import subprocess
          from pathlib import Path
          base = os.environ['FORMAT_BASE']
          subprocess.run(['git', 'merge-base', '--is-ancestor', base, 'HEAD'], check=True)
          changed = subprocess.check_output(['git', 'diff', '--name-only', '--diff-filter=ACMRT', '-z', base, 'HEAD'])
          paths = [os.fsdecode(path) for path in changed.split(b'\0') if path.endswith(b'.rs')]
          if not paths:
              raise SystemExit('Reviewed feature has no changed Rust paths')
          command = ['rustfmt', '+1.99.0', '--edition', '2024', '--config', 'skip_children=true', '--check', *paths]
          Path('.diagnostics/format-command.json').write_text(json.dumps(command, indent=2))
          print(json.dumps(command))
          subprocess.run(command, check=True)
          PY
      # Reuse the repository's pinned cache action, with a separate namespace.
      # Only compiled artifacts are cached; Cargo home and test results are not.
      - name: Cache compiled native dependencies
        if: matrix.cache != ''
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/native
          key: workspace-diagnostic-ubuntu24-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', '.cargo/config.toml') }}-${{ matrix.cache }}-${{ inputs.source_sha }}
          restore-keys: |
            workspace-diagnostic-ubuntu24-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', '.cargo/config.toml') }}-${{ matrix.cache }}-
      - name: Verify focused selector matches exactly one test
        if: matrix.exact_test != ''
        run: |
          cargo test --locked --offline -p "${TEST_PACKAGE:-storage-server}" --lib "$EXACT_TEST" -- --exact --list 2>&1 | tee .diagnostics/list.log
          python3 - <<'PY'
          import os
          from pathlib import Path
          lines = Path('.diagnostics/list.log').read_text().splitlines()
          tests = [line for line in lines if line.endswith(': test')]
          expected = [os.environ['EXACT_TEST'] + ': test']
          if tests != expected:
              raise SystemExit(f'Expected exactly {expected!r}, found {tests!r}')
          PY
      - name: Inventory focused module tests and require named regression bodies
        if: matrix.test_filter != '' || matrix.test_target != ''
        run: |
          profile=()
          if [[ "$TEST_RELEASE" == 'true' ]]; then
            profile=(--release)
          fi
          target=(--lib "$TEST_FILTER")
          if [[ -n "$TEST_TARGET" ]]; then
            target=(--test "$TEST_TARGET")
          fi
          cargo test --locked --offline "${profile[@]}" -p "$TEST_PACKAGE" "${target[@]}" -- --list 2>&1 | tee .diagnostics/list.log
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          tests = [line[:-6] for line in Path('.diagnostics/list.log').read_text().splitlines() if line.endswith(': test')]
          if not tests:
              raise SystemExit('Module selector matched zero tests')
          expected = os.environ['EXPECTED_COUNT']
          if expected and len(tests) != int(expected):
              raise SystemExit(f'Expected exactly {expected} listed test bodies; found {len(tests)}')
          for name in json.loads(os.environ['REQUIRED_NAMES']):
              matches = [test for test in tests if test.endswith('::' + name)]
              if len(matches) != 1:
                  raise SystemExit(f'Expected one regression body named {name!r}; found {matches!r}')
          print(f'Inventoried {len(tests)} tests for {os.environ["TEST_FILTER"] or os.environ["TEST_TARGET"]}')
          PY
          cargo test --locked --offline "${profile[@]}" -p "$TEST_PACKAGE" "${target[@]}" -- --ignored --list 2>&1 | tee .diagnostics/ignored-list.log
          if [[ -n "$EXPECTED_COUNT" ]]; then
            python3 - <<'PY'
          import os
          from pathlib import Path
          ignored = [line for line in Path('.diagnostics/ignored-list.log').read_text().splitlines() if line.endswith(': test')]
          if len(ignored) != int(os.environ['EXPECTED_IGNORED']):
              raise SystemExit(f'Ignored inventory differs from the reviewed source: {ignored!r}')
          PY
          fi
      - name: Inventory complete server unit bodies and existing ignored tests
        if: matrix.unit_inventory == true
        run: |
          cargo test --locked --offline -p storage-server --lib --bins -- --list 2>&1 | tee .diagnostics/list.log
          cargo test --locked --offline -p storage-server --lib --bins -- --ignored --list 2>&1 | tee .diagnostics/ignored-list.log
          python3 - <<'PY'
          from pathlib import Path
          tests = [line for line in Path('.diagnostics/list.log').read_text().splitlines() if line.endswith(': test')]
          if not tests:
              raise SystemExit('Server unit selector matched zero tests')
          print(f'Inventoried {len(tests)} server unit test bodies')
          PY
      - name: Execute grouped reviewed selectors
        if: matrix.exact_tests != '' || matrix.test_groups != ''
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import subprocess
          from pathlib import Path
          overall = 0
          groups = json.loads(os.environ['TEST_GROUPS']) if os.environ['TEST_GROUPS'] else [
              dict(selector=name, count=1, required=[name], exact=True)
              for name in json.loads(os.environ['EXACT_TESTS'])
          ]
          for index, group in enumerate(groups, 1):
              name = group['selector']
              base = ['cargo', 'test', '--locked', '--offline', '-p', group.get('package', os.environ['TEST_PACKAGE'])]
              if group.get('features'):
                  base.extend(['--features', ','.join(group['features'])])
              if group.get('test_target'):
                  base.extend(['--test', group['test_target']])
              elif group.get('bin'):
                  base.extend(['--bin', group['bin']])
              else:
                  base.append('--lib')
              if name:
                  base.append(name)
              base.append('--')
              if group.get('exact'):
                  base.append('--exact')
              def run(label, flags):
                  command = base + flags
                  Path(f'.diagnostics/exact-{index}-{label}-command.json').write_text(json.dumps(command, indent=2))
                  result = subprocess.run(command, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True)
                  Path(f'.diagnostics/exact-{index}-{label}.log').write_text(result.stdout)
                  print(json.dumps(command), flush=True)
                  print(result.stdout, flush=True)
                  return result
              listed = run('list', ['--list'])
              if listed.returncode:
                  raise SystemExit('Reviewed inventory compilation failed')
              ignored = run('ignored', ['--ignored', '--list'])
              if listed.returncode or ignored.returncode:
                  raise SystemExit('Reviewed inventory command failed')
              names = [line[:-6] for line in listed.stdout.splitlines() if line.endswith(': test')]
              ignored_names = [line[:-6] for line in ignored.stdout.splitlines() if line.endswith(': test')]
              required_names = list(group.get('required', []))
              for suffix in group.get('required_suffixes', []):
                  matches = [test for test in names if test.endswith('::' + suffix)]
                  if len(matches) != 1:
                      raise SystemExit(f'Required suffix inventory mismatch: {suffix}: {matches!r}')
                  required_names.extend(matches)
              if not names or len(names) != group.get('count', len(names)) or any(names.count(required) != 1 or required in ignored_names for required in required_names):
                  raise SystemExit(f'Reviewed inventory mismatch: {name}: {names!r}')
              if ignored_names and not group.get('allow_ignored'):
                  raise SystemExit(f'Required reviewed group has ignored tests: {name}')
              if 'ignored_suffixes' in group and sorted(test.rsplit('::', 1)[-1] for test in ignored_names) != sorted(group['ignored_suffixes']):
                  raise SystemExit(f'Existing ignored inventory changed: {ignored_names!r}')
              Path(f'.diagnostics/exact-{index}-inventory.json').write_text(json.dumps(dict(
                  selector=name, tests=names, ignored=ignored_names, required=required_names), indent=2))
              result = run('test', ['--nocapture'])
              summaries = re.findall(r'test result: (?:ok|FAILED)\. (\d+) passed; (\d+) failed; (\d+) ignored;', result.stdout)
              if result.returncode or len(names) <= len(ignored_names) or summaries != [(str(len(names) - len(ignored_names)), '0', str(len(ignored_names)))]:
                  overall = 1
              for required in required_names:
                  if not re.search(r'^test ' + re.escape(required) + r'(?: - should panic)? \.\.\. ok$', result.stdout, re.MULTILINE):
                      overall = 1
          raise SystemExit(overall)
          PY
      - name: Execute selected locked offline tests and retain failures
        if: matrix.repetitions != 10 && matrix.format_base == '' && matrix.exact_tests == '' && matrix.test_groups == ''
        run: |
          printf 'Source: %s\nCommand: %s\n' "$SOURCE_SHA" "$TEST_COMMAND" | tee .diagnostics/command.txt
          set +e
          bash -euo pipefail -c "$TEST_COMMAND" 2>&1 | tee .diagnostics/test.log
          status=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$status" > .diagnostics/exit-code.txt
          if [[ -n "$EXACT_TEST" ]]; then
            python3 - <<'PY'
          import re
          from pathlib import Path
          log = Path('.diagnostics/test.log').read_text()
          results = re.findall(r'test result: (?:ok|FAILED)\. (\d+) passed; (\d+) failed; (\d+) ignored;', log)
          if len(results) != 1 or sum(map(int, results[0][:2])) != 1 or int(results[0][2]) != 0:
              raise SystemExit(f'Expected one executed, non-ignored test; found {results!r}')
          PY
          fi
          if [[ -n "$TEST_FILTER" || -n "$TEST_TARGET" ]]; then
            python3 - <<'PY'
          import re
          from pathlib import Path
          expected = sum(line.endswith(': test') for line in Path('.diagnostics/list.log').read_text().splitlines())
          results = re.findall(r'test result: (?:ok|FAILED)\. (\d+) passed; (\d+) failed; (\d+) ignored;', Path('.diagnostics/test.log').read_text())
          if len(results) != 1 or sum(map(int, results[0])) != expected or sum(map(int, results[0][:2])) == 0:
              raise SystemExit(f'Executed count must match {expected} listed tests; found {results!r}')
          PY
          fi
          if [[ "$VERIFY_UNIT_INVENTORY" == 'true' ]]; then
            python3 - <<'PY'
          import re
          from pathlib import Path
          expected = sum(line.endswith(': test') for line in Path('.diagnostics/list.log').read_text().splitlines())
          ignored = sum(line.endswith(': test') for line in Path('.diagnostics/ignored-list.log').read_text().splitlines())
          results = re.findall(r'test result: (?:ok|FAILED)\. (\d+) passed; (\d+) failed; (\d+) ignored;', Path('.diagnostics/test.log').read_text())
          counts = [tuple(map(int, result)) for result in results]
          if sum(sum(result) for result in counts) != expected or sum(result[2] for result in counts) != ignored or expected <= ignored:
              raise SystemExit(f'Server unit execution must match {expected} listed bodies and {ignored} ignored bodies; found {results!r}')
          PY
          fi
          exit "$status"
      - name: Require real Chrome history cancellation witness
        if: matrix.browser_smoke == true
        run: |
          test "$(grep -cF 'PASS synthetic history AbortSignal replacement, late completion ownership, same-file alias context and navigation cleanup' .diagnostics/test.log)" = 1
      - name: Retain real browser failure diagnostics
        if: always() && matrix.browser_smoke == true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-history-browser-diagnostics-${{ inputs.source_sha }}
          path: artifacts/browser-smoke/diagnostics/
          if-no-files-found: warn
          retention-days: 7
      - name: Verify actual real SDK inventory and callback witnesses
        if: matrix.smb_sdk == true
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path
          names = [line[:-6] for line in Path('.diagnostics/sdk-list.log').read_text().splitlines() if line.endswith(': test')]
          ignored = [line[:-6] for line in Path('.diagnostics/sdk-ignored-list.log').read_text().splitlines() if line.endswith(': test')]
          log = Path('.diagnostics/test.log').read_text()
          counts = [tuple(map(int, row)) for row in re.findall(r'test result: (?:ok|FAILED)\. (\d+) passed; (\d+) failed; (\d+) ignored;', log)]
          # The panic-isolation test prints a nested one-test process summary.
          # Match the full SDK unit inventory rather than adding that subprocess.
          counts = [row for row in counts if sum(row) == len(names)]
          if len(names) <= len(ignored) or len(counts) != 1 or counts[0][2] != len(ignored) or counts[0][1]:
              raise SystemExit(f'Real SDK execution does not match actual inventory: {len(names)}, {counts!r}')
          for name in json.loads(os.environ['REQUIRED_NAMES']):
              if names.count(name) != 1 or name in ignored or not re.search(r'^test ' + re.escape(name) + r' \.\.\. ok$', log, re.MULTILINE):
                  raise SystemExit(f'Real Samba SDK callback witness did not pass: {name}')
          Path('.diagnostics/sdk-results.json').write_text(json.dumps(dict(tests=names, ignored=ignored, summaries=counts), indent=2))
          print(f'Verified real Samba SDK tests: {counts!r}; required callbacks passed')
          PY
      - name: Retain production assets for native acceptance in this run
        if: matrix.web_production == true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-dist
          path: build/web/
          if-no-files-found: error
          retention-days: 7

      - name: Retain browser template contract fixture
        if: matrix.web_production == true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: csr-template-fixture
          path: target/csr-template-check/output/
          if-no-files-found: error
          retention-days: 7
      - name: Verify nonzero release tooling fixture summaries
        if: always() && matrix.release_fixtures == true
        run: |
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path
          log = Path('.diagnostics/test.log').read_text()
          counts = re.findall(r'^Ran ([1-9][0-9]*) tests? in ', log, re.MULTILINE)
          if len(counts) != 1 or not re.search(r'^OK$', log, re.MULTILINE):
              raise SystemExit('Release unittest fixtures did not report one nonzero passing summary')
          package = 'PASS release archives retain complete documentation and assembly emits standalone installation instructions'
          modes = ['new', 'resume', 'network', 'forbidden', 'public', 'foreign', 'malformed', 'corrupt', 'remote-extra', 'local-change']
          if package not in log or any('PASS mock release publication: ' + mode not in log for mode in modes):
              raise SystemExit('Offline package or mocked publication fixtures did not complete')
          summary = dict(python_tests=int(counts[0]), package_fixture='passed', mock_publication_modes=modes)
          Path('.diagnostics/fixture-summary.json').write_text(json.dumps(summary, indent=2))
          print(json.dumps(summary))
          PY
      - name: Execute the exact spool regression ten times and require every attempt
        if: matrix.repetitions == 10
        run: |
          printf 'Source: %s\nCommand: %s\n' "$SOURCE_SHA" "$TEST_COMMAND" | tee .diagnostics/command.txt
          overall_status=0
          for attempt in {1..10}; do
            log=".diagnostics/attempt-$attempt.log"
            printf 'Source: %s\nAttempt: %s/10\nCommand: %s\n' "$SOURCE_SHA" "$attempt" "$TEST_COMMAND" | tee "$log"
            set +e
            bash -euo pipefail -c "$TEST_COMMAND" 2>&1 | tee -a "$log"
            status=${PIPESTATUS[0]}
            set -e
            printf '%s\n' "$status" > ".diagnostics/attempt-$attempt.exit-code"
            if [[ "$status" != 0 ]]; then
              overall_status=$status
            fi
            if ! python3 - "$log" <<'PY'
          import re
          import sys
          from pathlib import Path
          results = re.findall(r'test result: (?:ok|FAILED)\. (\d+) passed; (\d+) failed; (\d+) ignored;', Path(sys.argv[1]).read_text())
          if len(results) != 1 or sum(map(int, results[0][:2])) != 1 or int(results[0][2]) != 0:
              raise SystemExit(f'Expected exactly one executed, non-ignored spool test; found {results!r}')
          PY
            then
              overall_status=1
            fi
            printf '%s\t%s\n' "$attempt" "$status" >> .diagnostics/attempts.tsv
          done
          printf '%s\n' "$overall_status" > .diagnostics/exit-code.txt
          exit "$overall_status"
      - name: Verify tracked source contents are unchanged
        if: always()
        run: |
          git diff --exit-code HEAD
          git ls-files -z | xargs -0 sha256sum --zero > .diagnostics/source-after.sha256z
          sha256sum .diagnostics/source-after.sha256z | tee .diagnostics/source-after.txt
          cmp .diagnostics/source-before.sha256z .diagnostics/source-after.sha256z
      - name: Record diagnostic SHA256 manifest
        if: always()
        run: |
          cd .diagnostics
          find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
          cat SHA256SUMS
      - name: Retain source identity, exact commands and test output
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: workspace-${{ inputs.source_sha }}-${{ matrix.id }}-${{ github.run_attempt }}
          path: .diagnostics/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  native-release-browser:
    name: ${{ inputs.scope == 'history-window-web-browser' && 'Real Chrome history windows and observer lifetime' || 'Extracted native release and browser acceptance' }}
    if: inputs.scope == 'native-release-acceptance' || inputs.scope == 'history-window-web-browser'
    needs: diagnostic
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      SOURCE_TREE: ${{ inputs.source_tree }}
      WORKFLOW_SHA: ${{ github.workflow_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - name: Verify native checkout identity and preserve tracked source hashes
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$SOURCE_TREE"
          mkdir -p .native-diagnostics
          printf 'source_sha=%s\nsource_tree=%s\nworkflow_sha=%s\nrun_id=%s\n' \
            "$SOURCE_SHA" "$SOURCE_TREE" "$WORKFLOW_SHA" "$GITHUB_RUN_ID" | tee .native-diagnostics/identity.txt
          git ls-files -z | xargs -0 sha256sum --zero > .native-diagnostics/source-before.sha256z
      - name: Initialize official isolated Cargo home
        run: bash .github/scripts/initialize-cargo-home.sh
      - name: Install repository Rust 1.99 toolchain
        run: |
          rustup show active-toolchain
          rustc --version | tee .native-diagnostics/rustc.txt
          grep -E '^rustc 1\.99\.0 ' .native-diagnostics/rustc.txt
      - name: Fetch production Web assets from this workflow run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-dist
          path: build/web
      - name: Fetch browser template contract fixture from this run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: csr-template-fixture
          path: target/csr-template-check/output
      - name: Verify runner Chrome and ChromeDriver
        run: |
          chrome="$(command -v google-chrome)"
          driver="$(command -v chromedriver)"
          "$chrome" --version
          "$driver" --version
          chrome_major=$("$chrome" --version | grep -oE '[0-9]+' | head -1)
          driver_major=$("$driver" --version | grep -oE '[0-9]+' | head -1)
          test "$chrome_major" = "$driver_major"
          echo "CHROME_BIN=$chrome" >> "$GITHUB_ENV"
          echo "CHROMEDRIVER=$driver" >> "$GITHUB_ENV"
      - name: Install CJK fonts for the Chinese screenshot
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y fonts-noto-cjk
      - name: Build and exercise the exact native release and browser packages
        if: inputs.scope == 'native-release-acceptance'
        env:
          ZXS_SMOKE_SCREENSHOT: artifacts/web-file-manager.png
          ZXS_VIEWPORT_PREVIEWS: artifacts/viewport-previews
        run: |
          export RELEASE_VERSION="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')"
          python3 .github/scripts/release-native.py 2>&1 | tee .native-diagnostics/native-build.log
          cp target/native/x86_64-unknown-linux-gnu/release/BUILD.txt .native-diagnostics/native-build-BUILD.txt
          cargo test --locked --offline --release -p browser-smoke -- --list 2>&1 | tee .native-diagnostics/browser-list.log
          cargo test --locked --offline --release -p browser-smoke 2>&1 | tee .native-diagnostics/browser-unit.log
          python3 - <<'PY'
          import re
          from pathlib import Path
          listed = sum(line.endswith(': test') for line in Path('.native-diagnostics/browser-list.log').read_text().splitlines())
          counts = re.findall(r'test result: (?:ok|FAILED)\. (\d+) passed; (\d+) failed; (\d+) ignored;', Path('.native-diagnostics/browser-unit.log').read_text())
          if not listed or sum(sum(map(int, row)) for row in counts) != listed or any(int(row[1]) or int(row[2]) for row in counts):
              raise SystemExit(f'Browser unit execution differs from {listed} nonignored listed tests: {counts!r}')
          print(f'Verified {listed} executed browser harness unit tests')
          PY
          bash .github/scripts/release-package.sh 2>&1 | tee .native-diagnostics/package.log
          bash .github/scripts/release-acceptance.sh 2>&1 | tee .native-diagnostics/release-acceptance.log
          python3 .github/scripts/check-csr-browser.py 2>&1 | tee .native-diagnostics/csr-browser.log
          bash .github/scripts/release-assemble.sh 2>&1 | tee .native-diagnostics/assembly.log
      - name: Exercise real Chrome history windows and owner disposal
        if: inputs.scope == 'history-window-web-browser'
        env:
          ZXS_REQUIRE_BROWSER: '1'
          ZXS_SMOKE_SCREENSHOT: artifacts/web-file-manager.png
        run: |
          # The unchanged fixture's 20 bodies passed on 01c88040 in run 41106335001.
          # Run the source's official browser-smoke build/Chrome/CSR commands.
          bash -euo pipefail <<'BASH' 2>&1 | tee .native-diagnostics/history-window-browser.log
          cargo build --locked --offline -p storage-server -p storage-rescue
          cargo run --locked --offline -p browser-smoke -- \
            --cli-bin "$PWD/target/native/debug/zxs" --web-dir "$PWD/build/web" \
            --screenshot "$ZXS_SMOKE_SCREENSHOT"
          python3 .github/scripts/check-csr-browser.py
          BASH
          grep -Fx 'PASS synthetic history AbortSignal replacement, late completion ownership, real-file selection and navigation cleanup' .native-diagnostics/history-window-browser.log
          grep -Fx 'PASS synthetic 32-node window replacement/observer disposal, real-ID tag and merge basis review, replace-only UTF-8 fields and stale auxiliary delivery (no writes submitted)' .native-diagnostics/history-window-browser.log
      - name: Retain history window browser failure diagnostics
        if: always() && inputs.scope == 'history-window-web-browser'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: history-window-browser-failure-${{ inputs.source_sha }}
          path: artifacts/browser-smoke/diagnostics/
          if-no-files-found: warn
          retention-days: 7
      - name: Retain verified installation candidate only
        if: inputs.scope == 'native-release-acceptance'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installation-candidate-linux-web
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7
      - name: Retain template browser result and exact input identity
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: csr-template-browser
          path: target/csr-template-check/output/*json
          if-no-files-found: error
          retention-days: 7
      - name: Retain real Web file manager screenshot
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-screenshot
          path: artifacts/web-file-manager.png
          if-no-files-found: error
          retention-days: 7
      - name: Retain responsive Web viewport previews
        if: always() && inputs.scope == 'native-release-acceptance'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: viewport-previews
          path: artifacts/viewport-previews/
          if-no-files-found: warn
          retention-days: 7
      - name: Verify native acceptance tracked source is unchanged
        if: always()
        run: |
          git diff --exit-code HEAD
          git ls-files -z | xargs -0 sha256sum --zero > .native-diagnostics/source-after.sha256z
          cmp .native-diagnostics/source-before.sha256z .native-diagnostics/source-after.sha256z
      - name: Record exact browser diagnostic SHA256 manifest
        if: always()
        run: |
          cd .native-diagnostics
          find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
      - name: Retain native build receipt and exact acceptance logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-acceptance-${{ inputs.source_sha }}-${{ github.run_attempt }}
          path: .native-diagnostics/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
