name: History recovery monitor regression

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: history-monitor-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: '0'
  RUSTUP_TOOLCHAIN: '1.99.0'
  RUST_BACKTRACE: '1'

jobs:
  monitor:
    name: Baseline 1025 recovery and observer regression
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout measurement carrier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: carrier
      - name: Checkout exact old baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: isarmg/zxs
          ref: e2f33d9882cf7263412d9370b6a703e0b216357d
          persist-credentials: false
          path: baseline-source
      - name: Install trace and resource tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y strace time
      - name: Initialize isolated offline Cargo home
        run: bash carrier/.github/scripts/initialize-cargo-home.sh
      - name: Record fixed toolchain and runner
        run: |
          mkdir -p provenance
          rustup toolchain install 1.99.0 --profile minimal
          rustup component add rustfmt --toolchain 1.99.0
          rustc +1.99.0 --version --verbose > provenance/rustc.txt
          cargo +1.99.0 --version > provenance/cargo.txt
          strace --version > provenance/strace.txt
          lscpu --json > provenance/cpu.json
          df -B1 > provenance/filesystem.txt
          rustfmt +1.99.0 --edition 2024 --check carrier/tools/history-scale-bench/driver.rs > provenance/rustfmt-check.log 2>&1
      - name: Verify complete evidence tooling including exit race cases
        run: python3 -m unittest discover -s carrier/test/history-scale-bench -p 'test_*.py' -v > provenance/python-tests.log 2>&1
      - name: Register unchanged normal driver on fixed baseline
        run: python3 carrier/tools/history-scale-bench/prepare.py --source baseline-source > provenance/baseline-registration.json
      - name: Build baseline and verify actual production features
        working-directory: baseline-source
        run: |
          cargo tree --locked --offline -p perf-check -e normal,build,features --features history-scale-baseline > ../provenance/baseline-features.txt
          cargo build --locked --offline --release -p perf-check --bin history-scale-driver --features history-scale-baseline --message-format=json > ../provenance/baseline-build.jsonl 2> ../provenance/baseline-build.stderr.log
          python3 ../carrier/tools/history-scale-bench/verify_build.py --input ../provenance/baseline-build.jsonl > ../provenance/baseline-actual-artifacts.json
          git diff -- tools/perf-check/Cargo.toml > ../provenance/baseline-harness.patch
          sha256sum Cargo.lock target/native/release/history-scale-driver > ../provenance/baseline-sha256.txt
      - name: Prepare new fixture and repeat only the failed measurement stage
        run: |
          python3 carrier/test/history-scale-bench/monitor_regression.py \
            --binary baseline-source/target/native/release/history-scale-driver \
            --source baseline-source \
            --output evidence/monitor-1025
      - name: Retain unchanged original failure identity and new evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: history-monitor-1025-${{ github.run_attempt }}
          path: |
            provenance/
            evidence/
            !evidence/**/pool/**
          if-no-files-found: error
          retention-days: 14
