# Reuse this already registered, optional workflow path on this verification
# branch; GitHub cannot dispatch a newly named branch-only workflow.
name: Workspace diagnostics
run-name: Workspace diagnostics (${{ inputs.scope }}) @ ${{ inputs.source_sha }}

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact 40-character lowercase source commit SHA
        required: true
        type: string
      source_tree:
        description: Optional exact source tree SHA
        required: false
        type: string
      scope:
        description: Bounded diagnostic selection (does not replace required CI)
        required: true
        default: all
        type: choice
        options: [all, smb-close, workspace-admission, auth-owner, server, server-unit, packages, namespace-borrow, namespace-format, spool-retirement, file-path-records, file-path-format, snapshot-write-sets, retirement-critical, retirement-preservation, retirement-negative, retirement-repair, retirement-overlap, native-release-fixtures, native-release-acceptance, namespace-stage-b, namespace-stage-b-repair, smb-stream, smb-stream-repair, smb-stream-sdk, native-smb-overlap, detached-history, detached-history-additions, detached-history-overlap, payload-proof-budget, payload-proof-format, payload-quality, detached-listing, scrub-planning, scrub-format, web-history-native, web-history-format, web-history-browser, detached-backup-listing, mature-static, mature-listing-repair, history-window, history-window-repair, history-window-web, scrub-terminal-diagnostics, cold-web-scrub, mature-doc-contracts, history-window-web-browser, history-main-precheck, history-main-overlap, history-model-static, history-contract-repair, history-tool-adoption-quality, scrub-periodic-scheduling, recovery-record-transfer]

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: '1'
  CARGO_INCREMENTAL: '0'

jobs:
  select:
    name: Validate source and select independent diagnostics
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Check diagnostic workflow contexts
        run: python3 .github/scripts/check-workflows.py .github/workflows/history-tooling.yml
      - name: Validate explicit source SHA and select bounded matrix
        id: select
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          SOURCE_TREE: ${{ inputs.source_tree }}
          SCOPE: ${{ inputs.scope }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re

          source = os.environ['SOURCE_SHA']
          if not re.fullmatch(r'[0-9a-f]{40}', source):
              raise SystemExit('source_sha must be an exact 40-character lowercase commit SHA')
          tree = os.environ['SOURCE_TREE']
          if tree and not re.fullmatch(r'[0-9a-f]{40}', tree):
              raise SystemExit('source_tree must be an exact 40-character lowercase tree SHA')
          retirement_pin = (
              ('eb6ee0ef3450c836a8ecafb67bec66aa536ef398', '696d43df45ea9a7036e4e3019cafa38b2d94e3af')
              if os.environ['SCOPE'] == 'retirement-overlap' else
              ('b8e6bf9e0d60bd76466d5683ab46d70878ac27b0', 'db8a3f6aedc81c108d46ce49cd1d92e7ee4a6c3a')
              if os.environ['SCOPE'] == 'retirement-repair' else
              ('778612309d3b661c044a06318761e49b75d0b47b', 'c70635a9c16f22184b7b8952dd5804c77e858afd')
              if os.environ['SCOPE'] == 'retirement-negative' else
              ('7107bedfa14cd0cde9a713571a83b889828920d6', '2d7dddf25f914f440de27163a6c25972a68019e0')
          )
          if os.environ['SCOPE'].startswith('retirement-') and (source, tree) != retirement_pin:
              raise SystemExit('Retirement diagnostics require the exact reviewed source and tree')
          if os.environ['SCOPE'] in ('native-release-fixtures', 'native-release-acceptance') and (source, tree) != (
              '7b38c66f9825bcf80bc69f3b5de8ac1b3602f6dc', '6b337f9366340abe6d47f14b3276f70787b5f4ee',
          ):
              raise SystemExit('Release fixtures require the exact reviewed source and tree')
          if os.environ['SCOPE'] == 'namespace-stage-b' and (source, tree) != (
              '954aeb962fcd5015ebab69cdb3d9966cbbc0ceab', 'eda5795a134d6d8c55b84475fe9593e370ac7400',
          ):
              raise SystemExit('Stage B diagnostics require the exact reviewed source and tree')
          if os.environ['SCOPE'] == 'namespace-stage-b-repair' and (source, tree) != (
              '2af128b5d1eaee2bbb7b5223f8574eeb1207f7c3', 'bbedf3f2dc7af196a276bf6fd968f79fa821db4b',
          ):
              raise SystemExit('Stage B repair diagnostics require the exact reviewed source and tree')
          if os.environ['SCOPE'] == 'smb-stream' and (source, tree) != (
              '486bb70f01f5d47d5b56193dce2381d0e44d2e8f', '4b9877902b78313d9098d86a812809054acf3ed9',
          ):
              raise SystemExit('SMB stream diagnostics require the exact reviewed source and tree')
          if os.environ['SCOPE'] == 'smb-stream-repair' and (source, tree) != (
              '48f1ddd92b648ef90742510957aa75176c733748', 'bcfe4fb034cc65e7ca3fea14f755acc8fb5efda8',
          ):
              raise SystemExit('SMB stream repair diagnostics require the exact reviewed source and tree')
          if os.environ['SCOPE'] == 'smb-stream-sdk' and (source, tree) != (
              '2a0b46be4457a87653cad0a597e550904f8102a3', '6ecf8f17fb1b2eca24236ccec3be946ec864dea5',
          ):
              raise SystemExit('SMB SDK retry requires the exact reviewed source and tree')
          if os.environ['SCOPE'] == 'native-smb-overlap' and (source, tree) != (
              '15b4b04b2e33cfd91abc398c391ad4442c28452f', '3ae7fc6e0a8a23fc9af5a232d235af4a64cf675c',
          ):
              raise SystemExit('Combined overlap requires the exact reviewed source and tree')
          if os.environ['SCOPE'] in ('detached-history', 'detached-history-additions') and (source, tree) != (
              'd2c93af9a63985f43e58dce600aa5aaa6cf4d154', '8b1348e9341d40394bb570a1508c6d2463ca7c37',
          ):
              raise SystemExit('Detached history diagnostics require the exact reviewed source and tree')
          if os.environ['SCOPE'] == 'detached-history-overlap' and (source, tree) != (
              '286ff86e73f52657fbf6f96b1fcc846fee1a4173', 'a9b23370998eab91c8f090a7f1a843c2a27249fb',
          ):
              raise SystemExit('Detached history overlap requires the exact reviewed merged source and tree')
          if os.environ['SCOPE'] == 'payload-proof-budget' and (source, tree) != (
              '76448d18cd8e5ffabf2c4e912260ec196fc2c399', 'ca67e3156d1b5e19f1ab4091c1e7d70a965b34d3',
          ):
              raise SystemExit('Payload proof diagnostics require the exact reviewed source and tree')
          if os.environ['SCOPE'] == 'payload-proof-format' and (source, tree) != (
              '3d6f119d207a66e93a264b6ba4b77dc02df7bfe7', '20b083fc65d1946a09c22d9aa9fa7eabcc866fc8',
          ):
              raise SystemExit('Payload proof formatting requires the exact formatting successor and tree')
          if os.environ['SCOPE'] == 'payload-quality' and (source, tree) != (
              '096f9a7f60025ca14781b179d9e7415f10c5b846', '22844376a82d99dc3c8f6422566eed21d02c932d',
          ):
              raise SystemExit('Quality reproduction requires the exact frozen source and tree')
          if os.environ['SCOPE'] == 'detached-listing' and (source, tree) != (
              '5ee74edd577c4ea1ba1568e667ae1bcc19549134', '9d79967107c42cf4c16df73aa93aa79f87bb878f',
          ):
              raise SystemExit('Detached listing diagnostics require the exact reviewed source and tree')
          if os.environ['SCOPE'] == 'scrub-planning' and (source, tree) != (
              '4d36b6adf74be177b013a0211bef09151a466331', '61f21430dd0ce86681d565ee36fd2bacf2a9c594',
          ):
              raise SystemExit('Scrub planning diagnostics require the exact reviewed source and tree')
          if os.environ['SCOPE'] == 'scrub-format' and (source, tree) != (
              '69718524644e23d6e4e77bda64436acc8f62e508', '86088fcc6c6fa02c6f7465aa2ad71f4516a4f0ae',
          ):
              raise SystemExit('Scrub formatting requires the exact formatting successor and tree')
          if os.environ['SCOPE'] == 'web-history-native' and (source, tree) != (
              '9848c4a7b3569e1bbd4dd509e266a2f24429ad6c', '306254217301e1ebcb6dafe7edd71791074aaedd',
          ):
              raise SystemExit('Web history diagnostics require the exact reviewed source and tree')
          if os.environ['SCOPE'] in ('web-history-format', 'web-history-browser') and (source, tree) != (
              'b7617e3f83df7f94526f54bec3b2d2527ce18928', '3f2bc6dfd731472c8c283e48ded8193ee082ce5e',
          ):
              raise SystemExit('Web history formatting and Chrome require the exact formatting successor and tree')
          if os.environ['SCOPE'] == 'mature-static' and (source, tree) != (
              '85fecf6149b0913f8ac53f579245102012f38ad9', 'bd99da2680440a0e8ca0a838da0d6985a4701644',
          ):
              raise SystemExit('Mature static closure requires the exact frozen source and tree')
          if os.environ['SCOPE'] == 'mature-listing-repair' and (source, tree) != (
              'f8e9167a509af8134945c8fa3f7bd10b2a21a865', '11338bdb876200d1f09a7beac4aab83e5cc7fa5e',
          ):
              raise SystemExit('Mature listing repair requires the exact reviewed layout fix and tree')
          if os.environ['SCOPE'] == 'history-window' and (source, tree) != (
              'e9b201d83b52ad982a5b6d0d7b9a82f2f7a674a2', 'f627b66705153302f8c276ed5347f3bd5fbdf1aa',
          ):
              raise SystemExit('History window diagnostics require the exact composed core/server source and tree')
          if os.environ['SCOPE'] == 'history-window-repair' and (source, tree) != (
              '7a38df46cbec602bc097bd1cac793001a307f27c', '70c3fef9d995afd8017608bd95a966f3ae9e137d',
          ):
              raise SystemExit('History window repair requires the exact strict-parser and consumer successor')
          if os.environ['SCOPE'] == 'history-window-web' and (source, tree) != (
              '16fdbbcd237052858a9e895d90761e5cfe41da11', '772057af1781ac65d2e31a3a241c35f35c7dcd8b',
          ):
              raise SystemExit('History window Web checkpoint requires the exact cross-layer source and tree')
          if os.environ['SCOPE'] == 'history-window-web-browser' and (source, tree) != (
              '0004c5f76d535ac5886a0f04351dc85b2579e122', 'afa0a719e55e3739563d7c85a728a32dfd6cad91',
          ):
              raise SystemExit('History browser requires the exact main/model/fixture composition and tree')
          if os.environ['SCOPE'] == 'scrub-terminal-diagnostics' and (source, tree) != (
              'bc51f061d4daa7f2a8d67f8851f913b150cfa04a', 'aeded80b572e29377d41149788f525b0eddee886',
          ):
              raise SystemExit('Scrub terminal diagnostics require the exact reviewed independent source and tree')
          if os.environ['SCOPE'] == 'cold-web-scrub' and (source, tree) != (
              '574b3b63fa100df126fd81f7c395241035dd00b8', '26e226df71c60d777749abd2496efe59ecf64d36',
          ):
              raise SystemExit('Cold/Web/scrub composition requires the exact frozen source and tree')
          if os.environ['SCOPE'] == 'mature-doc-contracts' and (source, tree) != (
              '26f406dc4336d434cb68f2885ff18a39cec99105', '5f7e8f37631a41d35fea2f6f37a5ab577d85b939',
          ):
              raise SystemExit('Mature documentation closure requires the exact anchor-only successor and tree')
          if os.environ['SCOPE'] in ('history-main-precheck', 'history-main-overlap') and (source, tree) != (
              '1ad83b64e9a5e1abd57142d9cc7902426f0f37d5', '6c8740cf43b798a5629e51ff90e082becfd8c1dc',
          ):
              raise SystemExit('History/main precheck requires the exact reviewed composition and tree')
          if os.environ['SCOPE'] == 'history-model-static' and (source, tree) != (
              '12872cac1e154d5afecfdde39112e921e41333ac', '88ebf5dd7298462b3bdd6dcfe1d8eb471f34bc6a',
          ):
              raise SystemExit('Model adoption static requires the exact tool-only composition and tree')
          if os.environ['SCOPE'] == 'history-contract-repair' and (source, tree) != (
              'c8ce99de07f2d0e673dcc71f9278f6ac570b3633', '5d5486f0229e52e18d4c4592a8b92cb5af95fc8b',
          ):
              raise SystemExit('Export-link repair requires the exact documentation-only successor and tree')
          if os.environ['SCOPE'] == 'history-tool-adoption-quality' and (source, tree) != (
              'd9848d62a6bb2b1d6788c4a6b51b19d69be52261', 'aefc134c019d655c680cc0b327c91ecd0bd14bef',
          ):
              raise SystemExit('History tooling quality requires the exact tool-only source and tree')
          if os.environ['SCOPE'] == 'scrub-periodic-scheduling' and (source, tree) != (
              '0964101860e4d5fa530f0a91ae2763a07fcaf9ce', 'c2587d7db37e9e022012f77b2df45d58a2687474',
          ):
              raise SystemExit('Periodic scrub scheduling requires the exact reviewed source and tree')
          if os.environ['SCOPE'] == 'recovery-record-transfer' and (source, tree) != (
              'a0b3ff448cf0872f1deb70c52de1dc35eb28cb8e', '6028ac768865d873c62c1ddb7b6d0be672f95dad',
          ):
              raise SystemExit('Recovery record transfer requires the exact reviewed source and tree')
          if os.environ['SCOPE'] == 'detached-backup-listing' and (source, tree) != (
              'afb719b0d4a17c2ca55e36ff5fd4fa7ff2f99d42', '26d75be5861b431c55ce46749c007c6678e36469',
          ):
              raise SystemExit('Detached backup listing requires the exact published reviewed source and tree')
          groups = {}
          for name, test in [
              ('smb-close', 'smb_rpc::tests::unchanged_smb_closes_reuse_resident_quota_but_disconnect_keeps_evidence'),
              ('workspace-admission', 'backend_admission_tests::typed_workspace_jobs_retain_admission_until_blocking_completion_after_cancellation'),
              ('auth-owner', 'backend_admission_tests::typed_jobs_hold_auth_owner_until_cancelled_worker_finishes'),
          ]:
              groups[name] = [dict(id=name, cache='server', exact_test=test,
                  command=f'cargo test --locked --offline -p storage-server --lib {test} -- --exact --nocapture')]
          groups['smb-close'].append(dict(id='smb-format',
              command='rustfmt +1.99.0 --edition 2024 --config skip_children=true --check test/server/unit/smb_rpc/tests.rs'))
          groups['server'] = [
              dict(id='server-unit', cache='server', command='cargo test --locked --offline -p storage-server --lib --bins -- --nocapture'),
              dict(id='server-doc', cache='server', command='cargo test --locked --offline -p storage-server --doc'),
          ]
          for target in ['http_engine', 'login_admission', 'telemetry_status', 'service_startup']:
              groups['server'].append(dict(id=f'server-{target}', cache='server',
                  command=f'cargo test --locked --offline -p storage-server --test {target} -- --nocapture'))
          groups['packages'] = [dict(id=package, cache=package,
              command=f'cargo test --locked --offline -p {package} -- --nocapture')
              for package in ['authentication', 'storage-contract', 'name-policy', 'platform-io',
                              'storage-client', 'storage-rescue', 'smb-protocol']]
          aggregate = sum(groups.values(), [])
          groups['server-unit'] = [dict(groups['server'][0], unit_inventory=True)]
          spool_test = 'http_spool::tests::retirement_waits_for_activation_and_cancelled_owner_never_publishes'
          groups['spool-retirement'] = [
              dict(id='spool-format', command='rustfmt +1.99.0 --edition 2024 --config skip_children=true --check test/server/unit/http_spool.rs'),
              dict(id='spool-retirement', cache='server', exact_test=spool_test, repetitions=10,
                  command=f'cargo test --locked --offline -p storage-server --lib {spool_test} -- --exact --nocapture'),
          ]
          files = [
              'src/engine/src/namespace.rs',
              'src/engine/src/business/namespace/query.rs',
              'src/engine/src/business/file_requests.rs',
              'src/engine/src/segment_store.rs',
              'src/engine/src/history_package.rs',
              'src/server/src/engine_backend/file_manager/listing.rs',
              'src/server/src/engine_backend/read_projection.rs',
              'test/engine/unit/namespace/borrowed_lookup_tests.rs',
              'test/engine/unit/business/namespace/query_tests.rs',
              'test/engine/unit/namespace/tests.rs',
              'test/engine/unit/namespace/owned_decode_tests.rs',
          ]
          groups['namespace-borrow'] = [
              dict(id='namespace-format', command='rustfmt +1.99.0 --edition 2024 --config skip_children=true --check ' + ' '.join(files)),
              dict(id='namespace-compile', cache='namespace-engine',
                  command='cargo check --locked --offline -p storage-engine -p storage-server'),
          ]
          witnesses = [
              'identity_predicates_match_owned_lookup_for_unicode_missing_and_wrong_kinds',
              'projection_borrows_leaf_ids_until_callback_returns',
              'lookup_preserves_reference_failure_before_a_delayed_composed_path_error',
              'owned_decode_moves_page_and_index_strings_from_authenticated_values',
              'owned_decode_keeps_reference_and_shape_error_precedence',
          ]
          for name, package, prefix in [
              ('engine-namespace', 'storage-engine', 'namespace::'),
              ('engine-file-requests', 'storage-engine', 'business::file_requests::'),
              ('server-read-projection', 'storage-server', 'engine_backend::read_projection::'),
              ('server-file-manager', 'storage-server', 'engine_backend::file_manager::'),
          ]:
              groups['namespace-borrow'].append(dict(id=name, cache=package,
                  package=package, test_filter=prefix, release=True,
                  required_names=json.dumps(witnesses if name == 'engine-namespace' else []),
                  command=f'cargo test --locked --offline --release -p {package} --lib {prefix} -- --nocapture'))
          groups['namespace-format'] = [groups['namespace-borrow'][0]]
          # The fifth changed path is docs/components/engine.md, not Rust.
          record_files = ['src/contract/src/model.rs', 'test/contract/unit/shared_records.rs',
              'test/engine/unit/business/file_paths_tests.rs',
              'test/engine/unit/container_storage/changes_tests.rs']
          groups['file-path-records'] = [dict(id='file-path-format',
              command='rustfmt +1.99.0 --edition 2024 --config skip_children=true --check ' + ' '.join(record_files))]
          for name, package, prefix, expected in [
              ('contract-path-records', 'storage-contract', 'shared_records::tests::path_', 2),
              ('engine-file-paths', 'storage-engine', 'business::file_paths_tests::', 8),
              ('engine-container-changes', 'storage-engine', 'container_storage::changes::tests::', 6),
          ]:
              groups['file-path-records'].append(dict(id=name, cache=package,
                  package=package, test_filter=prefix, release=False,
                  expected_count=expected, required_names='[]',
                  command=f'cargo test --locked --offline -p {package} --lib {prefix} -- --nocapture'))
          for name, test in [
              ('journal-snapshot-oracle', 'journal::snapshot_incremental_oracle_tests::incremental_snapshot_retains_fixed_publication_root_and_every_raw_object_byte'),
              ('history-projection-oracle', 'history_package::projection_delta_tests::every_projection_map_insert_delete_and_same_value_write_matches_full_oracle'),
              ('history-rename-proofs', 'history_package::tests::rename_nodes_preserve_body_proofs_and_mixed_lineage_through_purge_export_and_restore'),
          ]:
              groups['file-path-records'].append(dict(id=name, cache='storage-engine',
                  package='storage-engine', exact_test=test,
                  command=f'cargo test --locked --offline -p storage-engine --lib {test} -- --exact --nocapture'))
          groups['file-path-format'] = [groups['file-path-records'][0]]
          groups['snapshot-write-sets'] = []
          for name, prefix, expected in [
              ('journal-snapshot-set', 'journal::snapshot_incremental_oracle_tests::', 16),
              ('history-projection-set', 'history_package::projection_delta_tests::', 8),
          ]:
              groups['snapshot-write-sets'].append(dict(id=name, cache='storage-engine',
                  package='storage-engine', test_filter=prefix, release=False,
                  expected_count=expected, required_names='[]',
                  command=f'cargo test --locked --offline -p storage-engine --lib {prefix} -- --nocapture'))
          groups['snapshot-write-sets'].append(dict(id='workspace-namespace-preconditions',
              cache='storage-engine', package='storage-engine',
              test_target='workspace_namespace_preconditions', release=False,
              expected_count=3, required_names='[]',
              command='cargo test --locked --offline -p storage-engine --test workspace_namespace_preconditions -- --nocapture'))
          retirement = 'tests::published_workspace_retirement::'
          retirement_names = [
              'published_normal_workspaces_release_records_but_keep_replay_and_bytes',
              'published_abort_stays_cold_at_full_resident_quota_across_restart',
              'published_workspace_survives_system_loss_without_reactivating_record_charge',
              'unbound_terminal_records_cannot_bypass_quota_before_recovery_writes',
              'recovery_source_search_reads_old_full_generations_from_cold_workspaces',
              'published_completion_with_upload_owner_or_unknown_material_stays_resident',
              'published_cold_point_reads_and_recovery_hints_keep_exact_mirror_proof',
              'damaged_request_mirror_replays_admitted_cold_but_restart_keeps_record_resident',
          ]
          smb_quota = 'smb_rpc::tests::unchanged_smb_closes_reuse_resident_quota_but_disconnect_keeps_evidence'
          groups['retirement-critical'] = [
              dict(id='retirement-format', format_base='8f28d74ae1e3ead1f31e7a96a8abfd9e3ffa6d3f',
                  command='rustfmt +1.99.0 --edition 2024 --config skip_children=true --check'),
              dict(id='published-workspace-retirement', cache='storage-engine',
                  package='storage-engine', test_filter=retirement, expected_count=8,
                  required_names=json.dumps(retirement_names),
                  command=f'cargo test --locked --offline -p storage-engine --lib {retirement} -- --nocapture'),
              dict(id='retirement-smb-quota', cache='server', package='storage-server',
                  exact_test=smb_quota,
                  command=f'cargo test --locked --offline -p storage-server --lib {smb_quota} -- --exact --nocapture'),
          ]
          groups['retirement-preservation'] = []
          for name, prefix, expected in [
              ('cold-workspace-records', 'tests::cold_workspace_records::', 13),
              ('retained-workspace-budget', 'tests::retained_workspace_budget::', 13),
              ('runtime-workspace-limits', 'tests::runtime_workspace_limits::', 4),
              ('workspace-storage', 'engine::workspace_storage::tests::', 8),
              ('workspace-commit', 'engine::workspace_commit::tests::', 7),
              ('workspace-budget-boundary', 'engine::workspace_budget::tests::', 1),
              ('workspace-recovery', 'engine::recovery::tests::', 24),
              ('workspace-recovery-diagnostics', 'engine::recovery::diagnostics_tests::', 3),
              ('workspace-recovery-checkpoint', 'engine::recovery_checkpoint::tests::', 27),
              ('workspace-degraded-recovery', 'degraded_recovery::tests::', 17),
              ('workspace-historical-preservation', 'historical_save::tests::', 3),
              ('workspace-upload-preparation', 'upload_preparation', 7),
          ]:
              groups['retirement-preservation'].append(dict(id=name, cache='storage-engine',
                  package='storage-engine', test_filter=prefix, release=False,
                  expected_count=expected, required_names='[]',
