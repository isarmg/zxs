# Reuse this already registered, optional workflow path on this verification
# branch; GitHub cannot dispatch a newly named branch-only workflow.
name: Workspace diagnostics
run-name: Workspace diagnostics (${{ inputs.scope }}) @ ${{ inputs.source_sha }}

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact 40-character lowercase source commit SHA
        required: true
        type: string
      source_tree:
        description: Optional exact source tree SHA
        required: false
        type: string
      scope:
        description: Bounded diagnostic selection (does not replace required CI)
        required: true
        default: all
        type: choice
        options: [all, smb-close, workspace-admission, auth-owner, server, server-unit, packages, namespace-borrow, namespace-format, spool-retirement, file-path-records, file-path-format, snapshot-write-sets, retirement-critical]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: '1'
  CARGO_INCREMENTAL: '0'

jobs:
  select:
    name: Validate source and select independent diagnostics
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Check diagnostic workflow contexts
        run: python3 .github/scripts/check-workflows.py .github/workflows/history-tooling.yml
      - name: Validate explicit source SHA and select bounded matrix
        id: select
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          SOURCE_TREE: ${{ inputs.source_tree }}
          SCOPE: ${{ inputs.scope }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re

          source = os.environ['SOURCE_SHA']
          if not re.fullmatch(r'[0-9a-f]{40}', source):
              raise SystemExit('source_sha must be an exact 40-character lowercase commit SHA')
          tree = os.environ['SOURCE_TREE']
          if tree and not re.fullmatch(r'[0-9a-f]{40}', tree):
              raise SystemExit('source_tree must be an exact 40-character lowercase tree SHA')
          if os.environ['SCOPE'].startswith('retirement-') and (source, tree) != (
              '7107bedfa14cd0cde9a713571a83b889828920d6',
              '2d7dddf25f914f440de27163a6c25972a68019e0',
          ):
              raise SystemExit('Retirement diagnostics require the exact reviewed source and tree')
          groups = {}
          for name, test in [
              ('smb-close', 'smb_rpc::tests::unchanged_smb_closes_reuse_resident_quota_but_disconnect_keeps_evidence'),
              ('workspace-admission', 'backend_admission_tests::typed_workspace_jobs_retain_admission_until_blocking_completion_after_cancellation'),
              ('auth-owner', 'backend_admission_tests::typed_jobs_hold_auth_owner_until_cancelled_worker_finishes'),
          ]:
              groups[name] = [dict(id=name, cache='server', exact_test=test,
                  command=f'cargo test --locked --offline -p storage-server --lib {test} -- --exact --nocapture')]
          groups['smb-close'].append(dict(id='smb-format',
              command='rustfmt +1.99.0 --edition 2024 --config skip_children=true --check test/server/unit/smb_rpc/tests.rs'))
          groups['server'] = [
              dict(id='server-unit', cache='server', command='cargo test --locked --offline -p storage-server --lib --bins -- --nocapture'),
              dict(id='server-doc', cache='server', command='cargo test --locked --offline -p storage-server --doc'),
          ]
          for target in ['http_engine', 'login_admission', 'telemetry_status', 'service_startup']:
              groups['server'].append(dict(id=f'server-{target}', cache='server',
                  command=f'cargo test --locked --offline -p storage-server --test {target} -- --nocapture'))
          groups['packages'] = [dict(id=package, cache=package,
              command=f'cargo test --locked --offline -p {package} -- --nocapture')
              for package in ['authentication', 'storage-contract', 'name-policy', 'platform-io',
                              'storage-client', 'storage-rescue', 'smb-protocol']]
          aggregate = sum(groups.values(), [])
          groups['server-unit'] = [dict(groups['server'][0], unit_inventory=True)]
          spool_test = 'http_spool::tests::retirement_waits_for_activation_and_cancelled_owner_never_publishes'
          groups['spool-retirement'] = [
              dict(id='spool-format', command='rustfmt +1.99.0 --edition 2024 --config skip_children=true --check test/server/unit/http_spool.rs'),
              dict(id='spool-retirement', cache='server', exact_test=spool_test, repetitions=10,
                  command=f'cargo test --locked --offline -p storage-server --lib {spool_test} -- --exact --nocapture'),
          ]
          files = [
              'src/engine/src/namespace.rs',
              'src/engine/src/business/namespace/query.rs',
              'src/engine/src/business/file_requests.rs',
              'src/engine/src/segment_store.rs',
              'src/engine/src/history_package.rs',
              'src/server/src/engine_backend/file_manager/listing.rs',
              'src/server/src/engine_backend/read_projection.rs',
              'test/engine/unit/namespace/borrowed_lookup_tests.rs',
              'test/engine/unit/business/namespace/query_tests.rs',
              'test/engine/unit/namespace/tests.rs',
              'test/engine/unit/namespace/owned_decode_tests.rs',
          ]
          groups['namespace-borrow'] = [
              dict(id='namespace-format', command='rustfmt +1.99.0 --edition 2024 --config skip_children=true --check ' + ' '.join(files)),
              dict(id='namespace-compile', cache='namespace-engine',
                  command='cargo check --locked --offline -p storage-engine -p storage-server'),
          ]
          witnesses = [
              'identity_predicates_match_owned_lookup_for_unicode_missing_and_wrong_kinds',
              'projection_borrows_leaf_ids_until_callback_returns',
              'lookup_preserves_reference_failure_before_a_delayed_composed_path_error',
              'owned_decode_moves_page_and_index_strings_from_authenticated_values',
              'owned_decode_keeps_reference_and_shape_error_precedence',
          ]
          for name, package, prefix in [
              ('engine-namespace', 'storage-engine', 'namespace::'),
              ('engine-file-requests', 'storage-engine', 'business::file_requests::'),
              ('server-read-projection', 'storage-server', 'engine_backend::read_projection::'),
              ('server-file-manager', 'storage-server', 'engine_backend::file_manager::'),
          ]:
              groups['namespace-borrow'].append(dict(id=name, cache=package,
                  package=package, test_filter=prefix, release=True,
                  required_names=json.dumps(witnesses if name == 'engine-namespace' else []),
                  command=f'cargo test --locked --offline --release -p {package} --lib {prefix} -- --nocapture'))
          groups['namespace-format'] = [groups['namespace-borrow'][0]]
          # The fifth changed path is docs/components/engine.md, not Rust.
          record_files = ['src/contract/src/model.rs', 'test/contract/unit/shared_records.rs',
              'test/engine/unit/business/file_paths_tests.rs',
              'test/engine/unit/container_storage/changes_tests.rs']
          groups['file-path-records'] = [dict(id='file-path-format',
              command='rustfmt +1.99.0 --edition 2024 --config skip_children=true --check ' + ' '.join(record_files))]
          for name, package, prefix, expected in [
              ('contract-path-records', 'storage-contract', 'shared_records::tests::path_', 2),
              ('engine-file-paths', 'storage-engine', 'business::file_paths_tests::', 8),
              ('engine-container-changes', 'storage-engine', 'container_storage::changes::tests::', 6),
          ]:
              groups['file-path-records'].append(dict(id=name, cache=package,
                  package=package, test_filter=prefix, release=False,
                  expected_count=expected, required_names='[]',
                  command=f'cargo test --locked --offline -p {package} --lib {prefix} -- --nocapture'))
          for name, test in [
              ('journal-snapshot-oracle', 'journal::snapshot_incremental_oracle_tests::incremental_snapshot_retains_fixed_publication_root_and_every_raw_object_byte'),
              ('history-projection-oracle', 'history_package::projection_delta_tests::every_projection_map_insert_delete_and_same_value_write_matches_full_oracle'),
              ('history-rename-proofs', 'history_package::tests::rename_nodes_preserve_body_proofs_and_mixed_lineage_through_purge_export_and_restore'),
          ]:
              groups['file-path-records'].append(dict(id=name, cache='storage-engine',
                  package='storage-engine', exact_test=test,
                  command=f'cargo test --locked --offline -p storage-engine --lib {test} -- --exact --nocapture'))
          groups['file-path-format'] = [groups['file-path-records'][0]]
          groups['snapshot-write-sets'] = []
          for name, prefix, expected in [
              ('journal-snapshot-set', 'journal::snapshot_incremental_oracle_tests::', 16),
              ('history-projection-set', 'history_package::projection_delta_tests::', 8),
          ]:
              groups['snapshot-write-sets'].append(dict(id=name, cache='storage-engine',
                  package='storage-engine', test_filter=prefix, release=False,
                  expected_count=expected, required_names='[]',
                  command=f'cargo test --locked --offline -p storage-engine --lib {prefix} -- --nocapture'))
          groups['snapshot-write-sets'].append(dict(id='workspace-namespace-preconditions',
              cache='storage-engine', package='storage-engine',
              test_target='workspace_namespace_preconditions', release=False,
              expected_count=3, required_names='[]',
              command='cargo test --locked --offline -p storage-engine --test workspace_namespace_preconditions -- --nocapture'))
          retirement = 'tests::published_workspace_retirement::'
          retirement_names = [
              'published_normal_workspaces_release_records_but_keep_replay_and_bytes',
              'published_abort_stays_cold_at_full_resident_quota_across_restart',
              'published_workspace_survives_system_loss_without_reactivating_record_charge',
              'unbound_terminal_records_cannot_bypass_quota_before_recovery_writes',
              'recovery_source_search_reads_old_full_generations_from_cold_workspaces',
              'published_completion_with_upload_owner_or_unknown_material_stays_resident',
              'published_cold_point_reads_and_recovery_hints_keep_exact_mirror_proof',
              'damaged_request_mirror_replays_admitted_cold_but_restart_keeps_record_resident',
          ]
          smb_quota = 'smb_rpc::tests::unchanged_smb_closes_reuse_resident_quota_but_disconnect_keeps_evidence'
          groups['retirement-critical'] = [
              dict(id='retirement-format', format_base='8f28d74ae1e3ead1f31e7a96a8abfd9e3ffa6d3f',
                  command='rustfmt +1.99.0 --edition 2024 --config skip_children=true --check'),
              dict(id='published-workspace-retirement', cache='storage-engine',
                  package='storage-engine', test_filter=retirement, expected_count=8,
                  required_names=json.dumps(retirement_names),
                  command=f'cargo test --locked --offline -p storage-engine --lib {retirement} -- --nocapture'),
              dict(id='retirement-smb-quota', cache='server', package='storage-server',
                  exact_test=smb_quota,
                  command=f'cargo test --locked --offline -p storage-server --lib {smb_quota} -- --exact --nocapture'),
          ]
          scope = os.environ['SCOPE']
          selected = aggregate if scope == 'all' else groups[scope]
          matrix = json.dumps(dict(include=selected), separators=(',', ':'))
          print(f'Source: {source}; selection: {scope}; independent jobs: {len(selected)}')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'matrix={matrix}\n')
          PY

  diagnostic:
    name: Diagnostic (${{ matrix.id }})
    needs: select
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix: ${{ fromJSON(needs.select.outputs.matrix) }}
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      SOURCE_TREE: ${{ inputs.source_tree }}
      WORKFLOW_SHA: ${{ github.workflow_sha }}
      DIAGNOSTIC_ID: ${{ matrix.id }}
      TEST_COMMAND: ${{ matrix.command }}
      EXACT_TEST: ${{ matrix.exact_test }}
      TEST_PACKAGE: ${{ matrix.package }}
      TEST_FILTER: ${{ matrix.test_filter }}
      TEST_TARGET: ${{ matrix.test_target }}
      TEST_RELEASE: ${{ matrix.release }}
      EXPECTED_COUNT: ${{ matrix.expected_count }}
      REQUIRED_NAMES: ${{ matrix.required_names }}
      VERIFY_UNIT_INVENTORY: ${{ matrix.unit_inventory }}
      FORMAT_BASE: ${{ matrix.format_base }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: ${{ matrix.format_base != '' && '0' || '1' }}
          persist-credentials: false
      - name: Verify exact checkout and record source identity
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          if [[ -n "$SOURCE_TREE" ]]; then
            test "$(git rev-parse 'HEAD^{tree}')" = "$SOURCE_TREE"
          fi
          mkdir -p .diagnostics
          python3 - <<'PY' | tee .diagnostics/identity.json
          import json
          import os
          import subprocess
          print(json.dumps(dict(
              source_sha=os.environ['SOURCE_SHA'],
              checkout_sha=subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
              tree_sha=subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip(),
              workflow_sha=os.environ['WORKFLOW_SHA'],
              workflow_ref=os.environ['GITHUB_WORKFLOW_REF'],
              run_id=os.environ['GITHUB_RUN_ID'],
              run_attempt=os.environ['GITHUB_RUN_ATTEMPT'],
              diagnostic=os.environ['DIAGNOSTIC_ID'],
              command=os.environ['TEST_COMMAND'],
          ), indent=2))
          PY
          cat .diagnostics/identity.json >> "$GITHUB_STEP_SUMMARY"
          git ls-files -z | xargs -0 sha256sum --zero > .diagnostics/source-before.sha256z
          sha256sum .diagnostics/source-before.sha256z | tee .diagnostics/source-before.txt
      - name: Initialize isolated Cargo home
        run: bash .github/scripts/initialize-cargo-home.sh
      - name: Install repository Rust toolchain
        run: |
          rustup show active-toolchain
          rustc --version
          cargo --version
      - name: Check feature-changed Rust files without modifying source
        if: matrix.format_base != ''
        run: |
          python3 - <<'PY' 2>&1 | tee .diagnostics/format.log
          import json
          import os
          import subprocess
          from pathlib import Path
          base = os.environ['FORMAT_BASE']
          subprocess.run(['git', 'merge-base', '--is-ancestor', base, 'HEAD'], check=True)
          changed = subprocess.check_output(['git', 'diff', '--name-only', '--diff-filter=ACMRT', '-z', base, 'HEAD'])
          paths = [os.fsdecode(path) for path in changed.split(b'\0') if path.endswith(b'.rs')]
          if not paths:
              raise SystemExit('Reviewed feature has no changed Rust paths')
          command = ['rustfmt', '+1.99.0', '--edition', '2024', '--config', 'skip_children=true', '--check', *paths]
          Path('.diagnostics/format-command.json').write_text(json.dumps(command, indent=2))
          print(json.dumps(command))
          subprocess.run(command, check=True)
          PY
      # Reuse the repository's pinned cache action, with a separate namespace.
      # Only compiled artifacts are cached; Cargo home and test results are not.
      - name: Cache compiled native dependencies
        if: matrix.cache != ''
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/native
          key: workspace-diagnostic-ubuntu24-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', '.cargo/config.toml') }}-${{ matrix.cache }}-${{ inputs.source_sha }}
          restore-keys: |
            workspace-diagnostic-ubuntu24-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', '.cargo/config.toml') }}-${{ matrix.cache }}-
      - name: Verify focused selector matches exactly one test
        if: matrix.exact_test != ''
        run: |
          cargo test --locked --offline -p "${TEST_PACKAGE:-storage-server}" --lib "$EXACT_TEST" -- --exact --list 2>&1 | tee .diagnostics/list.log
          python3 - <<'PY'
          import os
          from pathlib import Path
          lines = Path('.diagnostics/list.log').read_text().splitlines()
          tests = [line for line in lines if line.endswith(': test')]
          expected = [os.environ['EXACT_TEST'] + ': test']
          if tests != expected:
              raise SystemExit(f'Expected exactly {expected!r}, found {tests!r}')
          PY
      - name: Inventory focused module tests and require named regression bodies
        if: matrix.test_filter != '' || matrix.test_target != ''
        run: |
          profile=()
          if [[ "$TEST_RELEASE" == 'true' ]]; then
            profile=(--release)
          fi
          target=(--lib "$TEST_FILTER")
          if [[ -n "$TEST_TARGET" ]]; then
            target=(--test "$TEST_TARGET")
          fi
          cargo test --locked --offline "${profile[@]}" -p "$TEST_PACKAGE" "${target[@]}" -- --list 2>&1 | tee .diagnostics/list.log
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          tests = [line[:-6] for line in Path('.diagnostics/list.log').read_text().splitlines() if line.endswith(': test')]
          if not tests:
              raise SystemExit('Module selector matched zero tests')
          expected = os.environ['EXPECTED_COUNT']
          if expected and len(tests) != int(expected):
              raise SystemExit(f'Expected exactly {expected} listed test bodies; found {len(tests)}')
          for name in json.loads(os.environ['REQUIRED_NAMES']):
              matches = [test for test in tests if test.endswith('::' + name)]
              if len(matches) != 1:
                  raise SystemExit(f'Expected one regression body named {name!r}; found {matches!r}')
          print(f'Inventoried {len(tests)} tests for {os.environ["TEST_FILTER"] or os.environ["TEST_TARGET"]}')
          PY
          cargo test --locked --offline "${profile[@]}" -p "$TEST_PACKAGE" "${target[@]}" -- --ignored --list 2>&1 | tee .diagnostics/ignored-list.log
          if [[ -n "$EXPECTED_COUNT" ]]; then
            python3 - <<'PY'
          from pathlib import Path
          ignored = [line for line in Path('.diagnostics/ignored-list.log').read_text().splitlines() if line.endswith(': test')]
          if ignored:
              raise SystemExit(f'Required record-sharing bodies must all execute; found ignored bodies {ignored!r}')
          PY
          fi
      - name: Inventory complete server unit bodies and existing ignored tests
        if: matrix.unit_inventory == true
        run: |
          cargo test --locked --offline -p storage-server --lib --bins -- --list 2>&1 | tee .diagnostics/list.log
          cargo test --locked --offline -p storage-server --lib --bins -- --ignored --list 2>&1 | tee .diagnostics/ignored-list.log
          python3 - <<'PY'
          from pathlib import Path
          tests = [line for line in Path('.diagnostics/list.log').read_text().splitlines() if line.endswith(': test')]
          if not tests:
              raise SystemExit('Server unit selector matched zero tests')
          print(f'Inventoried {len(tests)} server unit test bodies')
          PY
      - name: Execute selected locked offline tests and retain failures
        if: matrix.repetitions != 10 && matrix.format_base == ''
        run: |
          printf 'Source: %s\nCommand: %s\n' "$SOURCE_SHA" "$TEST_COMMAND" | tee .diagnostics/command.txt
          set +e
          bash -euo pipefail -c "$TEST_COMMAND" 2>&1 | tee .diagnostics/test.log
          status=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$status" > .diagnostics/exit-code.txt
          if [[ -n "$EXACT_TEST" ]]; then
            python3 - <<'PY'
          import re
          from pathlib import Path
          log = Path('.diagnostics/test.log').read_text()
          results = re.findall(r'test result: (?:ok|FAILED)\. (\d+) passed; (\d+) failed; (\d+) ignored;', log)
          if len(results) != 1 or sum(map(int, results[0][:2])) != 1 or int(results[0][2]) != 0:
              raise SystemExit(f'Expected one executed, non-ignored test; found {results!r}')
          PY
          fi
          if [[ -n "$TEST_FILTER" || -n "$TEST_TARGET" ]]; then
            python3 - <<'PY'
          import re
          from pathlib import Path
          expected = sum(line.endswith(': test') for line in Path('.diagnostics/list.log').read_text().splitlines())
          results = re.findall(r'test result: (?:ok|FAILED)\. (\d+) passed; (\d+) failed; (\d+) ignored;', Path('.diagnostics/test.log').read_text())
          if len(results) != 1 or sum(map(int, results[0])) != expected or sum(map(int, results[0][:2])) == 0:
              raise SystemExit(f'Executed count must match {expected} listed tests; found {results!r}')
          PY
          fi
          if [[ "$VERIFY_UNIT_INVENTORY" == 'true' ]]; then
            python3 - <<'PY'
          import re
          from pathlib import Path
          expected = sum(line.endswith(': test') for line in Path('.diagnostics/list.log').read_text().splitlines())
          ignored = sum(line.endswith(': test') for line in Path('.diagnostics/ignored-list.log').read_text().splitlines())
          results = re.findall(r'test result: (?:ok|FAILED)\. (\d+) passed; (\d+) failed; (\d+) ignored;', Path('.diagnostics/test.log').read_text())
          counts = [tuple(map(int, result)) for result in results]
          if sum(sum(result) for result in counts) != expected or sum(result[2] for result in counts) != ignored or expected <= ignored:
              raise SystemExit(f'Server unit execution must match {expected} listed bodies and {ignored} ignored bodies; found {results!r}')
          PY
          fi
          exit "$status"
      - name: Execute the exact spool regression ten times and require every attempt
        if: matrix.repetitions == 10
        run: |
          printf 'Source: %s\nCommand: %s\n' "$SOURCE_SHA" "$TEST_COMMAND" | tee .diagnostics/command.txt
          overall_status=0
          for attempt in {1..10}; do
            log=".diagnostics/attempt-$attempt.log"
            printf 'Source: %s\nAttempt: %s/10\nCommand: %s\n' "$SOURCE_SHA" "$attempt" "$TEST_COMMAND" | tee "$log"
            set +e
            bash -euo pipefail -c "$TEST_COMMAND" 2>&1 | tee -a "$log"
            status=${PIPESTATUS[0]}
            set -e
            printf '%s\n' "$status" > ".diagnostics/attempt-$attempt.exit-code"
            if [[ "$status" != 0 ]]; then
              overall_status=$status
            fi
            if ! python3 - "$log" <<'PY'
          import re
          import sys
          from pathlib import Path
          results = re.findall(r'test result: (?:ok|FAILED)\. (\d+) passed; (\d+) failed; (\d+) ignored;', Path(sys.argv[1]).read_text())
          if len(results) != 1 or sum(map(int, results[0][:2])) != 1 or int(results[0][2]) != 0:
              raise SystemExit(f'Expected exactly one executed, non-ignored spool test; found {results!r}')
          PY
            then
              overall_status=1
            fi
            printf '%s\t%s\n' "$attempt" "$status" >> .diagnostics/attempts.tsv
          done
          printf '%s\n' "$overall_status" > .diagnostics/exit-code.txt
          exit "$overall_status"
      - name: Verify tracked source contents are unchanged
        if: always()
        run: |
          git diff --exit-code HEAD
          git ls-files -z | xargs -0 sha256sum --zero > .diagnostics/source-after.sha256z
          sha256sum .diagnostics/source-after.sha256z | tee .diagnostics/source-after.txt
          cmp .diagnostics/source-before.sha256z .diagnostics/source-after.sha256z
      - name: Record diagnostic SHA256 manifest
        if: always()
        run: |
          cd .diagnostics
          find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
          cat SHA256SUMS
      - name: Retain source identity, exact commands and test output
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: workspace-${{ inputs.source_sha }}-${{ matrix.id }}-${{ github.run_attempt }}
          path: .diagnostics/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
