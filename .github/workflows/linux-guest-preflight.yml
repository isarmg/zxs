name: Linux disposable guest fixtures

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/linux-guest-preflight.yml

permissions: {}

jobs:
  guest:
    if: github.repository == 'isarmg/zxs' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Verify the signed guest and prepare local QEMU tools
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test "$(id -u)" -ne 0
          work=$(mktemp -d "$RUNNER_TEMP/zxs-guest.XXXXXXXX")
          printf 'ZXS_GUEST_WORK=%s\n' "$work" >> "$GITHUB_ENV"
          cd "$work"

          image=ubuntu-26.04-minimal-cloudimg-amd64.img
          release=https://cloud-images.ubuntu.com/minimal/releases/resolute/release-20261118
          fetch() {
            curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
              --connect-timeout 15 --max-time 240 --retry 2 --max-filesize 600000000 "$release/$1" -o "$1"
          }
          fetch SHA256SUMS
          fetch SHA256SUMS.gpg
          mkdir gnupg
          GNUPGHOME="$work/gnupg" gpgv --keyring /usr/share/keyrings/ubuntu-cloudimage-keyring.gpg \
            --status-fd 1 SHA256SUMS.gpg SHA256SUMS > image.signature
          grep -qF '[GNUPG:] VALIDSIG D2EB44626FDDC30B513D5BB71A5D6C4C7DB87C81 ' image.signature
          pin=f6c630c04d4fad012f2c4ed3a21a2b0c0f814f13f6873568da4c31d8df65c12e
          grep -qxF "$pin *$image" SHA256SUMS
          fetch "$image"
          printf '%s *%s\n' "$pin" "$image" | sha256sum -c -

          mkdir -p apt/{etc/empty,lists/partial,archives/partial} tools
          : > apt/status
          export APT_CONFIG="$work/apt/config"
          cat > "$APT_CONFIG" <<EOF
          Dir::Etc "$work/apt/etc";
          Dir::Etc::main "/dev/null";
          Dir::Etc::parts "empty";
          Dir::Etc::sourceparts "empty";
          Dir::Etc::sourcelist "sources.list";
          Dir::State "$work/apt";
          Dir::State::status "$work/apt/status";
          Dir::Cache "$work/apt";
          Dir::Log "$work/apt";
          Dir::Cache::pkgcache "";
          Dir::Cache::srcpkgcache "";
          Acquire::Languages "none";
          Acquire::Retries "2";
          APT::Get::Always-Include-Phased-Updates "true";
          APT::Update::Error-Mode "any";
          EOF
          snapshot=https://snapshot.ubuntu.com/ubuntu/20261118T120000Z
          archive_key=/etc/apt/trusted.gpg.d/ubuntu-keyring-2018-archive.gpg
          for suite in noble noble-updates noble-security; do
            printf 'deb [arch=amd64 signed-by=%s] %s %s main universe\n' "$archive_key" "$snapshot" "$suite"
          done > apt/etc/sources.list
          /usr/bin/apt-get update
          (
            cd apt/lists
            cat <<'PINS' | sha256sum -c -
          cdb2f31d809f589719a53c6ad15f255b27569c4059542ada282aaa21b8e164b0  snapshot.ubuntu.com_ubuntu_20261118T120000Z_dists_noble_InRelease
          a4dfe9c58d77db89e8b45240d1cc14a3e6dd9159bc29395aebfe6e893594dccb  snapshot.ubuntu.com_ubuntu_20261118T120000Z_dists_noble-updates_InRelease
          65a6f9c5cf5b8d887e45c2a638b19bedd86e9d3630afee8b3a7b46ea5803dc22  snapshot.ubuntu.com_ubuntu_20261118T120000Z_dists_noble-security_InRelease
          PINS
          )
          /usr/bin/apt-get --assume-yes --download-only --no-install-recommends install \
            qemu-system-x86 ovmf genisoimage e2fsprogs gcc-13 binutils libc6-dev
          for package in apt/archives/*.deb; do
            dpkg-deb --extract "$package" tools
          done
          sha256sum apt/archives/*.deb

      - name: Build only the exact Helper test harness
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          cd "$ZXS_GUEST_WORK"
          work="$PWD"
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          mkdir -p rust source build-home cargo target gcc-libs sysroot
          mkdir -m 0755 seed

          target=x86_64-unknown-linux-gnu
          release=https://static.rust-lang.org/dist/2026-11-12
          while read -r pin component member; do
            name="$component-1.100.0-$target"
            curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
              --connect-timeout 15 --max-time 120 --retry 2 --max-filesize 120000000 "$release/$name.tar.xz" -o "$name.tar.xz"
            printf '%s  %s.tar.xz\n' "$pin" "$name" | sha256sum -c -
            tar -xJf "$name.tar.xz" -C rust --no-same-owner --no-same-permissions \
              --strip-components=2 --exclude="$name/$member/manifest.in" "$name/$member"
          done <<'RUST'
          f1d0b1dec81dab6f523cd098507763487b0d4bd7fd2c87582f154128719be03b rustc rustc
          7e29ce07d7c6e92d1826870575ba27d57fff6cb3e754aa57d99099cb88fab35d cargo cargo
          4591b6486594ded52ecd6135db95bf9355bbd3ca7a380888b141528bbcf9a5d4 rust-std rust-std-x86_64-unknown-linux-gnu
          RUST

          git_env=(env -i PATH=/usr/bin:/bin LC_ALL=C HOME="$work/build-home"
            GIT_CONFIG_NOSYSTEM=1 GIT_TERMINAL_PROMPT=0)
          "${git_env[@]}" git init --quiet --bare source.git
          "${git_env[@]}" git --git-dir=source.git fetch --quiet --no-tags --depth=1 \
            https://github.com/isarmg/zxs.git "$GITHUB_SHA"
          test "$(git --git-dir=source.git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git --git-dir=source.git archive "$GITHUB_SHA" helper | tar -xf - -C source
          printf 'Source commit: %s; Helper tree: %s\n' "$GITHUB_SHA" "$(git --git-dir=source.git rev-parse "$GITHUB_SHA:helper")"
          sha256sum source/helper/Cargo.lock

          export ZXS_TEST_SDK="$work/tools" ZXS_TEST_SYSROOT="$work/sysroot"
          ln -s "$ZXS_TEST_SDK/usr" sysroot/usr
          ln -s usr/lib sysroot/lib
          ln -s usr/lib64 sysroot/lib64
          for lib in libbfd-2.42-system.so libctf.so.0 libsframe.so.1 libjansson.so.4 libz.so.1 \
            libzstd.so.1 libisl.so.23 libmpc.so.3 libmpfr.so.6 libgmp.so.10; do
            file=$(realpath -e "$ZXS_TEST_SDK/usr/lib/x86_64-linux-gnu/$lib")
            [[ "$file" == "$ZXS_TEST_SDK/"* ]]
            ln -s "$file" "gcc-libs/$lib"
          done
          cat > gcc <<'GCC'
          #!/bin/sh
          exec "$ZXS_TEST_SDK/usr/bin/x86_64-linux-gnu-gcc-13" --sysroot="$ZXS_TEST_SYSROOT" \
            -B"$ZXS_TEST_SDK/usr/libexec/gcc/x86_64-linux-gnu/13/" \
            -B"$ZXS_TEST_SDK/usr/lib/gcc/x86_64-linux-gnu/13/" -B"$ZXS_TEST_SDK/usr/bin/" "$@"
          GCC
          chmod 0700 gcc
          for check in '-print-prog-name=cc1' '-print-prog-name=as' '-print-prog-name=collect2' \
            '-print-prog-name=ld' '-print-file-name=Scrt1.o' '-print-file-name=libc.so' '-print-file-name=libgcc.a'; do
            item=$(realpath -e "$(LD_LIBRARY_PATH="$work/gcc-libs" ./gcc "$check")")
            [[ "$item" == "$ZXS_TEST_SDK/"* ]]
          done
          build_env=(env -i PATH="$ZXS_TEST_SDK/usr/bin:/usr/bin:/bin" LC_ALL=C HOME="$work/build-home" TMPDIR="$work"
            CARGO_HOME="$work/cargo" CARGO_TARGET_DIR="$work/target" CARGO_BUILD_JOBS=2 CARGO_INCREMENTAL=0
            LD_LIBRARY_PATH="$work/gcc-libs"
            ZXS_TEST_SDK="$ZXS_TEST_SDK" ZXS_TEST_SYSROOT="$ZXS_TEST_SYSROOT"
            CC="$work/gcc" AR="$ZXS_TEST_SDK/usr/bin/ar"
            CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER="$work/gcc"
            RUSTC="$work/rust/bin/rustc" RUSTDOC="$work/rust/bin/rustdoc")
          cd source/helper
          "${build_env[@]}" "$work/rust/bin/cargo" fetch --locked --target "$target"
          "${build_env[@]}" "$work/rust/bin/cargo" test --locked --offline \
            --features private-fresh-install --bin helper --no-run --message-format=json > "$work/build.jsonl"
          python3 -I - "$work" <<'PYTHON'
          import hashlib, json, shutil, sys
          from pathlib import Path

          work = Path(sys.argv[1])
          entries = [json.loads(line) for line in (work / "build.jsonl").read_text().splitlines()]
          tests = [entry.get("executable") for entry in entries
                   if entry["reason"] == "compiler-artifact" and entry["target"]["name"] == "helper"
                   and entry["target"]["kind"] == ["bin"] and entry["profile"]["test"]]
          if len(tests) != 1 or not tests[0]:
              raise RuntimeError("expected exactly one Helper libtest artifact")
          binary = Path(tests[0]).resolve(strict=True)
          if not binary.is_relative_to(work / "target"):
              raise RuntimeError("test executable outside the private target")
          output = work / "seed" / "helper-tests"
          shutil.copyfile(binary, output)
          output.chmod(0o555)
          with output.open("rb") as handle:
              digest = hashlib.file_digest(handle, "sha256").hexdigest()
          (output.parent / "helper-tests.sha256").write_text(f"{digest}  helper-tests\n")
          print(f"Helper libtest SHA256: {digest}")
          PYTHON

      - name: Boot without a NIC, verify private mounts and run Helper fixture tests
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          cd "$ZXS_GUEST_WORK"
          tools="$PWD/tools"
          libs="$tools/usr/lib/x86_64-linux-gnu:$tools/lib/x86_64-linux-gnu"
          loader="$tools/usr/lib/x86_64-linux-gnu/ld-linux-x86-64.so.2"
          tool_env=(env -i LANG=C PATH=/usr/bin:/bin HOME="$PWD" TMPDIR="$PWD"
            QEMU_MODULE_DIR="$tools/usr/lib/x86_64-linux-gnu/qemu"
            MKE2FS_CONFIG="$tools/etc/mke2fs.conf" "$loader" --inhibit-cache --library-path "$libs")
          for exe in usr/sbin/mke2fs usr/bin/genisoimage usr/bin/qemu-system-x86_64; do
            "${tool_env[@]}" --list "$tools/$exe" |
              awk -v base="$tools/" '$2 == "=>" && index($3, base) != 1 {exit 1}'
          done
          mkdir -m 0755 empty empty/subtree
          for role in a b data recycle; do
            truncate -s 64M "$role.ext4"
            "${tool_env[@]}" "$tools/usr/sbin/mke2fs" -q -t ext4 -d empty -L "zxs-$role" "$role.ext4"
          done
          printf '%s\n' 'instance-id: zxs-phase-zero' > seed/meta-data
          cat > seed/user-data <<'CLOUD'
          #cloud-config
          users: []
          ssh_pwauth: false
          ssh_genkeytypes: []
          package_update: false
          package_upgrade: false
          write_files:
            - path: /run/zxs-probe.py
              permissions: '0644'
              content: |
                import errno, fcntl, os
                from pathlib import Path
                from uuid import UUID

                def check(condition):
                    if not condition:
                        raise RuntimeError("unexpected fixture capability")

                def mount_at(point):
                    rows = [line.split() for line in Path("/proc/thread-self/mountinfo").read_text().splitlines()]
                    picked = [row for row in rows if row[4] == point]
                    check(len(picked) == 1)
                    return picked[0]

                check(os.getuid() == os.getgid() == 23100)
                status = dict(line.split(":", 1) for line in Path("/proc/thread-self/status").read_text().splitlines())
                check(all(status[key].split() == ["23100"] * 4 for key in ("Uid", "Gid")))
                check(status["Groups"].split() == [] and status["NoNewPrivs"].strip() == "1")
                check(all(int(status[key], 16) == 0 for key in ("CapInh", "CapPrm", "CapEff", "CapAmb")))
                check(os.uname().release == "7.0.0-43-generic" and os.uname().machine == "x86_64")
                check(os.listdir("/sys/class/net") == ["lo"])
                root = mount_at("/")
                check(root[3] == "/" and root[root.index("-") + 1] == "ext4")
                print(f"ZXS-GUEST kernel={os.uname().release} root={root[0]}:{root[1]} self_parent={root[0] == root[1]}", flush=True)

                def original(path, access="ro"):
                    row = mount_at(path)
                    fd = os.open(path, os.O_RDONLY | os.O_DIRECTORY | os.O_NOFOLLOW)
                    dev = os.fstat(fd).st_dev
                    info = dict(line.split(":", 1) for line in Path(f"/proc/thread-self/fdinfo/{fd}").read_text().splitlines())
                    check(row[0] == info["mnt_id"].strip() and row[2] == f"{os.major(dev)}:{os.minor(dev)}")
                    fs_idx = row.index("-")
                    check(row[3] == "/" and access in row[5].split(",") and row[fs_idx + 1] == "ext4")
                    check(access in row[fs_idx + 3].split(","))
                    raw = bytearray(17)
                    fcntl.ioctl(fd, 0x80111500, raw)
                    check(raw[0] == 16 and any(raw[1:]))
                    volume = UUID(bytes=bytes(raw[1:]))
                    try:
                        os.getxattr(fd, "user.zxs.volume")
                    except OSError as err:
                        check(err.errno == errno.ENODATA)
                    else:
                        raise RuntimeError("unexpected fixture label")
                    fcntl.flock(fd, fcntl.LOCK_EX | fcntl.LOCK_NB)
                    second = os.open(path, os.O_RDONLY | os.O_DIRECTORY | os.O_NOFOLLOW)
                    try:
                        fcntl.flock(second, fcntl.LOCK_SH | fcntl.LOCK_NB)
                    except BlockingIOError:
                        pass
                    else:
                        raise RuntimeError("independent directory flock not excluded")
                    os.close(second)
                    os.close(fd)
                    print(f"ZXS-GUEST {path} mount={row[0]} dev={row[2]} fsuuid={volume} {access}=yes xattr=ENODATA flock=yes", flush=True)
                    return row, volume

                a, au = original("/mnt/zxs-a")
                b, bu = original("/mnt/zxs-b")
                bind = mount_at("/mnt/zxs-bind")
                check(a[0] != b[0] and a[2] != b[2] and au != bu)
                check(bind[0] not in (a[0], b[0]) and bind[2] == a[2] and bind[3] == "/subtree" and "ro" in bind[5].split(","))
                print(f"ZXS-GUEST independent_worker=23100:23100 nnp=1 subtree_mount={bind[0]} root={bind[3]}", flush=True)
                print("ZXS-GUEST mounted preflight complete", flush=True)
                data, du = original("/mnt/zxs-test-data", "rw")
                recycle, ru = original("/mnt/zxs-test-recycle", "rw")
                check(len({a[0], b[0], data[0], recycle[0]}) == len({a[2], b[2], data[2], recycle[2]}) == len({au, bu, du, ru}) == 4)

          runcmd:
            - - /bin/sh
              - -ec
              - |
                exec > /dev/ttyS0 2>&1
                stage=namespaces
                trap 'rc=$?; if [ "$rc" -ne 0 ]; then printf "ZXS-GUEST failed at %s (exit %s)\n" "$stage" "$rc"; fi' EXIT
                for ns in pid user mnt net; do
                  test "$(stat -Lc '%d:%i' "/proc/thread-self/ns/$ns")" = "$(stat -Lc '%d:%i' "/proc/1/ns/$ns")"
                done
                test "$(stat -Lc '%d:%i' /)" = "$(stat -Lc '%d:%i' /proc/1/root)"
                printf '%s\n' 'ZXS-GUEST same initial guest namespaces and root as PID 1'
                stage=read-only-mounts
                udevadm settle --timeout=15
                mkdir /mnt/zxs-a /mnt/zxs-b /mnt/zxs-bind
                mount -t ext4 -o ro,noload /dev/disk/by-id/virtio-zxs-probe-a /mnt/zxs-a
                mount -t ext4 -o ro,noload /dev/disk/by-id/virtio-zxs-probe-b /mnt/zxs-b
                mount --bind /mnt/zxs-a/subtree /mnt/zxs-bind
                stage=writable-fixtures
                mkdir /mnt/zxs-test-data /mnt/zxs-test-recycle /mnt/zxs-test-input
                mount -t ext4 -o rw,nosuid,nodev,noexec /dev/disk/by-id/virtio-zxs-probe-data /mnt/zxs-test-data
                mount -t ext4 -o rw,nosuid,nodev,noexec /dev/disk/by-id/virtio-zxs-probe-recycle /mnt/zxs-test-recycle
                stage=unprivileged-observations
                setpriv --reuid=23100 --regid=23100 --clear-groups --no-new-privs \
                  python3 -I /run/zxs-probe.py
                stage=helper-tests
                install -d -m 0700 -o 23100 -g 23100 /mnt/zxs-test-data/fixture /mnt/zxs-test-recycle/fixture
                mount -t iso9660 -o ro,nosuid,nodev /dev/disk/by-id/virtio-zxs-seed /mnt/zxs-test-input
                (cd /mnt/zxs-test-input && sha256sum -c helper-tests.sha256)
                run_cases() {
                  expected="$1"
                  scope="$2"
                  rc=0
                  setpriv --reuid=23100 --regid=23100 --clear-groups --no-new-privs \
                    env -i PATH=/usr/bin:/bin LC_ALL=C \
                    HELPER_TEST_WORKER_UID=23100 HELPER_TEST_WORKER_GID=23100 \
                    HELPER_TEST_PORTABLE_DATA_PARENT=/mnt/zxs-test-data/fixture \
                    HELPER_TEST_PORTABLE_RECYCLE_PARENT=/mnt/zxs-test-recycle/fixture \
                    /mnt/zxs-test-input/helper-tests "$scope" --format pretty > /run/zxs-test.log 2>&1 || rc=$?
                  sed 's/^/ZXS-GUEST Helper: /' /run/zxs-test.log
                  test "$rc" -eq 0 && grep -Fq "test result: ok. $expected passed; 0 failed; 0 ignored;" /run/zxs-test.log
                }
                failed=0
                run_cases 12 sqlite_install::stage::cases:: || failed=1
                run_cases 12 pinned::portable_pending::group::tests:: || failed=1
                run_cases 1 pinned::portable_pending::group::feedback_file::tests:: || failed=1
                test "$failed" -eq 0
                printf '%s\n' 'ZXS-GUEST Helper 25 targeted tests passed'
          power_state:
            mode: poweroff
            timeout: 60
            condition: true
          CLOUD
          "${tool_env[@]}" "$tools/usr/bin/genisoimage" -quiet -volid cidata -joliet -rock -output seed.iso seed
          firmware="$tools/usr/share/OVMF"
          cp "$firmware/OVMF_VARS_4M.fd" vars.fd
          boot_status=0
          timeout -k 15s 12m "${tool_env[@]}" "$tools/usr/bin/qemu-system-x86_64" \
            -no-user-config -nodefaults -machine q35 -accel tcg,thread=multi -smp 2 -m 2048 \
            -nic none -display none -monitor none -serial file:serial.log -no-reboot \
            -L "$tools/usr/share/qemu" \
            -drive if=pflash,format=raw,readonly=on,file="$firmware/OVMF_CODE_4M.fd" \
            -drive if=pflash,format=raw,file=vars.fd \
            -drive if=virtio,format=qcow2,file=ubuntu-26.04-minimal-cloudimg-amd64.img \
            -drive if=none,id=seed,format=raw,readonly=on,file=seed.iso \
            -device virtio-blk-pci,drive=seed,serial=zxs-seed \
            -drive if=none,id=a,format=raw,readonly=on,file=a.ext4 \
            -device virtio-blk-pci,drive=a,serial=zxs-probe-a \
            -drive if=none,id=b,format=raw,readonly=on,file=b.ext4 \
            -device virtio-blk-pci,drive=b,serial=zxs-probe-b \
            -drive if=none,id=data,format=raw,file=data.ext4 \
            -device virtio-blk-pci,drive=data,serial=zxs-probe-data \
            -drive if=none,id=recycle,format=raw,file=recycle.ext4 \
            -device virtio-blk-pci,drive=recycle,serial=zxs-probe-recycle || boot_status=$?
          if test -f serial.log; then
            tr -d '\r' < serial.log | grep -aE '^ZXS-GUEST ' || true
          fi
          test "$boot_status" -eq 0
          test "$(tr -d '\r' < serial.log | grep -aFxc 'ZXS-GUEST mounted preflight complete')" -eq 1
          test "$(tr -d '\r' < serial.log | grep -aFxc 'ZXS-GUEST Helper 25 targeted tests passed')" -eq 1
