name: Linux Rust source checks

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/linux-rust-checks.yml
      - zxs/src/**
      - zxs/vendor/**
      - zxs/tests/**
      - zxs/build*.rs
      - zxs/build_*.py
      - zxs/Cargo.*
      - zxs/rust-toolchain.toml
      - helper/src/**
      - helper/tests/**
      - helper/linux-evidence/**
      - helper/build.rs
      - helper/Cargo.*
      - helper/.cargo/config.toml
      - helper/rust-toolchain.toml

permissions:
  contents: read

jobs:
  checks:
    if: github.ref == 'refs/heads/main'
    name: ${{ matrix.profile }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: zxs
            profile: ZXS
            feature: ''
          - project: helper
            profile: Helper default
            feature: ''
    defaults:
      run:
        shell: bash
        working-directory: ${{ matrix.project }}
    env:
      FEATURE: ${{ matrix.feature }}
      CC: /usr/bin/gcc
      AR: /usr/bin/ar
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: ${{ matrix.project }}

      - name: Prepare the pinned GNU Rust toolchain
        id: toolchain
        run: |
          test "$(id -u)" -ne 0
          export RUSTUP_HOME="$RUNNER_TEMP/rustup" CARGO_HOME="$RUNNER_TEMP/cargo"
          export RUSTUP_DIST_SERVER=https://static.rust-lang.org
          rustup toolchain install 1.100.0-x86_64-unknown-linux-gnu --profile minimal --component clippy
          bin="$(dirname "$(rustup which --toolchain 1.100.0-x86_64-unknown-linux-gnu rustc)")"
          (
            cd "$bin"
            sha256sum -c <<'SUMS'
          5073422953727c9427a76b7fce03aa9404da46315e5a1e4965389512a41e8db0  rustc
          84d55d77232a921da96bcf2e1f78532ef5c5221803aae4448d9e220d48ebd808  cargo
          5352349174538b94cb92878248e88a57be25c2e770c03d7175670a80eec7ee91  cargo-clippy
          b20543523b921c8c57b14fb80e04209a6d9e7290c935e0bb5d50f622c45b9160  clippy-driver
          SUMS
          )
          printf '%s\n' "$bin" >> "$GITHUB_PATH"
          printf 'CARGO_HOME=%s\nCARGO_TARGET_DIR=%s\nRUSTC=%s\nRUSTDOC=%s\n' \
            "$CARGO_HOME" "$RUNNER_TEMP/target" "$bin/rustc" "$bin/rustdoc" >> "$GITHUB_ENV"
          printf 'ZXS_RUST_BIN=%s\n' "$bin" >> "$GITHUB_ENV"

      - name: Fetch Helper's locked registry inputs
        if: matrix.project == 'helper'
        run: cargo fetch --locked

      - name: Strict Clippy
        id: lint
        run: |
          features=()
          if [[ -n "$FEATURE" ]]; then features=(--features "$FEATURE"); fi
          cargo clippy --workspace --all-targets --locked --offline "${features[@]}" -- -D warnings -D clippy::pedantic

      - name: Native tests
        if: ${{ !cancelled() && (steps.lint.outcome == 'success' || steps.lint.outcome == 'failure') }}
        run: |
          features=()
          if [[ -n "$FEATURE" ]]; then features=(--features "$FEATURE"); fi
          if [[ "${{ matrix.project }}" == zxs ]]; then
            cargo test --workspace --all-targets --locked --offline
          else
            cargo test --workspace --lib --bins --locked --offline "${features[@]}"
          fi

      - name: Check offline ZXS host activation (compile only)
        if: ${{ !cancelled() && matrix.project == 'zxs' && steps.toolchain.outcome == 'success' }}
        run: |
          "$ZXS_RUST_BIN/cargo" check --locked --offline --features host-activation --bin activate-headless

      - name: Check first-party Rust formatting
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' && matrix.feature == '' }}
        env:
          FORMAT_PROJECT: ${{ matrix.project }}
          CARGO_NET_OFFLINE: "true"
        run: |
          export RUSTUP_HOME="$RUNNER_TEMP/rustup" CARGO_HOME="$RUNNER_TEMP/cargo"
          export RUSTUP_DIST_SERVER=https://static.rust-lang.org
          rustup component add rustfmt --toolchain 1.100.0-x86_64-unknown-linux-gnu
          (
            cd "$ZXS_RUST_BIN"
            sha256sum -c <<'SUMS'
          6e2d5b048877b33b14d5da5670381516b7ec3ee22572b8aff933d090fe6cb664  rustfmt
          bb9f7bd771972fb994f303bb576094bb98ac7c46a31849d1d5e88a463ed2c266  cargo-fmt
          SUMS
          )
          export RUSTFMT="$ZXS_RUST_BIN/rustfmt"
          check_format() {
            "$ZXS_RUST_BIN/cargo" fmt --manifest-path "$1" --package "$2" -- --check
          }
          case "$FORMAT_PROJECT" in
            zxs) check_format Cargo.toml storage-server ;;
            helper)
              status=0
              check_format Cargo.toml local-ops-helper || status=1
              check_format linux-evidence/Cargo.toml helper-linux-evidence || status=1
              exit "$status"
              ;;
            *) exit 2 ;;
          esac
