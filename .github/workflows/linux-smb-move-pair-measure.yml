name: Linux SMB MOVE pair compile receipt

on:
  workflow_dispatch:
    inputs:
      approved_source:
        description: Exact reviewed main source commit for compile receipt only
        required: true
        type: string

permissions: {}

jobs:
  compile-receipt:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      APPROVED_SOURCE: ${{ inputs.approved_source }}
    steps:
      - name: Build the exact pair and print its nonsecret receipt
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test "$(id -u)" -ne 0
          [[ "$GITHUB_EVENT_NAME" == workflow_dispatch &&
             "$GITHUB_REPOSITORY" == isarmg/zxs &&
             "$GITHUB_REF" == refs/heads/main &&
             "$GITHUB_ACTOR" == isarmg &&
             "$GITHUB_TRIGGERING_ACTOR" == isarmg ]]
          [[ "$APPROVED_SOURCE" =~ ^[0-9a-f]{40}$ && "$APPROVED_SOURCE" == "$GITHUB_SHA" ]]
          work="$(mktemp -d "$RUNNER_TEMP/smb-move-pair.XXXXXXXX")"
          mkdir "$work"/{repo,source,measure}
          git_source=(env -i PATH=/usr/bin:/bin LC_ALL=C HOME="$work" TMPDIR="$work"
            GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null GIT_TERMINAL_PROMPT=0 GIT_NO_REPLACE_OBJECTS=1
            /usr/bin/git -C "$work/repo" -c core.hooksPath=/dev/null)
          "${git_source[@]}" init -q
          "${git_source[@]}" fetch --no-tags --depth=1 https://github.com/isarmg/zxs.git "$APPROVED_SOURCE"
          test "$("${git_source[@]}" rev-parse --verify 'FETCH_HEAD^{commit}')" = "$APPROVED_SOURCE"
          suite=zxs/tests/acceptance
          "${git_source[@]}" archive "$APPROVED_SOURCE" -- \
            "$suite/rust_smb_move_pair.py" "$suite/rust_smb_move_pair_measure.py" \
            | /usr/bin/tar -xf - -C "$work/source" --no-same-owner --no-same-permissions
          umask 077
          if ! env -i PATH=/usr/bin:/bin LC_ALL=C TZ=UTC HOME="$work" TMPDIR="$work" \
            /usr/bin/python3 -I -B "$work/source/$suite/rust_smb_move_pair_measure.py" \
            --repo "$work/repo" --source "$work/source" --work "$work/measure" --commit "$APPROVED_SOURCE" \
            >"$work/compile.log" 2>&1; then
            env -i PATH=/usr/bin:/bin LC_ALL=C /usr/bin/python3 -I -B - "$work/measure/failure" <<'PY'
          import os, re, stat, sys

          phase, reason = 'measurement', 'no-record'
          try:
              fd = os.open(sys.argv[1], os.O_RDONLY | os.O_NOFOLLOW | os.O_NONBLOCK | os.O_CLOEXEC)
              with os.fdopen(fd, 'rb') as stream:
                  info = os.fstat(stream.fileno())
                  if (stat.S_ISREG(info.st_mode) and info.st_uid == os.getuid()
                          and info.st_nlink == 1 and 0 < info.st_size <= 64):
                      raw = stream.read(65)
                      match = re.fullmatch(
                          rb'(source|helper-config|toolchain|browser|server-build|server-proof|'
                          rb'helper-build|helper-proof|receipt) (tool-failed|io-failed|check-failed)\n', raw)
                      if match and len(raw) == info.st_size:
                          phase, reason = (part.decode('ascii') for part in match.groups())
          except OSError:
              pass
          print(f'SMB MOVE pair compile receipt was not produced: {phase}/{reason}.', file=sys.stderr)
          PY
            exit 1
          fi
          env -i PATH=/usr/bin:/bin LC_ALL=C /usr/bin/python3 -I -B - "$work/measure" "$APPROVED_SOURCE" <<'PY'
          from pathlib import Path
          import hashlib, json, re, sys
          work, commit = Path(sys.argv[1]), sys.argv[2]
          receipt = work / 'measurement.json'
          if set(work.iterdir()) != {receipt} or receipt.is_symlink():
              raise SystemExit('Unexpected compile measurement output')
          with receipt.open('rb') as accepted:
              raw = accepted.read(65537)
          if not 0 < len(raw) <= 65536:
              raise SystemExit('Incomplete compile measurement record')
          record = json.loads(raw)
          if (record.get('profile') != 'SMB-MOVE-PAIR-MEASUREMENT-1' or record.get('source') != commit
              or not all(re.fullmatch(r'[0-9a-f]{64}', record.get(k, '')) and int(record[k], 16) > 0
                         for k in ('schema_sha256', 'server_sha256', 'helper_sha256'))):
              raise SystemExit('Compile measurement is not for the approved source')
          print('SMB MOVE compile receipt (no guest or acceptance):', hashlib.sha256(raw).hexdigest())
          print(json.dumps(record, sort_keys=True, ensure_ascii=True))
          PY
