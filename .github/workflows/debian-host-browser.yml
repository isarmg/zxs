name: Final exact-source Debian assets and host browser acceptance
on:
  push:
    branches: [verify/native-debian-host-browser-20261031]
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: '1'
  CARGO_INCREMENTAL: '0'
jobs:
  web-production:
    name: Production WASM build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 27fd5581bc144ec934ae24d7b652dc604137c5fa
          persist-credentials: false
      - name: Initialize isolated Cargo home
        run: bash .github/scripts/initialize-cargo-home.sh
      - name: Install repository Rust toolchain and WASM target
        run: |
          rustup show active-toolchain
          rustup target add wasm32-unknown-unknown
          rustc --version
      - name: Cache locally compiled Rust build helpers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/rust-build-tools
          key: rust-build-tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'compliance/rust-sources.json') }}
          restore-keys: |
            rust-build-tools-${{ runner.os }}-${{ runner.arch }}-
      - name: Build production Web distribution
        run: bash .github/scripts/check.sh web-production
      - name: Retain production assets for checks in this run
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-dist
          path: build/web/
          if-no-files-found: error
          retention-days: 7

      - name: Retain browser template contract fixture
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: csr-template-fixture
          path: target/csr-template-check/output/
          if-no-files-found: error
          retention-days: 7

  smb-sdk:
    name: Produce same-source Debian VFS (build only, prior acceptance retained)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 27fd5581bc144ec934ae24d7b652dc604137c5fa
          persist-credentials: false
      - name: Initialize isolated Cargo home
        run: bash .github/scripts/initialize-cargo-home.sh
      - name: Install repository Rust toolchain
        run: rustup show active-toolchain
      - name: Produce exact Debian SDK and release VFS without repeating acceptance load
        run: bash .github/scripts/debian13-run.sh bash .github/scripts/smb-sdk.sh --build-only
      - name: Preserve exact same-source VFS production receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: debian13-vfs-27fd5581bc144ec934ae24d7b652dc604137c5fa
          path: target/smb-debian13/product/
          if-no-files-found: error
          retention-days: 7
  browser-smoke:
    name: "Standalone ELF: Debian 13 server + host Chrome"
    needs: [web-production, smb-sdk]
    runs-on: ubuntu-24.04
    # Compile one release-profile graph for both product and browser harness.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 27fd5581bc144ec934ae24d7b652dc604137c5fa
          persist-credentials: false
      - name: Initialize isolated Cargo home
        run: bash .github/scripts/initialize-cargo-home.sh
      - name: Install repository Rust toolchain
        run: rustup show active-toolchain
      - name: Fetch production Web assets from this workflow run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-dist
          path: build/web
      - name: Fetch browser template contract fixture from this run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: csr-template-fixture
          path: target/csr-template-check/output
      - name: Fetch matching Debian 13 VFS from this exact workflow commit
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: debian13-vfs-27fd5581bc144ec934ae24d7b652dc604137c5fa
          path: target/smb-debian13/product
      - name: Verify runner Chrome and ChromeDriver
        run: |
          chrome="$(command -v google-chrome)"
          driver="$(command -v chromedriver)"
          "$chrome" --version
          "$driver" --version
          chrome_major=$("$chrome" --version | grep -oE '[0-9]+' | head -1)
          driver_major=$("$driver" --version | grep -oE '[0-9]+' | head -1)
          test "$chrome_major" = "$driver_major"
          echo "CHROME_BIN=$chrome" >> "$GITHUB_ENV"
          echo "CHROMEDRIVER=$driver" >> "$GITHUB_ENV"
      - name: Install CJK fonts for the Chinese screenshot
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y fonts-noto-cjk
      - name: Build and exercise extracted release packages
        env:
          ZXS_SMOKE_SCREENSHOT: artifacts/web-file-manager.png
          ZXS_VIEWPORT_PREVIEWS: artifacts/viewport-previews
        run: |
          export RELEASE_VERSION="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')"
          bash .github/scripts/debian13-run.sh --native python3 .github/scripts/release-native.py
          cargo test --locked --offline --release -p browser-smoke
          bash .github/scripts/release-package.sh
          bash .github/scripts/check-debian13-release.sh
          bash .github/scripts/release-acceptance.sh
          python3 .github/scripts/check-csr-browser.py
          bash .github/scripts/release-assemble.sh
      - name: Record unaccepted native diagnostic inventory
        if: always()
        run: |
          printf 'Unaccepted diagnostic bytes for source %s; not a validated release.\n' '27fd5581bc144ec934ae24d7b652dc604137c5fa'
          for path in \
            target/native/x86_64-unknown-linux-gnu/release/zxs \
            target/native/x86_64-unknown-linux-gnu/release/zxs-rescue \
            target/native/x86_64-unknown-linux-gnu/release/BUILD.txt \
            target/smb-debian13/product/zxs.so \
            target/smb-debian13/product/VFS-BUILD.json \
            build/web \
            target/debian13-native/release/browser-smoke \
            target/native/release/browser-smoke; do
            if [[ -e "$path" ]]; then
              printf 'PRESENT %s\n' "$path"
            else
              printf 'MISSING %s\n' "$path"
            fi
          done
      - name: Retain unaccepted native diagnostic bytes (not final assets)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unaccepted-native-27fd5581bc144ec934ae24d7b652dc604137c5fa
          path: |
            target/native/x86_64-unknown-linux-gnu/release/zxs
            target/native/x86_64-unknown-linux-gnu/release/zxs-rescue
            target/native/x86_64-unknown-linux-gnu/release/BUILD.txt
            target/smb-debian13/product/zxs.so
            target/smb-debian13/product/VFS-BUILD.json
            build/web
            target/debian13-native/release/browser-smoke
            target/native/release/browser-smoke
          if-no-files-found: warn
          retention-days: 7
      - name: Retain Debian 13 single-ELF runtime proof
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: debian13-single-binary
          path: artifacts/debian13-single-binary*
          if-no-files-found: warn
      - name: Retain verified installation candidate (not a published release)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installation-candidate-linux-web
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7
      - name: Retain template browser result and exact input identity
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: csr-template-browser
          path: target/csr-template-check/output/*json
          if-no-files-found: error
          retention-days: 7
      - name: Retain real Web file manager screenshot
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-screenshot
          path: artifacts/web-file-manager.png
          if-no-files-found: error
          retention-days: 7

      - name: Retain responsive Web viewport previews
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: viewport-previews
          path: artifacts/viewport-previews/
          if-no-files-found: warn
          retention-days: 7
