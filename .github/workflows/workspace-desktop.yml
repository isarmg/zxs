name: Workspace desktop qualification

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/workspace-desktop.yml
      - zxs-workspace/zipworkspace/**
      - zxs-workspace/pyproject.toml
      - zxs-workspace/tests/**
      - zxs-workspace/packaging/macos-arm64/**
      - zxs-workspace/packaging/windows-amd64/**
      - zxs-workspace/winfsp/**

permissions:
  contents: read

jobs:
  desktop:
    if: github.ref == 'refs/heads/main'
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            architecture: x64
            name: Windows Server x64 / Qt and NTFS
          - runner: macos-26
            architecture: arm64
            name: macOS 26 arm64 / Qt, APFS and local package
    defaults:
      run:
        working-directory: zxs-workspace
    steps:
      - name: Checkout this Workspace revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: zxs-workspace
      - name: Set up native CPython
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14.10'
          architecture: ${{ matrix.architecture }}
      - name: Check native source, Qt windows, and macOS candidate
        run: python -I -B -X utf8 tests/qualification/hosted_desktop.py
