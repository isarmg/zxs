name: ZXS Rust client

on:
  pull_request:
    branches: [main]
    paths:
      - 'zxs-core/**'
      - '.github/workflows/zxs-core.yml'
  push:
    branches: [main]
    paths:
      - 'zxs-core/**'
      - '.github/workflows/zxs-core.yml'

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    defaults:
      run:
        shell: bash
        working-directory: zxs-core
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: zxs-core
      - name: Use disposable Cargo paths
        run: |
          printf 'CARGO_HOME=%s\nCARGO_TARGET_DIR=%s\n' \
            "${RUNNER_TEMP:?}/zxs-core-cargo" \
            "${RUNNER_TEMP:?}/zxs-core-target" >> "${GITHUB_ENV:?}"
      - name: Verify toolchain and resolve the checked-in lock
        run: |
          test ! -e ../zxs && test ! -e ../helper && test ! -e ../zxs-workspace
          rustup toolchain install 1.100.0 --profile minimal --component rustfmt --component clippy
          rustc +1.100.0 --version --verbose
          test "$(rustc +1.100.0 --version --verbose | sed -n 's/^commit-hash: //p')" = 0ef1bc386059596dada8fb65b50425aab2ea637a
          cargo +1.100.0 fetch --locked --target x86_64-unknown-linux-gnu
      - name: Format, lint and run locked tests offline
        run: |
          unset LIBSQLITE3_SYS_USE_PKG_CONFIG LIBSQLITE3_FLAGS
          cargo +1.100.0 fmt --all -- --check
          cargo +1.100.0 clippy --locked --offline --all-targets -- -D warnings
          cargo +1.100.0 test --locked --offline
      - name: Exercise only the guarded ext4 fixtures offline
        run: |
          unset LIBSQLITE3_SYS_USE_PKG_CONFIG LIBSQLITE3_FLAGS
          umask 077
          ZXS_CORE_NATIVE_TEST_ROOT="$(mktemp -d -- "${RUNNER_TEMP:?}/zxs-core-native.XXXXXXXX")"
          export ZXS_CORE_NATIVE_TEST_ROOT
          trap 'rm -rf -- "$ZXS_CORE_NATIVE_TEST_ROOT"' EXIT
          if [[ "$(findmnt -rno FSTYPE -T "$ZXS_CORE_NATIVE_TEST_ROOT")" != ext4 ]]; then
            echo "::error::Native fixture requires disposable ext4 runner scratch"
            exit 1
          fi
          cargo +1.100.0 test --locked --offline --lib native::tests:: -- --ignored --nocapture
          cargo +1.100.0 test --locked --offline --lib workspace::tests::detached_lease_refuses_local_and_wire_custody -- --ignored --nocapture
          cargo +1.100.0 test --locked --offline --lib workspace::tests::payload_reader_leaves_wal_marker_and_sidecars_untouched -- --ignored --nocapture
          cargo +1.100.0 test --locked --offline --test linux_zip deterministic_native_zip -- --ignored --nocapture
