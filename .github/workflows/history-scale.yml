name: Current source bounded history baseline

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Selftest is bounded to 8 records; acceptance requires an authorized frozen plan
        type: choice
        options: [selftest, acceptance]
        default: selftest
        required: true
      build_run_id:
        description: Reuse a run with both original binary builds successful; required for scale modes
        type: string
        default: ''
      build_carrier_sha:
        description: Exact carrier SHA of the reused selftest build run
        type: string
        default: ''
      selftest_run_id:
        description: Successful N8 validation of these exact builds; scale modes default to build_run_id
        type: string
        default: ''

permissions:
  contents: read
  actions: read

concurrency:
  group: history-growth-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: '0'
  CARGO_BUILD_JOBS: '2'
  RUSTUP_TOOLCHAIN: '1.99.0'
  RUST_BACKTRACE: '1'

jobs:
  controller:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      baseline_sha: ${{ steps.select.outputs.baseline_sha }}
      candidate_sha: ${{ steps.select.outputs.candidate_sha }}
      matrix: ${{ steps.select.outputs.matrix }}
      build_required: ${{ steps.select.outputs.build_required }}
      build_run_id: ${{ steps.select.outputs.build_run_id }}
      build_carrier_sha: ${{ steps.select.outputs.build_carrier_sha }}
      selftest_run_id: ${{ steps.select.outputs.selftest_run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check bounded controller and evidence tooling
        run: |
          set -euo pipefail
          python3 -m unittest discover -s test/history-scale-bench -p 'test_*.py' -v 2>&1 | tee tooling-tests.log
          {
            python3 .github/scripts/check-workflows.py
            python3 .github/scripts/check-workflows.py tools/history-scale-bench/workflow.yml
            python3 tools/rust-sources/documentation.py verify
          } 2>&1 | tee static.log
      - name: Select only the authorized matrix before any build
        id: select
        env:
          MODE: ${{ inputs.mode }}
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
          BUILD_CARRIER_SHA: ${{ inputs.build_carrier_sha }}
          SELFTEST_RUN_ID: ${{ inputs.selftest_run_id }}
        run: |
          cp .github/history-current-plan.json current-plan.json
          python3 tools/history-scale-bench/controller.py \
            --plan .github/history-current-plan.json \
            --mode "$MODE" --candidate-only --output selection.json --github-output "$GITHUB_OUTPUT" \
            --build-run-id "$BUILD_RUN_ID" --build-carrier-sha "$BUILD_CARRIER_SHA" \
            --selftest-run-id "$SELFTEST_RUN_ID"
      - name: Require successful original builds and a passed selftest before scale
        if: steps.select.outputs.build_required == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILD_RUN_ID: ${{ steps.select.outputs.build_run_id }}
          BUILD_CARRIER_SHA: ${{ steps.select.outputs.build_carrier_sha }}
          SELFTEST_RUN_ID: ${{ steps.select.outputs.selftest_run_id }}
          MODE: ${{ inputs.mode }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN_ID" > reuse-run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN_ID/jobs?per_page=100" > reuse-build-jobs.json
          if [ "$MODE" != selftest ]; then
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SELFTEST_RUN_ID" > selftest-run.json
          fi
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import sys
          sys.path.insert(0, "tools/history-scale-bench")
          from controller import validate_build_jobs, validate_reuse_run
          validate_build_jobs(json.loads(Path("reuse-run.json").read_text()), json.loads(Path("reuse-build-jobs.json").read_text()),
                              os.environ["BUILD_RUN_ID"], os.environ["BUILD_CARRIER_SHA"], candidate_only=True)
          if os.environ["MODE"] != "selftest":
              passed = json.loads(Path("selftest-run.json").read_text())
              validate_reuse_run(passed, os.environ["SELFTEST_RUN_ID"], passed["head_sha"])
          PY
      - name: Fetch the original selftest selection
        if: steps.select.outputs.build_required == 'false' && inputs.mode != 'selftest'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: history-growth-controller-${{ steps.select.outputs.selftest_run_id }}
          run-id: ${{ steps.select.outputs.selftest_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: reused-controller
      - name: Fetch the original selftest evidence
        if: steps.select.outputs.build_required == 'false' && inputs.mode != 'selftest'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: history-growth-small-selftest-${{ steps.select.outputs.selftest_run_id }}
          run-id: ${{ steps.select.outputs.selftest_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: reused-selftest
      - name: Check all original micro lifecycle stages passed
        if: steps.select.outputs.build_required == 'false' && inputs.mode != 'selftest'
        env:
          BUILD_RUN_ID: ${{ steps.select.outputs.build_run_id }}
          BUILD_CARRIER_SHA: ${{ steps.select.outputs.build_carrier_sha }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import sys
          sys.path.insert(0, "tools/history-scale-bench")
          from controller import load_plan, validate_reused_selftest
          from summarize import read_json
          selections = list(Path("reused-controller").rglob("selection.json"))
          summaries = list(Path("reused-selftest").rglob("summary.json"))
          if len(selections) != 1 or len(summaries) != 1:
              raise ValueError("missing or ambiguous original selftest selection/summary")
          validate_reused_selftest(read_json(selections[0].read_text()), read_json(summaries[0].read_text()),
                                   os.environ["BUILD_RUN_ID"], os.environ["BUILD_CARRIER_SHA"],
                                   load_plan(Path(".github/history-current-plan.json"))["reviewed_candidate_sha"], candidate_only=True)
          PY
      - name: Retain selection and exact tools
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: history-growth-controller-${{ github.run_id }}
          path: |
            selection.json
            current-plan.json
            tooling-tests.log
            static.log
            reuse-run.json
            reuse-build-jobs.json
            selftest-run.json
            tools/history-scale-bench/
            test/history-scale-bench/
          if-no-files-found: error
          retention-days: 30

  build:
    needs: controller
    if: needs.controller.outputs.build_required == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        label: [candidate]
    env:
      SOURCE_SHA: ${{ matrix.label == 'baseline' && needs.controller.outputs.baseline_sha || needs.controller.outputs.candidate_sha }}
      CANDIDATE_SHA: ${{ needs.controller.outputs.candidate_sha }}
      ADAPTER: ${{ matrix.label == 'baseline' && 'history-scale-baseline' || 'history-scale-current' }}
    steps:
      - name: Checkout exact tools carrier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: carrier
      - name: Checkout exact product source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: isarmg/zxs
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
          path: source
      - name: Initialize isolated offline Cargo home
        run: bash carrier/.github/scripts/initialize-cargo-home.sh
      - name: Pin compiler and record build host
        run: |
          mkdir bundle
          rustup toolchain install 1.99.0 --profile minimal
          rustup component add rustfmt --toolchain 1.99.0
          rustc +1.99.0 --version --verbose > bundle/rustc.txt
          cargo +1.99.0 --version > bundle/cargo.txt
          lscpu --json > bundle/cpu.json
          uname -a > bundle/kernel.txt
          git -C source rev-parse HEAD HEAD^{tree} > bundle/source.txt
          git -C carrier rev-parse HEAD HEAD^{tree} > bundle/observer.txt
          cp carrier/tools/history-scale-bench/driver.rs bundle/driver.formatted.rs
          rustfmt +1.99.0 --edition 2024 bundle/driver.formatted.rs
          rustfmt +1.99.0 --edition 2024 --check carrier/tools/history-scale-bench/driver.rs > bundle/rustfmt-check.log 2>&1
      - name: Verify actual source export and maintained tool documentation
        working-directory: carrier
        run: |
          set -euo pipefail
          cargo +1.99.0 test --locked --offline -p contract-check --test source_export -- --nocapture 2>&1 | tee ../bundle/source-export.log
          cargo +1.99.0 run --locked --offline -p contract-check -- --root . 2>&1 | tee ../bundle/docs.log
      - name: Register the same ordinary binary
        run: |
          python3 carrier/tools/history-scale-bench/prepare.py --source source \
            --candidate-sha "$CANDIDATE_SHA" > bundle/registration.json
      - name: Build this version once for every selected scale
        working-directory: source
        run: |
          cargo +1.99.0 tree --locked --offline -p perf-check -e normal,build,features --features "$ADAPTER" > ../bundle/features.txt
          python3 - "$ADAPTER" <<'PY'
          import json
          from pathlib import Path
          import subprocess
          import sys
          command = ["cargo", "+1.99.0", "build", "--locked", "--offline", "--release", "-p", "perf-check",
                     "--bin", "history-scale-driver", "--features", sys.argv[1], "--message-format=json"]
          Path("../bundle/build-command.json").write_text(json.dumps(command) + "\n")
          with open("../bundle/build.jsonl", "w") as output, open("../bundle/build.stderr.log", "w") as errors:
              subprocess.run(command, stdout=output, stderr=errors, check=True)
          PY
          cp target/native/release/history-scale-driver ../bundle/history-scale-driver
          python3 ../carrier/tools/history-scale-bench/verify_build.py \
            --input ../bundle/build.jsonl --source . \
            --binary ../bundle/history-scale-driver --registration ../bundle/registration.json \
            --build-command ../bundle/build-command.json \
            --output ../bundle/provenance.json
          git diff -- tools/perf-check/Cargo.toml > ../bundle/harness.patch
      - name: Retain binary and complete build evidence even on failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: history-growth-binary-${{ matrix.label }}-${{ github.run_id }}
          path: bundle/
          if-no-files-found: error
          retention-days: 30

  validation:
    needs: [controller, build]
    if: ${{ always() && needs.controller.result == 'success' && (needs.build.result == 'success' || needs.build.result == 'skipped') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.controller.outputs.matrix) }}
    steps:
      - name: Checkout exact tools carrier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: carrier
      - name: Checkout candidate source for provenance verification
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: isarmg/zxs
          ref: ${{ needs.controller.outputs.candidate_sha }}
          persist-credentials: false
          path: candidate-source
      - name: Download the single candidate build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: history-growth-binary-candidate-${{ needs.controller.outputs.build_run_id }}
          path: binaries/candidate
          run-id: ${{ needs.controller.outputs.build_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install resource tools and fixed compiler metadata
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y strace time
          rustup toolchain install 1.99.0 --profile minimal
          chmod +x binaries/candidate/history-scale-driver
      - name: Record conservative runner contract and process affinity
        env:
          PROFILE: ${{ matrix.profile }}
        run: |
          mkdir -p evidence
          python3 - <<'PYCONTRACT'
          import json
          import os
          from pathlib import Path
          import shutil
          import subprocess
          allowed = sorted(os.sched_getaffinity(0))
          if len(allowed) < 2:
              raise RuntimeError("two available CPUs are required; do not silently change the fixture")
          cpus = allowed[:2]
          with open(os.environ["GITHUB_ENV"], "a") as output:
              output.write("HISTORY_CPUSET=" + ",".join(map(str, cpus)) + "\n")
          memory = dict(line.split(":", 1) for line in Path("/proc/meminfo").read_text().splitlines())
          identity = subprocess.check_output(["git", "-C", "candidate-source", "rev-parse", "HEAD", "HEAD^{tree}"], text=True).splitlines()
          if identity != ["d3eefd289e53a2803703870fe4250d08cadff9b5", "52d5076189204952dbfaf4d3c2c76b93553d1b3e"]:
              raise ValueError("current product source/tree differs from the authorized contract")
          small = os.environ["PROFILE"] == "small-selftest"
          contract = {"source_sha": identity[0], "source_tree": identity[1],
                      "non_representative_cloud_fixture": True, "development_directory_disk": True,
                      "allowed_cpus": allowed, "selected_cpus": cpus, "mem_total": memory["MemTotal"].strip(),
                      "initial_disk_usage": dict(shutil.disk_usage("evidence")._asdict()),
                      "rss_mib": 2048, "disk_mib_per_sample": 4096, "cohort_disk_mib": 8192,
                      "minimum_free_mib": 4096, "rss_resolution_seconds": 0.5,
                      "profile": os.environ["PROFILE"],
                      "phase_seconds": 60 if small else 600, "cohort_seconds": 240 if small else 2400,
                      "timing_sizes": [8] if small else [255, 256, 257, 1023, 1024, 1025],
                      "counts_sizes": [8] if small else [1025],
                      "timing_repeats": 1, "counts_repeats": 1,
                      "observer_sha": os.environ["GITHUB_SHA"], "run_id": os.environ["GITHUB_RUN_ID"]}
          Path("evidence/runner-contract.json").write_text(json.dumps(contract, indent=2) + "\n")
          PYCONTRACT
      - name: Run the gated profile with the original binaries
        env:
          PROFILE: ${{ matrix.profile }}
          BUILD_RUN_ID: ${{ needs.controller.outputs.build_run_id }}
          BUILD_CARRIER_SHA: ${{ needs.controller.outputs.build_carrier_sha }}
        run: |
          taskset -c "$HISTORY_CPUSET" python3 carrier/tools/history-scale-bench/run.py --candidate-only \
            --plan carrier/.github/history-current-plan.json --profile "$PROFILE" \
            --candidate-source candidate-source \
            --candidate-binary binaries/candidate/history-scale-driver \
            --candidate-provenance binaries/candidate/provenance.json \
            --build-run-id "$BUILD_RUN_ID" --build-carrier-sha "$BUILD_CARRIER_SHA" \
            --output-root "evidence/$PROFILE" \
            --rss-mib 2048 --disk-mib 4096 --cohort-disk-mib 8192 --minimum-free-mib 4096
      - name: Retain all outcomes and raw evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: history-growth-${{ matrix.profile }}-${{ github.run_id }}
          path: |
            evidence/
            !evidence/**/pool/**
          if-no-files-found: error
          retention-days: 30
