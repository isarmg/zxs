name: Debian 13 system Samba and matching VFS

on:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  RUST_BACKTRACE: '1'

jobs:
  smb-sdk:
    name: Debian 13 apt Samba exact SDK ABI and real SMB acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Initialize isolated Cargo home
        run: bash .github/scripts/initialize-cargo-home.sh
      - name: Install repository Rust toolchain
        run: rustup show active-toolchain
      - name: Build exact Debian source SDK and matching VFS
        run: bash .github/scripts/debian13-run.sh bash .github/scripts/smb-sdk.sh
      - name: Build minimal Debian system-Samba runtime acceptance image
        run: |
          version="$(python3 -c 'import json;print(json.load(open(".github/samba-debian-target.json"))["package_version"])')"
          docker build --build-arg "SAMBA_VERSION=$version" --file .github/containers/debian13-runtime.Dockerfile --tag zxs-debian13-runtime .github/containers
      - name: Load VFS in apt smbd and exercise real storage engine without compiler or network
        run: |
          fixture="$(cat target/smb-debian13/fixture-path.txt)"
          modules="$(docker run --rm --network none zxs-debian13-runtime smbd -b | sed -n 's/^[[:space:]]*MODULESDIR: //p')"
          [[ "$modules" =~ ^/[a-zA-Z0-9_./-]+$ ]] || exit 1
          docker run --rm --init --network none --volume "$PWD:/work" \
            --volume "$PWD/target/smb-debian13/product/zxs.so:$modules/vfs/zxs.so:ro" \
            --env ZXS_ISOLATED_SAMBA_TEST=1 zxs-debian13-runtime \
            python3 .github/scripts/check-system-samba.py --fixture "$fixture" \
            --module target/smb-debian13/product/zxs.so --output target/smb-debian13/product/system-samba.json
      - name: Preserve exact VFS and system-Samba evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: debian13-vfs-${{ github.sha }}
          if-no-files-found: error
          path: target/smb-debian13/product/
