# Reusable exact SDK: full suite or an independently selected descriptor-only suite.
name: Debian 13 system Samba and matching VFS

on:
  workflow_call:
    inputs:
      suite:
        type: string
        required: false
        default: full

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  RUST_BACKTRACE: '1'

jobs:
  smb-sdk:
    name: Debian 13 apt Samba exact SDK (${{ inputs.suite }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Initialize isolated Cargo home
        run: bash .github/scripts/initialize-cargo-home.sh
      - name: Install repository Rust toolchain
        run: rustup show active-toolchain
      - name: Validate the reviewed SDK scope
        env:
          ZXS_SDK_SUITE: ${{ inputs.suite }}
        run: |
          case "$ZXS_SDK_SUITE" in
            full|manual-fd) ;;
            *) printf 'unsupported SDK suite\n' >&2; exit 1 ;;
          esac
      - name: Build exact Debian source SDK and matching VFS
        env:
          ZXS_SDK_SUITE: ${{ inputs.suite }}
        run: |
          args=()
          if [[ "$ZXS_SDK_SUITE" == manual-fd ]]; then args=(--manual-fd-tests); fi
          bash .github/scripts/debian13-run.sh bash .github/scripts/smb-sdk.sh "${args[@]}"
      - name: Bind bounded SDK evidence to the triggering commit
        if: inputs.suite == 'manual-fd'
        env:
          ZXS_EXPECTED_HEAD: ${{ github.sha }}
        run: |
          python3 - <<'PYSDK'
          import json, os
          from pathlib import Path
          receipt = json.loads(Path('target/targeted-ci/summary.json').read_text())
          if (receipt['head'] != os.environ['ZXS_EXPECTED_HEAD']
                  or receipt['status'] != 'selected-sdk-tests-passed'
                  or receipt['scope'] != 'smb-vfs-manual-fd'):
              raise ValueError('bounded SDK evidence is not from this successful exact run')
          PYSDK
      - name: Build minimal Debian system-Samba runtime acceptance image
        if: inputs.suite == 'full'
        run: |
          version="$(python3 -c 'import json;print(json.load(open(".github/samba-debian-target.json"))["package_version"])')"
          docker build --build-arg "SAMBA_VERSION=$version" --file .github/containers/debian13-runtime.Dockerfile --tag zxs-debian13-runtime .github/containers
      - name: Load VFS in apt smbd and exercise real storage engine without compiler or network
        if: inputs.suite == 'full'
        run: |
          fixture="$(cat target/smb-debian13/fixture-path.txt)"
          modules="$(docker run --rm --network none zxs-debian13-runtime smbd -b | sed -n 's/^[[:space:]]*MODULESDIR: //p')"
          [[ "$modules" =~ ^/[a-zA-Z0-9_./-]+$ ]] || exit 1
          docker run --rm --init --network none --volume "$PWD:/work" \
            --volume "$PWD/target/smb-debian13/product/zxs.so:$modules/vfs/zxs.so:ro" \
            --env ZXS_ISOLATED_SAMBA_TEST=1 zxs-debian13-runtime \
            python3 .github/scripts/check-system-samba.py --fixture "$fixture" \
            --module target/smb-debian13/product/zxs.so --output target/smb-debian13/product/system-samba.json
      - name: Preserve exact VFS and system-Samba evidence
        if: always() && inputs.suite == 'full'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: debian13-vfs-${{ github.sha }}
          if-no-files-found: error
          path: target/smb-debian13/product/
      - name: Preserve bounded real-SDK descriptor evidence
        if: always() && inputs.suite == 'manual-fd'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: debian13-vfs-manual-fd-${{ github.sha }}
          if-no-files-found: error
          path: |
            target/targeted-ci/summary.json
            target/targeted-ci/*.log
