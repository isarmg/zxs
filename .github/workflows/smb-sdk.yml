name: In-repository Samba and VFS build

on:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  RUST_BACKTRACE: '1'

jobs:
  smb-sdk:
    name: Samba 4.23.0 real SDK ABI and FFI tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Initialize isolated Cargo home
        run: bash .github/scripts/initialize-cargo-home.sh
      - name: Install repository Rust toolchain
        run: rustup show active-toolchain
      - name: Install official Ubuntu SDK build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential pkg-config python3 perl libparse-yapp-perl flex bison m4 \
            clang libclang-dev libgnutls28-dev libkrb5-dev zlib1g-dev libpopt-dev
      - name: Cache pinned configured Samba source and real libraries
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/smb-sdk
          key: samba-4.23.0-${{ runner.os }}-${{ runner.arch }}-ubuntu24-${{ hashFiles('.github/scripts/smb-sdk.sh', 'tools/samba-source/manage.py', 'compliance/sources/samba/source.json') }}
      - name: Build repository Samba daemon/client and validate matching Rust VFS
        run: bash .github/scripts/smb-sdk.sh
      - name: Preserve matching SMB products and dependency receipts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: samba-4.23.0-and-vfs-${{ github.sha }}
          if-no-files-found: error
          path: |
            target/smb-sdk/samba-build-tree.tar.gz
            target/smb-sdk/libsmb_vfs.so
            target/smb-sdk/product-receipt/
            compliance/sources/samba/
            compliance/licenses/upstream/samba-4.23.0/
