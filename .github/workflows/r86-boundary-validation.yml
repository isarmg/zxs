name: R86 boundary validation

on:
  push:
    branches: [work/codex-r86-boundary-fixes-20261029]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r86-boundary-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: '1'
  CARGO_INCREMENTAL: '0'

jobs:
  rust-format:
    name: Affected Rust format
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify fixed formatter and affected package
        run: |
          git rev-parse HEAD
          rustc --version
          cargo fmt --package storage-engine -- --check

  source-regressions:
    name: Source mapping counterexamples
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Record exact source and run real mapping and receipt regressions
        run: |
          git rev-parse HEAD
          python3 -m unittest discover -s test/tools/rust-sources -p 'test_source_backport.py' -v

  source-governance:
    name: Affected source replay and fixed receipt identity
    needs: source-regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Initialize isolated Cargo home
        run: bash .github/scripts/initialize-cargo-home.sh
      - name: Verify pinned toolchain
        run: |
          rustc --version
          cargo --version
      - name: Run affected maintenance chain regressions
        run: |
          python3 -m unittest discover -s test/tools/rust-sources -p 'test_legacy_http_maintenance*.py' -v
          python3 -m unittest discover -s test/tools/rust-sources -p 'test_proof_maintenance.py' -v
      - name: Verify live source identities and maintenance replay
        run: python3 tools/rust-sources/manage.py verify
      - name: Verify unchanged fixed HTTP receipt explicitly
        run: |
          python3 tools/rust-sources/source_backport.py verify \
            --receipt c75e73b0b8aab76fc3934f6c72620127795b8c95ec7bc0f52d173664e477938d
      - name: Verify byte identity of previously tested HTTP consumers and dependencies
        run: |
          git diff --exit-code a898b862ba2317248b3921569bf1d7347db25d7c HEAD -- \
            src/foundation test/architecture/http-transport test/foundation/http-transport \
            Cargo.toml Cargo.lock rust-toolchain.toml .github/scripts/check-http-transport.py

  directory-regressions:
    name: Real directory sync retry and engine regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Initialize isolated Cargo home
        run: bash .github/scripts/initialize-cargo-home.sh
      - name: Verify fixed toolchain
        run: |
          git rev-parse HEAD
          rustc --version
          cargo --version
      - name: Run object and directory retry probes through the real workspace entry
        run: python3 .github/scripts/check-history-object-io.py
      - name: Run complete engine tests
        run: cargo test --locked --offline -p storage-engine --lib
      - name: Check affected Rust formatting
        if: always()
        run: cargo fmt --package storage-engine -- --check
