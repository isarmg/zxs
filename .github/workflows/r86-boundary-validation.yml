name: R86 boundary validation

on:
  push:
    branches: [work/codex-r86-boundary-fixes-20261029]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r86-boundary-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: '1'
  CARGO_INCREMENTAL: '0'

jobs:
  source-regressions:
    name: Source mapping counterexamples
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Record exact source and run real mapping and receipt regressions
        run: |
          git rev-parse HEAD
          python3 -m unittest discover -s test/tools/rust-sources -p 'test_source_backport.py' -v

  source-governance:
    name: Complete source replay and fixed HTTP consumers
    needs: source-regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Initialize isolated Cargo home
        run: bash .github/scripts/initialize-cargo-home.sh
      - name: Verify pinned toolchain and add WASM target
        run: |
          rustc --version
          cargo --version
          rustup target add wasm32-unknown-unknown
      - name: Verify complete source maintenance chain and regressions
        run: bash .github/scripts/check.sh rust-sources
      - name: Verify unchanged fixed HTTP receipt explicitly
        run: |
          python3 tools/rust-sources/source_backport.py verify \
            --receipt c75e73b0b8aab76fc3934f6c72620127795b8c95ec7bc0f52d173664e477938d
      - name: Verify actual HTTP consumers and retained fixed backport
        run: python3 .github/scripts/check-http-transport.py

  directory-regressions:
    name: Real directory sync retry and engine regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Initialize isolated Cargo home
        run: bash .github/scripts/initialize-cargo-home.sh
      - name: Verify fixed toolchain and build one engine libtest artifact
        run: |
          git rev-parse HEAD
          rustc --version
          cargo --version
          cargo test --locked --offline -p storage-engine --lib --no-run \
            --message-format=json > "$RUNNER_TEMP/r86-engine-build.jsonl"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          records = [json.loads(line) for line in
                     Path(os.environ['RUNNER_TEMP'], 'r86-engine-build.jsonl').read_text().splitlines()]
          artifacts = [r['executable'] for r in records
                       if r.get('reason') == 'compiler-artifact'
                       and r['target']['name'] == 'storage_engine'
                       and 'lib' in r['target']['kind']
                       and r['profile']['test'] and r.get('executable')]
          if len(artifacts) != 1 or [r['success'] for r in records if r.get('reason') == 'build-finished'] != [True]:
              raise SystemExit('Expected exactly one current successful engine libtest artifact')
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write('R86_ENGINE_LIBTEST=' + artifacts[0] + '\n')
          print('Exact engine libtest:', artifacts[0])
          PY
      - name: Reproduce directory creation error, same-resource retry and process reopen
        run: bash test/engine/unit/disk/owned_directory_io/run.sh "$R86_ENGINE_LIBTEST"
      - name: Preserve existing immutable object barriers with the same artifact
        run: bash test/engine/unit/history_package/immutable_io/run.sh "$R86_ENGINE_LIBTEST"
      - name: Run complete engine tests
        run: cargo test --locked --offline -p storage-engine --lib
