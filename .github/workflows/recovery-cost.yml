# Verification-only carrier. Both products retain their original normal CI.
name: Recovery cost comparison
on:
  push:
    branches: [verify/codex-recovery-cost-20261029]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: codex-recovery-cost-${{ github.ref }}
  cancel-in-progress: false
jobs:
  paired:
    name: Paired recovery (${{ matrix.files }} files)
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        files: [500]
    env:
      CARGO_NET_OFFLINE: 'true'
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
      CARGO_TERM_COLOR: never
      RUST_BACKTRACE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          path: harness
          sparse-checkout: |
            tools/recovery-cost
            test/engine/bench/recovery_cost
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: 99f02cb978bff53f28d1ad8414037a3f52d74cd2
          path: baseline
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: 505cbfb524e9a2a4150a229cd2fd90f1acd8bed9
          path: candidate
      - name: Authenticate products and install only the standalone measurement adapters
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/recovery-evidence"
          printf 'ZXS_MEASUREMENT_DEADLINE_UNIX=%s\n' "$(( $(date +%s) + 150 * 60 ))" >> "$GITHUB_ENV"
          printf 'CARGO_HOME=%s\n' "$(mktemp -d "$RUNNER_TEMP/recovery-cargo.XXXXXX")" >> "$GITHUB_ENV"
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess, tomllib
          root = pathlib.Path.cwd()
          out = pathlib.Path(os.environ['RUNNER_TEMP']) / 'recovery-evidence'
          identities = {
              'baseline': ('99f02cb978bff53f28d1ad8414037a3f52d74cd2','96d02c531530729ede98b524af819198cbdb3c8a'),
              'candidate': ('505cbfb524e9a2a4150a229cd2fd90f1acd8bed9','d3c8b81371e5153c10230c32e7b7c3ccc5c506c8'),
          }
          records = {}
          for name, (sha, tree) in identities.items():
              product = root / name
              def git(*args):
                  return subprocess.check_output(['git', '-C', str(product), *args]).decode().strip()
              assert git('rev-parse','HEAD') == sha
              assert git('rev-parse','HEAD^{tree}') == tree
              assert not git('status','--porcelain')
              assert tomllib.loads((product/'rust-toolchain.toml').read_text())['toolchain']['channel'] == '1.99.0'
              manifest = product/'src/engine/Cargo.toml'
              original = manifest.read_bytes()
              assert 'task1_adoption' not in original.decode()
              source = root/'harness/test/engine/bench/recovery_cost'/'driver.rs'
              destination = product/'test/engine/bench/task1_adoption.rs'
              destination.parent.mkdir(parents=True, exist_ok=True)
              assert not destination.exists()
              destination.write_bytes(source.read_bytes())
              manifest.write_bytes(original + b'\n[[bin]]\nname="task1_adoption"\npath="../../test/engine/bench/task1_adoption.rs"\ntest=false\nbench=false\n')
              changed = git('diff','--name-only').splitlines()
              untracked = git('ls-files','--others','--exclude-standard').splitlines()
              assert changed == ['src/engine/Cargo.toml'], changed
              assert untracked == ['test/engine/bench/task1_adoption.rs'], untracked
              records[name] = dict(sha=sha, tree=tree,
                  adapter_sha256=hashlib.sha256(destination.read_bytes()).hexdigest(),
                  manifest_before_sha256=hashlib.sha256(original).hexdigest(),
                  manifest_after_sha256=hashlib.sha256(manifest.read_bytes()).hexdigest(),
                  catalog_blob=git('rev-parse','HEAD:compliance/rust-sources.json'),
                  lock_blob=git('rev-parse','HEAD:Cargo.lock'),
                  configuration_blob=git('rev-parse','HEAD:.cargo/config.toml'))
          records['workflow_sha'] = os.environ['GITHUB_SHA']
          records['runner'] = dict(os=os.environ['RUNNER_OS'], arch=os.environ['RUNNER_ARCH'])
          records['scope'] = 'measurement-only adapters; no production/source receipt update'
          (out/'input-identity.json').write_text(json.dumps(records,indent=2)+'\n')
          PY
          uname -a > "$RUNNER_TEMP/recovery-evidence/uname.txt"
          lscpu > "$RUNNER_TEMP/recovery-evidence/lscpu.txt"
          free -b > "$RUNNER_TEMP/recovery-evidence/memory-before.txt"
          df -B1 > "$RUNNER_TEMP/recovery-evidence/disk-before.txt"
          command -v strace
          strace --version > "$RUNNER_TEMP/recovery-evidence/strace.txt"
          rustup component add rustfmt --toolchain 1.99.0
          python3 -m py_compile harness/tools/recovery-cost/run.py
          rustfmt +1.99.0 --edition 2024 --emit stdout harness/test/engine/bench/recovery_cost/driver.rs > "$RUNNER_TEMP/recovery-evidence/driver-formatted.rs"
      - name: Build both fixed Rust 1.99 release adapters without development features
        timeout-minutes: 60
        shell: bash
        run: |
          set -euo pipefail
          for product in baseline candidate; do
            (
              cd "$product"
              rustc --version | tee "$RUNNER_TEMP/recovery-evidence/$product-rustc.txt"
              cargo --version | tee "$RUNNER_TEMP/recovery-evidence/$product-cargo.txt"
              grep -q '^rustc 1\.99\.0 ' "$RUNNER_TEMP/recovery-evidence/$product-rustc.txt"
              grep -q '^cargo 1\.99\.0 ' "$RUNNER_TEMP/recovery-evidence/$product-cargo.txt"
              printf '%s\n' 'cargo build --locked --offline --release -p storage-engine --bin task1_adoption --message-format=json -vv' > "$RUNNER_TEMP/recovery-evidence/$product-build-command.txt"
              CARGO_TARGET_DIR="$RUNNER_TEMP/recovery-target-$product" cargo build --locked --offline --release -p storage-engine --bin task1_adoption --message-format=json -vv > "$RUNNER_TEMP/recovery-evidence/$product-build.jsonl" 2> "$RUNNER_TEMP/recovery-evidence/$product-build.log"
              sha256sum "$RUNNER_TEMP/recovery-target-$product/release/task1_adoption" > "$RUNNER_TEMP/recovery-evidence/$product-binary.sha256"
            )
          done
          python3 - <<'PY'
          import json, os, pathlib
          root = pathlib.Path.cwd()
          evidence = pathlib.Path(os.environ['RUNNER_TEMP']) / 'recovery-evidence'
          selected = {}
          for name in ('baseline','candidate'):
              manifest = str(root / name / 'src/engine/Cargo.toml')
              lines = (evidence / f'{name}-build.jsonl').read_text().splitlines()
              # Cargo -vv interleaves bracket-prefixed build-script output with JSON messages.
              records = [json.loads(line) for line in lines if line.startswith('{')]
              assert [row['success'] for row in records if row['reason'] == 'build-finished'] == [True]
              artifacts = [row for row in records if row['reason'] == 'compiler-artifact' and row['manifest_path'] == manifest]
              assert any(row['target']['kind'] == ['lib'] for row in artifacts), 'engine library compile evidence missing'
              assert any(row['target']['kind'] == ['bin'] and row['target']['name'] == 'task1_adoption' for row in artifacts), 'measurement binary evidence missing'
              for row in artifacts:
                  assert not set(row['features']) & {'fault-injection','test-support'}, row
              selected[name] = artifacts
          (evidence / 'actual-engine-features.json').write_text(json.dumps(selected,indent=2)+'\n')
          PY
      - name: Run three untraced pairs and one separate synchronization-count pair
        shell: bash
        run: |
          set -euo pipefail
          python3 harness/tools/recovery-cost/run.py \
            --baseline "$RUNNER_TEMP/recovery-target-baseline/release/task1_adoption" \
            --candidate "$RUNNER_TEMP/recovery-target-candidate/release/task1_adoption" \
            --output "$RUNNER_TEMP/recovery-evidence/results" \
            --pool-parent "$RUNNER_TEMP/recovery-pools" \
            --deadline-unix "$ZXS_MEASUREMENT_DEADLINE_UNIX" \
            --sizes '${{ matrix.files }}'
      - name: Confirm no measurement changed production source or authoritative records
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          root=pathlib.Path.cwd()
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'recovery-evidence'
          records=json.loads((out/'input-identity.json').read_text())
          for name in ('baseline','candidate'):
              def git(*args):
                  return subprocess.check_output(['git','-C',str(root/name),*args]).decode().strip()
              assert git('rev-parse','HEAD') == records[name]['sha']
              assert hashlib.sha256((root/name/'src/engine/Cargo.toml').read_bytes()).hexdigest() == records[name]['manifest_after_sha256']
              assert hashlib.sha256((root/name/'test/engine/bench/task1_adoption.rs').read_bytes()).hexdigest() == records[name]['adapter_sha256']
              assert git('diff','--name-only').splitlines() == ['src/engine/Cargo.toml']
              assert git('ls-files','--others','--exclude-standard').splitlines() == ['test/engine/bench/task1_adoption.rs']
          (out/'source-unchanged.txt').write_text('Only declared standalone benchmark binary and manifest wiring differ.\n')
          PY
      - name: Upload available raw evidence for success, failure or incomplete measurements
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: recovery-paired-${{ matrix.files }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/recovery-evidence/
          if-no-files-found: error
          retention-days: 14

  correctness:
    name: Recovery scope and graph regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_NET_OFFLINE: 'true'
      CARGO_INCREMENTAL: '0'
      CARGO_TERM_COLOR: never
      RUST_BACKTRACE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: 505cbfb524e9a2a4150a229cd2fd90f1acd8bed9
      - name: Initialize isolated Cargo home
        run: bash .github/scripts/initialize-cargo-home.sh
      - name: Verify pinned compiler and format affected files
        run: |
          mkdir -p evidence
          rustc +1.99.0 --version --verbose > evidence/rustc.txt
          rustup component add rustfmt --toolchain 1.99.0
          rustfmt +1.99.0 --edition 2024 --check src/engine/src/namespace.rs src/engine/src/segment_store.rs src/engine/src/history_package.rs src/engine/src/history_package/manifest.rs src/engine/src/history_package/state_read.rs test/engine/unit/namespace/object_loader_memo_tests.rs test/engine/unit/history_package/admitted_projection_tests.rs > evidence/format.log 2>&1
      - name: Execute new scope and binding regressions
        if: always()
        run: |
          set -euo pipefail
          cargo test --locked --offline -p storage-engine --lib admission_node_memo -- --nocapture 2>&1 | tee evidence/node-memo-tests.log
          cargo test --locked --offline -p storage-engine --lib admitted_directory_projection_reuses_facts_only_for_its_snapshot -- --nocapture 2>&1 | tee evidence/directory-facts-test.log
          cargo test --locked --offline -p storage-engine --lib admitted_snapshot_binding_rejects_rehashed_different_and_invalid_histories -- --nocapture 2>&1 | tee evidence/graph-binding-test.log
          cargo test --locked --offline -p storage-engine --lib recovery_checkpoint -- --nocapture 2>&1 | tee evidence/checkpoint-tests.log
      - name: Retain actual test logs and source identity
        if: always()
        run: |
          git rev-parse HEAD > evidence/source-sha.txt
          git rev-parse HEAD^{tree} > evidence/source-tree.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: recovery-correctness
          path: evidence/
          if-no-files-found: error
          retention-days: 14
