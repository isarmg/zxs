::directory_rename_reads_no_descendant_pages', 'namespace::tests::page_local_tests::encoding_work_counts_duplicate_encoding_before_address_deduplication', 'namespace::tests::page_local_tests::batched_deletions_collapse_to_one_page_and_then_an_empty_root', 'namespace::tests::page_local_tests::large_middle_replacements_split_locally_with_the_single_entry_exception', 'namespace::tests::page_local_tests::deleting_from_sparse_wire_indexes_contracts_promoted_sealed_roots', 'namespace::tests::page_local_tests::a_non_growing_directory_rename_operation_reuses_admitted_path_budgets', 'namespace::tests::page_local_tests::growing_rename_prefixes_still_check_descendants_using_stored_spelling', 'namespace::tests::page_local_tests::deeper_rename_prefixes_preserve_the_descendant_depth_limit']}], 'server': [{'label': 'server-lib', 'package': 'storage-server', 'target': ['--lib'], 'source': 'src/server/src/lib.rs', 'required': ['backend_file_history::tests::file_history_request_is_strict_about_fields_limits_cursors_and_anchors', 'backend_file_history::tests::sub_collection_requests_require_a_root_and_bound_their_limits_and_offsets', 'backend_file_history::tests::unrooted_anchor_is_rejected_and_first_version_page_has_no_fake_root', 'backend_file_history::cursors::tests::every_cursor_kind_round_trips_and_rejects_foreign_or_tampered_cursors', 'backend_file_history::cursors::tests::malformed_cursor_text_is_rejected_as_invalid_cursor', 'backend_file_history::cursors::tests::a_cursor_is_bound_to_the_request_file_before_any_state_lookup', 'backend_file_history::wire::tests::the_largest_legal_node_record_fits_the_minimal_page_and_the_full_page_the_response_cap', 'backend_file_history::wire::tests::byte_budget_truncates_from_the_tail_and_keeps_a_forward_cursor_from_the_last_admitted_record', 'backend_file_history::wire::tests::shell_fields_are_exact_and_context_without_an_entry_omits_content_fields', 'backend_file_history::wire::tests::parent_pages_and_slices_encode_exclusive_cursors_and_next