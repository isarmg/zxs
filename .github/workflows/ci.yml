# Verification-only carrier; no product source or workflow changes.
name: Business batch R136 captured owner test correction
on:
  push:
    branches: [verify/business-smoke-20261030-r136-retry]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: business-smoke-r136
  cancel-in-progress: false
env:
  CARGO_NET_OFFLINE: 'true'
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: '0'
  CARGO_BUILD_JOBS: '2'
  PYTHONDONTWRITEBYTECODE: '1'
  RUST_BACKTRACE: '1'
  ZXS_PRODUCT_SHA: '7d15bba51cbc64ab86461f0345458050d289c180'
  ZXS_PRODUCT_TREE: '06e6abcc3d270edd98f011f626cbf5cccd0a45cb'
  ZXS_PRODUCT_PARENT: '04d1947f40f3a22967b6c1c987ac084c704cea97'
jobs:
  business-smoke:
    name: Exact R136 bounded history authority and ownership
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: '7d15bba51cbc64ab86461f0345458050d289c180'
          persist-credentials: false
          fetch-depth: 2
      - name: Prepare isolated evidence and exact input verifier
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/zxs-r136-business-smoke"
          mkdir -p "$evidence"
          printf 'ZXS_EVIDENCE=%s\n' "$evidence" >> "$GITHUB_ENV"
          printf 'CARGO_HOME=%s\n' "$(mktemp -d "$RUNNER_TEMP/c.XXXXXX")" >> "$GITHUB_ENV"
          printf 'CARGO_TARGET_DIR=%s\n' "$RUNNER_TEMP/zxs-r136-target" >> "$GITHUB_ENV"
          printf 'TMPDIR=%s\n' "$(mktemp -d "$RUNNER_TEMP/t.XXXXXX")" >> "$GITHUB_ENV"
          cat > "$RUNNER_TEMP/r136-identity.py" <<'PY'
          import hashlib, json, os, pathlib, subprocess, sys, tomllib
          root, out = pathlib.Path.cwd(), pathlib.Path(os.environ['ZXS_EVIDENCE'])
          def require(ok, message):
              if not ok: raise RuntimeError(message)
          def git(*args): return subprocess.check_output(['git', *args])
          sha, tree, parent = [os.environ[n] for n in ('ZXS_PRODUCT_SHA','ZXS_PRODUCT_TREE','ZXS_PRODUCT_PARENT')]
          require(os.environ['GITHUB_REF'] == 'refs/heads/verify/business-smoke-20261030-r136-retry', 'wrong verification ref')
          require(git('rev-parse','HEAD').decode().strip() == sha, 'wrong product SHA')
          require(git('rev-parse','HEAD^{tree}').decode().strip() == tree, 'wrong product tree')
          require(git('show','-s','--format=%P','HEAD').decode().strip() == parent, 'wrong sole parent')
          expected_paths = json.loads(r'''["test/server/unit/engine_backend/file_manager/history_pages_tests.rs"]''')
          require(git('diff','--no-renames','--name-only',parent,sha).decode().splitlines() == expected_paths, 'unreviewed changed paths')
          require(tomllib.loads((root/'rust-toolchain.toml').read_text())['toolchain']['channel'] == '1.99.0', 'wrong compiler pin')
          status = git('status','--porcelain=v1','--untracked-files=all').decode()
          (out/(sys.argv[1]+'-status.txt')).write_text(status)
          require(not status, 'source worktree dirty: '+status)
          rows = []
          for item in git('ls-files','-s','-z').split(b'\0'):
              if not item: continue
              meta, raw = item.split(b'\t',1)
              mode, blob, stage = meta.decode().split()
              require(stage == '0', 'unmerged index')
              path = root/os.fsdecode(raw)
              content = os.fsencode(os.readlink(path)) if path.is_symlink() else path.read_bytes()
              rows.append([os.fsdecode(raw),mode,blob,hashlib.sha256(content).hexdigest(),path.lstat().st_mode])
          identity = dict(product_sha=sha,product_tree=tree,product_parent=parent,verification_sha=os.environ['GITHUB_SHA'],run_id=os.environ['GITHUB_RUN_ID'],run_attempt=os.environ['GITHUB_RUN_ATTEMPT'],tracked_files=len(rows),changed=expected_paths)
          if sys.argv[1] == 'before':
              (out/'tracked-inputs.json').write_text(json.dumps(rows)+'\n')
              (out/'input-identity.json').write_text(json.dumps(identity,indent=2)+'\n')
          else:
              require(rows == json.loads((out/'tracked-inputs.json').read_text()), 'tracked source bytes, modes or index changed')
              identity['result']='PASS'
              (out/'source-unchanged.json').write_text(json.dumps(identity,indent=2)+'\n')
          print(json.dumps(identity))
          PY
      - name: Verify frozen product
        run: python3 "$RUNNER_TEMP/r136-identity.py" before
      - name: Install and record pinned compiler
        run: |
          set -euo pipefail
          test -z "$(find "$CARGO_HOME" -mindepth 1 -print -quit)"
          rustup toolchain install 1.99.0 --profile minimal
          rustc +1.99.0 -Vv | tee "$ZXS_EVIDENCE/rustc.txt"
          cargo +1.99.0 -V | tee "$ZXS_EVIDENCE/cargo.txt"
          grep -q '^rustc 1\.99\.0 ' "$ZXS_EVIDENCE/rustc.txt"
          grep -q '^cargo 1\.99\.0 ' "$ZXS_EVIDENCE/cargo.txt"
      - name: Compile once and run exact source-bound business witnesses
        run: |
          python3 - <<'PY'
          import collections, json, os, pathlib, re, runpy, subprocess, sys, time, traceback
          root, out = pathlib.Path.cwd(), pathlib.Path(os.environ['ZXS_EVIDENCE'])
          spec = json.loads(r'''[{"target":"storage_server","source":"src/server/src/lib.rs","kind":"lib","groups":[{"file":"test/server/unit/engine_backend/file_manager/history_pages_tests.rs","names":["remaining_cold_captures_freeze_all_five_pages_and_release_captured_owner_when_consumed"]}]}]''')
          summary = dict(result='RUNNING',commands=[],targets={},tests=[],failures=[],limits=['One renamed R136 failed body only; full default server libtest compile with zero Rust warnings/errors','34 earlier passing bodies remain bound to product 04d1947; not rerun on this test-only correction','Weak Commit lifetime and five byte-equality assertions; no R137, no full-suite or performance claim'])
          def save(): (out/'summary.json').write_text(json.dumps(summary,indent=2)+'\n')
          def require(ok, message):
              if not ok: raise RuntimeError(message)
          def run(label, argv, timeout):
              summary['commands'].append(dict(label=label,argv=argv,timeout=timeout));save()
              print('+ '+' '.join(argv),flush=True)
              with (out/(label+'.log')).open('w') as stdout, (out/(label+'-stderr.log')).open('w') as stderr:
                  done=subprocess.run(argv,stdout=stdout,stderr=stderr,text=True,timeout=timeout)
              print((out/(label+'-stderr.log')).read_text(),end='',flush=True)
              if label not in ('compile','browser-check'): print((out/(label+'.log')).read_text(),end='',flush=True)
              return done.returncode
          try:
              rc=run('compile',['cargo','+1.99.0','test','--locked','--offline','-p','storage-server','--lib','--no-run','--message-format=json'],720)
              diagnostic=runpy.run_path(str(root/'.github/scripts/check-rust-diagnostics.py'))['CargoDiagnostics'](sys.stdout)
              lines=(out/'compile.log').read_text().splitlines()
              for number,line in enumerate(lines,1): diagnostic.consume(line,number)
              require(diagnostic.result(rc)==0,'strict compile failed')
              messages=[json.loads(line) for line in lines]
              artifacts=[m for m in messages if m.get('reason')=='compiler-artifact' and m.get('profile',{}).get('test') and m.get('executable')]
              (out/'compiler-test-artifacts.json').write_text(json.dumps(artifacts,indent=2)+'\n')
              selected=[]
              for target in spec:
                  label=target['target']
                  matches=[m for m in artifacts if m['target']['name']==label and target['kind'] in m['target']['kind'] and pathlib.Path(m['target']['src_path']).resolve()==root/target['source']]
                  require(len(matches)==1,'expected one exact test artifact: '+label)
                  artifact=matches[0];binary=artifact['executable']
                  require(run(label+'-inventory',[binary,'--list','--format','terse'],30)==0,'inventory failed: '+label)
                  require(run(label+'-ignored',[binary,'--list','--ignored','--format','terse'],30)==0,'ignored inventory failed: '+label)
                  def names(suffix): return [l.removesuffix(': test') for l in (out/(label+suffix+'.log')).read_text().splitlines() if l.endswith(': test')]
                  inventory,ignored=names('-inventory'),names('-ignored')
                  require(inventory and len(inventory)==len(set(inventory)),'empty or duplicate inventory: '+label)
                  resolved=[]
                  for group in target['groups']:
                      source=(root/group['file']).read_text()
                      for short in group['names']:
                          require(re.search(r'\bfn '+re.escape(short)+r'\s*\(',source) is not None,'missing source function: '+short)
                          found=[n for n in inventory if n.rsplit('::',1)[-1]==short]
                          require(len(found)==1,'expected one exact discovered body: '+label+'::'+short)
                          name=found[0]
                          require(name not in ignored,'selected body is ignored: '+name)
                          resolved.append(name)
                          selected.append(dict(target=label,binary=binary,name=name,source=group['file']))
                  require(len(resolved)==len(set(resolved)),'duplicate selected names: '+label)
                  summary['targets'][label]=dict(binary=binary,source=target['source'],features=artifact.get('features',[]),inventory=len(inventory),ignored=ignored,selected=resolved)
              require(len(selected)==1,'wrong selected test count')
              (out/'selected-tests.json').write_text(json.dumps(selected,indent=2)+'\n')
              save()
              deadline=time.monotonic()+600
              for index,test in enumerate(selected):
                  require(time.monotonic()<deadline,'ordinary-test budget exhausted')
                  label='case-'+str(index).zfill(3)
                  rc=run(label,[test['binary'],'--exact',test['name'],'--test-threads=1','--color','never'],max(1,min(90,int(deadline-time.monotonic()))))
                  log=(out/(label+'.log')).read_text()
                  passed=[n.removesuffix(' - should panic') for n in re.findall(r'^test (.+) \.\.\. ok$',log,re.M)]
                  totals=re.findall(r'^test result: ok\. (\d+) passed; (\d+) failed; (\d+) ignored; (\d+) measured; (\d+) filtered out;',log,re.M)
                  ok=rc==0 and passed==[test['name']] and len(totals)==1 and totals[0][:4]==('1','0','0','0')
                  record=dict(target=test['target'],name=test['name'],source=test['source'],log=label+'.log',result='PASS' if ok else 'FAIL',returncode=rc)
                  summary['tests'].append(record)
                  if not ok: summary['failures'].append(record)
                  save()
              require(not summary['failures'],'one or more exact ordinary bodies failed')
              require(len(summary['tests'])==1,'incomplete ordinary execution')
              summary['result']='PASS'
          except BaseException:
              summary['result']='FAIL';(out/'failure.txt').write_text(traceback.format_exc());raise
          finally: save()
          PY
      - name: Verify source input remained unchanged
        if: always()
        run: python3 "$RUNNER_TEMP/r136-identity.py" after
      - name: Retain exact smoke evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: business-smoke-r136
          path: ${{ env.ZXS_EVIDENCE }}
          if-no-files-found: error
          retention-days: 7
