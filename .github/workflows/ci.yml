ngine.rs', 'required': ['history_pages::parent_and_branch_http_previous_cursors_round_trip_across_three_pages', 'history_pages::main_page_shape_strictness_and_cursor_navigation', 'history_pages::root_changes_after_a_write_on_the_same_file_and_logout_rejects_continuations', 'history_pages::sub_collections_bind_the_root_and_slice_by_index', 'history_pages::deleted_file_history_remains_readable_without_a_context_entry']}], 'web-contracts': [{'label': 'web-app-lib', 'package': 'web-app', 'target': ['--lib'], 'source': 'src/web/src/lib.rs', 'required': ['files::history::tests::window_decode_keeps_typed_facts_and_rejects_unknown_or_inconsistent_fields', 'files::history::tests::deleted_file_context_has_no_path_or_content_but_nodes_stay_readable', 'files::history::tests::an_empty_first_page_without_continuation_is_the_only_proof_of_no_history', 'files::history::tests::backup_pinning_moves_only_the_current_marker_and_keeps_every_node', 'files::history::tests::branch_page_decode_binds_the_resident_root_and_keeps_the_write_disposition', 'files::history::tests::merge_page_decode_requires_canonical_order_and_consistent_reuse', 'files::history::tests::parents_inputs_and_field_slices_decode_with_exact_continuation_rules', 'files::history::tests::decoding_keeps_the_concrete_error_source', 'files::history::tests::directory_and_file_branch_contracts_are_not_interchangeable', 'files::history::tests::actual_server_branch_fixtures_enter_the_web_model_without_shape_reconstruction', 'files::history::tests::actual_server_window_fixtures_enter_the_web_model_without_shape_reconstruction', 'files::history::state::tests::installing_a_window_replaces_the_previous_page_and_every_derived_slot', 'files::history::state::tests::stale_root_keeps_the_window_readable_but_closes_root_bound_pages', 'files::history::state::tests::clear_and_invalidate_bump_the_generation_and_distinguish_content_from_path_changes', 'files::history::state::tests::a_branch_page_from_another_root_is_never_consulted', 'files::history::state::tests::read_slots_hand_out_tickets_and_aborting_invalidates_the_previous_ticket', 'files::history::state::tests::a_context_change_releases_a_cancelled_branch_load_instead_of_sticking_loading', 'files::actions::history::tests::main_endpoints_carry_context_limit_and_exactly_one_position_parameter', 'files::actions::history::tests::history_reads_require_an_active_session_and_a_selected_file', 'files::actions::history::tests::a_main_response_replaces_the_window_and_late_responses_are_rejected_after_any_fence_change', 'files::actions::history::tests::a_cancelled_read_never_settles_even_if_its_response_races_the_abort', 'files::actions::history::tests::history_changed_marks_the_resident_page_stale_and_closes_write_entries_without_losing_drafts', 'files::actions::history::tests::a_main_continuation_that_lost_its_root_keeps_the_previous_page_as_stale', 'files::actions::history::tests::latest_refresh_never_sends_the_resident_root_even_when_the_selection_did_not_change', 'files::actions::history::tests::failed_main_reads_report_once_and_leave_no_write_basis', 'files::actions::history::tests::open_editors_block_first_previous_next_anchor_and_explicit_refresh', 'files::actions::history::tests::auxiliary_reads_bind_the_resident_root_and_are_fenced_per_slot', 'files::actions::history::tests::branch_failures_consume_automatic_demand_until_retry_or_a_new_window', 'files::actions::history::tests::first_page_navigation_keeps_the_observed_root_but_latest_refresh_discovers_a_new_one', 'files::history_index::tests::indexed_records_borrow_the_resident_window_and_only_its_nodes', 'files::history_index::tests::branch_lookups_come_from_the_resident_branch_page_only', 'files::history_index::tests::shared_index_skips_unrelated_updates_and_replacing_the_window_frees_the_old_page', 'files::history_index::tests::indexed_lookup_matches_a_linear_scan_for_a_large_page', 'files::merge::tests::merge_selection_spans_201_candidates_without_retaining_candidate_pages', 'files::merge::tests::merge_addition_is_refused_atomically_at_the_complete_encoded_request_budget', 'files::tags::tests::tag_branch_choices_reach_the_last_of_201_candidates_and_keep_only_selected_heads', 'files::tags::tests::a_new_draft_cannot_rebase_checked_nodes_captured_under_an_old_root', 'files::tags::tests::checked_nodes_record_their_target_from_the_resident_page_and_survive_paging', 'files::detail::detail_tests::selected_branch_identity_is_explicit_when_the_candidate_page_does_not_contain_it', 'files::version_tree::tests::layout_input_uses_only_in_page_parent_edges_and_never_invents_nodes_for_stubs', 'files::version_tree::tests::outside_window_parents_collapse_to_one_stub_per_node_whose_jump_anchors_the_first_parent']}, {'label': 'contract-check', 'package': 'contract-check', 'target': ['--bin', 'contract-check'], 'source': 'tools/contract-check/src/main.rs', 'required': ['tests::file_history_pages_bound_every_collection_and_keep_true_lineage_reachable', 'tests::checked_in_contracts_and_document_examples_are_consistent', 'tests::openapi_duplicate_operation_ids_and_unbound_paths_are_rejected', 'tests::file_history_graph_distinguishes_path_nodes_from_real_content_versions', 'tests::file_merge_tags_and_scope_backups_require_explicit_reviewed_baselines'], 'exact': ['tests::file_history_pages_bound_every_collection_and_keep_true_lineage_reachable', 'tests::checked_in_contracts_and_document_examples_are_consistent', 'tests::openapi_duplicate_operation_ids_and_unbound_paths_are_rejected', 'tests::file_history_graph_distinguishes_path_nodes_from_real_content_versions', 'tests::file_merge_tags_and_scope_backups_require_explicit_reviewed_baselines']}]}
          SUMMARY = {'suite': os.environ['ZXS_SUITE'], 'product_sha': os.environ['ZXS_PRODUCT_SHA'],
                     'product_tree': os.environ['ZXS_PRODUCT_TREE'], 'result': 'RUNNING', 'targets': [], 'commands': []}


          def require(condition, message):
              if not condition:
                  raise RuntimeError(message)


          def save_summary():
              (OUT / 'summary.json').write_text(json.dumps(SUMMARY, indent=2) + '\n')


          def capture(label, command):
              SUMMARY['commands'].append({'label': label, 'argv': command, 'cwd': str(ROOT)})
              save_summary()
              print('+ ' + ' '.join(command), flush=True)
              with (OUT / (label + '.log')).open('w') as log:
                  result = subprocess.run(command, stdout=log, stderr=subprocess.STDOUT, text=True, cwd=ROOT)
              output = (OUT / (label + '.log')).read_text()
              print(output, end='', flush=True)
              return result.returncode, output


          def build(spec):
              label = spec['label']
              command = ['cargo', '+1.99.0', 'test', '--locked', '--offline', '-p', spec['package'],
                         *spec['target'], '--no-run', '--message-format=json']
              SUMMARY['commands'].append({'label': label + '-compile', 'argv': command, 'cwd': str(ROOT)})
              save_summary()
              print('+ ' + ' '.join(command), flush=True)
              diagnostics_class = runpy.run_path(str(ROOT / '.github/scripts/check-rust-diagnostics.py'))['CargoDiagnostics']
              diagnostics = diagnostics_class(sys.stdout)
              artifacts = []
              with (OUT / (label + '-compile.jsonl')).open('w') as log, (OUT / (label + '-compile-stderr.log')).open('w') as error:
                  with subprocess.Popen(command, stdout=subprocess.PIPE, stderr=error, text=True, encoding='utf-8', cwd=ROOT) as process:
                      for number, line in enumerate(process.stdout, 1):
                          log.write(line)
                          log.flush()
                          diagnostics.consume(line, number)
                          try:
                              event = json.loads(line)
                          except ValueError:
                              continue
                          if (isinstance(event, dict) and event.get('reason') == 'compiler-artifact'
                              and event.get('profile', {}).get('test') is True and event.get('executable')
                              and pathlib.Path(event['target']['src_path']).resolve() == (ROOT / spec['source']).resolve()):
                              artifacts.append(event)
                      status = process.wait()
              print((OUT / (label + '-compile-stderr.log')).read_text(), end='', flush=True)
              require(diagnostics.result(status) == 0, label + ': compilation or zero-warning diagnostic gate failed')
              require(len(artifacts) == 1, label + ': expected exactly one matching compiled libtest executable')
              binary = pathlib.Path(artifacts[0]['executable']).resolve()
              require(binary.is_file(), label + ': executable is absent')
              (OUT / (label + '-artifact.json')).write_text(json.dumps(artifacts[0], indent=2) + '\n')
              return str(binary)


          def listed(label, binary, extra):
              status, output = capture(label, [binary, *extra, '--list', '--format', 'terse', '--color', 'never'])
              require(status == 0, label + ': libtest listing failed')
              names = re.findall(r'^(.+): test$', output, re.M)
              require(len(names) == len(set(names)), label + ': duplicate listed test')
              require(not re.search(r'^.+: benchmark$', output, re.M), label + ': unexpected benchmark target')
              return set(names)


          def execute(spec, binary):
              label = spec['label']
              all_names = listed(label + '-list-all', binary, [])
              ignored = listed(label + '-list-ignored', binary, ['--ignored'])
              require(all_names and ignored <= all_names, label + ': empty or inconsistent compiled inventory')
              required = set(spec['required'])
              require(required and required <= all_names - ignored, label + ': missing/ignored critical witnesses: ' + repr(sorted(required - (all_names - ignored))))
              selected = set(spec.get('exact', all_names - ignored))
