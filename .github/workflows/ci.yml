name: CI

on:
  push:
    branches-ignore: ["verify/capacity-recovery-carrier-20261031"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: '1'
  CARGO_INCREMENTAL: '0'

jobs:
  static:
    name: Static workflow and tooling regressions (no Rust)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check workflows, source governance and script regressions
        run: bash .github/scripts/check.sh static

  tests:
    name: Tests (${{ matrix.suite }})
    needs: static
    runs-on: ubuntu-24.04
    # Cold crypto runs include ten packaged/local-generated ring cases, including
    # both release slow-test matrices; the measured run exceeded 30 minutes.
    # Match the release verification budget without relaxing other shards.
    timeout-minutes: ${{ matrix.suite == 'foundation-crypto' && 60 || 30 }}
    strategy:
      fail-fast: false
      matrix:
        suite: [rust-sources, quality, security, workspace, foundation-platform, foundation-crypto, foundation-data, foundation-language, foundation-async, web, contracts, build-tools, smb-protocol]
    env:
      ZXS_REQUIRE_BROWSER: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Initialize isolated Cargo home
        run: bash .github/scripts/initialize-cargo-home.sh
      - name: Install repository Rust toolchain
        run: |
          rustup show active-toolchain
          rustc --version
          cargo --version
      - name: Install WASM standard library for cross-target checks
        if: matrix.suite == 'quality' || matrix.suite == 'build-tools' || startsWith(matrix.suite, 'foundation-')
        run: rustup target add wasm32-unknown-unknown
      - name: Install Valgrind SDK and loader debug symbols
        if: matrix.suite == 'foundation-crypto'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y valgrind libc6-dbg clang libclang-dev
      - name: Install system SQLite SDK for unbundled validation
        if: matrix.suite == 'foundation-data'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libsqlite3-dev clang libclang-dev pkg-config
      - name: Enable sandboxed Chrome for browser future runtime checks
        if: matrix.suite == 'foundation-language'
        run: bash .github/scripts/prepare-browser-contract.sh
      - name: Cache verified security scanner
        if: matrix.suite == 'security'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            target/security-tools/bin/cargo-audit
            target/security-tools/verified-build.json
          key: security-audit-ubuntu24.04-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', '.github/scripts/install-security-audit.py', '.github/security-tools/cargo-audit.json', '.github/security-tools/cargo-audit-0.22.2.lock') }}
      - name: Run locked test suite
        run: bash .github/scripts/check.sh "${{ matrix.suite }}"
      - name: Retain PKI Valgrind positive and negative evidence
        if: always() && matrix.suite == 'foundation-crypto'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pki-valgrind-evidence
          path: target/pki-valgrind/logs/
          if-no-files-found: error
          retention-days: 7
      - name: Verify isolated system SQLite consumer
        if: matrix.suite == 'foundation-data'
        run: python3 .github/scripts/check-sqlite-system.py
      - name: Retain exact foundation behaviour test evidence
        if: always() && matrix.suite == 'foundation-async'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: foundation-behaviour-evidence
          path: |
            target/foundation-behaviour/logs/
            target/foundation-behaviour/summary.json
          if-no-files-found: warn
          retention-days: 7

  web-production:
    name: Production WASM build
    needs: static
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Initialize isolated Cargo home
        run: bash .github/scripts/initialize-cargo-home.sh
      - name: Install repository Rust toolchain and WASM target
        run: |
          rustup show active-toolchain
          rustup target add wasm32-unknown-unknown
          rustc --version
      - name: Cache locally compiled Rust build helpers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/rust-build-tools
          key: rust-build-tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'compliance/rust-sources.json') }}
          restore-keys: |
            rust-build-tools-${{ runner.os }}-${{ runner.arch }}-
      - name: Build production Web distribution
        run: bash .github/scripts/check.sh web-production
      - name: Retain production assets for checks in this run
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-dist
          path: build/web/
          if-no-files-found: error
          retention-days: 7

      - name: Retain browser template contract fixture
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: csr-template-fixture
          path: target/csr-template-check/output/
          if-no-files-found: error
          retention-days: 7

  browser-smoke:
    name: Extracted release browser smoke (Chrome)
    needs: web-production
    runs-on: ubuntu-24.04
    # Compile one release-profile graph for both product and browser harness.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Initialize isolated Cargo home
        run: bash .github/scripts/initialize-cargo-home.sh
      - name: Install repository Rust toolchain
        run: rustup show active-toolchain
      - name: Fetch production Web assets from this workflow run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-dist
          path: build/web
      - name: Fetch browser template contract fixture from this run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: csr-template-fixture
          path: target/csr-template-check/output
      - name: Verify runner Chrome and ChromeDriver
        run: |
          chrome="$(command -v google-chrome)"
          driver="$(command -v chromedriver)"
          "$chrome" --version
          "$driver" --version
          chrome_major=$("$chrome" --version | grep -oE '[0-9]+' | head -1)
          driver_major=$("$driver" --version | grep -oE '[0-9]+' | head -1)
          test "$chrome_major" = "$driver_major"
          echo "CHROME_BIN=$chrome" >> "$GITHUB_ENV"
          echo "CHROMEDRIVER=$driver" >> "$GITHUB_ENV"
      - name: Install CJK fonts for the Chinese screenshot
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y fonts-noto-cjk
      - name: Build and exercise extracted release packages
        env:
          ZXS_SMOKE_SCREENSHOT: artifacts/web-file-manager.png
          ZXS_VIEWPORT_PREVIEWS: artifacts/viewport-previews
        run: |
          export RELEASE_VERSION="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')"
          python3 .github/scripts/release-native.py
          cargo test --locked --offline --release -p browser-smoke
          bash .github/scripts/release-package.sh
          bash .github/scripts/release-acceptance.sh
          python3 .github/scripts/check-csr-browser.py
          bash .github/scripts/release-assemble.sh
      - name: Retain verified installation candidate (not a published release)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installation-candidate-linux-web
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7
      - name: Retain template browser result and exact input identity
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: csr-template-browser
          path: target/csr-template-check/output/*json
          if-no-files-found: error
          retention-days: 7
      - name: Retain real Web file manager screenshot
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-screenshot
          path: artifacts/web-file-manager.png
          if-no-files-found: error
          retention-days: 7

      - name: Retain responsive Web viewport previews
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: viewport-previews
          path: artifacts/viewport-previews/
          if-no-files-found: warn
          retention-days: 7

  smb-sdk:
    needs: static
    uses: ./.github/workflows/smb-sdk.yml
