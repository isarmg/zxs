name: R136 immutable performance artifact audit only
on:
  push:
    branches: [verify/adoption-performance-r136-audit-20261030]
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Verify exact prior artifacts and print all nonsecret measurements
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, io, json, os, urllib.request, urllib.parse, zipfile
          class ScopedRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  target=super().redirect_request(req,fp,code,msg,headers,newurl)
                  if urllib.parse.urlsplit(req.full_url).netloc != urllib.parse.urlsplit(newurl).netloc:
                      target.remove_header('Authorization')
                  return target
          opener=urllib.request.build_opener(ScopedRedirect())
          artifacts = {
          12953800059: 'aaf34fa6a4846c17b74d28b64a7691c9bb753e47bcf8a6ba01ffadc231aed692',
          12952744124: 'b3fc9baf38916a92d6d297f058bd4add876a50d4bac2154b10a9865b1013540b',
          }
          def api(path):
              req=urllib.request.Request('https://api.github.com/repos/isarmg/zxs/'+path,
                  headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              return opener.open(req,timeout=60)
          run=json.load(api('actions/runs/40999882456'))
          assert run['head_sha']=='01cc620e5cddbb7632fcebacd0a6b5c2db94c1b0'
          assert run['status']=='completed' and run['conclusion']=='success'
          print('SOURCE_RUN', json.dumps({k:run[k] for k in ('id','head_sha','status','conclusion','run_attempt')}))
          for aid,digest in artifacts.items():
              meta=json.load(api('actions/artifacts/'+str(aid)))
              assert meta['workflow_run']['id']==40999882456
              assert meta['workflow_run']['head_sha']==run['head_sha']
              assert meta['size_in_bytes'] < 12*1024*1024
              with api('actions/artifacts/'+str(aid)+'/zip') as resp:
                  raw=resp.read(12*1024*1024+1)
              assert len(raw)<=12*1024*1024 and hashlib.sha256(raw).hexdigest()==digest
              print('ARTIFACT_VERIFIED',aid,len(raw),digest)
              z=zipfile.ZipFile(io.BytesIO(raw))
              if aid==12952744124:
                  m=json.loads(z.read('manifest.json'))
                  print('MANIFEST_SHA256',hashlib.sha256(z.read('manifest.json')).hexdigest())
                  print('IDENTITIES',json.dumps(dict(selected_inputs=m['selected_inputs'],harness=m['harness'],
                      build_host=m['build_host'],products={n:dict(source=v['source'],binary_sha256=v['binary_sha256'])
                      for n,v in m['products'].items()})))
              else:
                  s=json.loads(z.read('r136-smoke.json'))
                  print('SMOKE_STATUS',json.dumps({k:v for k,v in s.items() if k not in ('requested_pairs','size500')}))
                  print('SIZE500',json.dumps(s['size500']))
                  for pair in s['requested_pairs']:
                      print('PAIR',json.dumps({k:v for k,v in pair.items() if k not in ('runs','syscall_counts')}))
                      for runrow in pair['runs']:
                          for phase in runrow['phases']:
                              print('SAMPLE',json.dumps(dict(pair=pair['pair'],traced=pair['traced'],
                                  implementation=runrow['implementation'],phase=phase)))
                      if 'syscall_counts' in pair: print('SYSCALL_COUNTS',json.dumps(pair['syscall_counts']))
          
          PY
