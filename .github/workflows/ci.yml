name: Close original 220 contract and report default capacity failure
on:
  workflow_dispatch:
    inputs:
      validation_sha:
        description: Exact independently reviewed continuation controller commit
        required: true
        type: string
permissions:
  contents: read
  actions: read
defaults:
  run:
    shell: bash
concurrency:
  group: original-220-${{ github.ref }}
  cancel-in-progress: false
env:
  RPC_SOURCE_SHA: ${{ inputs.validation_sha }}
  RPC_REUSE_BUILD: '41166634669'
  RPC_MANIFEST_SHA256: bc2cc8e53b796d8aa6fb2bd9fb493133b15445e5e764aa5cb166d199b8975700
jobs:
  controller:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      plan: ${{ steps.plan.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ inputs.validation_sha }}
      - name: Authenticate source and run low-cost mechanical preflight
        run: |
          python3 -c 'import os,re,subprocess; sha=os.environ["RPC_SOURCE_SHA"]; assert re.fullmatch("[0-9a-f]{40}",sha); assert subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip()==sha'
          git fetch --no-tags --depth=1 origin 70ff4929252b24c6f4b53719940cbec127b77561
          bash .github/scripts/check.sh static
          python3 tools/local-rpc-acceptance/budget_contract.py
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: rpc-build-evidence
          run-id: 41166634669
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/selection
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: rpc-22-0
          run-id: 41168852801
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/selection/rpc-22-0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: rpc-22-1
          run-id: 41168852801
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/selection/rpc-22-1
      - name: Verify immutable prior data and declare this continuation window
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/isarmg/zxs/actions/runs/41166634669 > "$RUNNER_TEMP/selection/reuse-run.json"
          gh api 'repos/isarmg/zxs/actions/runs/41166634669/jobs?per_page=100' > "$RUNNER_TEMP/selection/reuse-jobs.json"
          python3 tools/local-rpc-acceptance/screen.py select-original "$RUNNER_TEMP/selection" "$RUNNER_TEMP/selection/plan.json"
          printf 'sha256=%s\n' "$(sha256sum "$RUNNER_TEMP/selection/plan.json" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: original-220-selection
          path: ${{ runner.temp }}/selection/**
          if-no-files-found: error
          retention-days: 14
  pair:
    needs: controller
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        pair: [0, 1]
    env:
      RPC_PLAN_SHA256: ${{ needs.controller.outputs.plan }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ inputs.validation_sha }}
      - name: Fetch the exact sealed source object
        run: git fetch --no-tags --depth=1 origin 70ff4929252b24c6f4b53719940cbec127b77561
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: original-220-selection
          path: ${{ runner.temp }}/selection
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: rpc-binaries
          run-id: 41166634669
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/rpc-bundle
      - name: Execute only missing original 220 pair
        run: python3 tools/local-rpc-acceptance/screen.py run-original "$RUNNER_TEMP/rpc-bundle" "$RUNNER_TEMP/rpc-results" '${{ matrix.pair }}' "$RUNNER_TEMP/selection/plan.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: rpc-220-original-${{ matrix.pair }}
          path: ${{ runner.temp }}/rpc-results/**
          if-no-files-found: error
          retention-days: 14
  summary:
    if: always()
    needs: [controller, pair]
    env:
      RPC_PLAN_SHA256: ${{ needs.controller.outputs.plan }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ inputs.validation_sha }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: original-220-selection
          path: ${{ runner.temp }}/selection
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: rpc-220-original-*
          path: ${{ runner.temp }}/pairs
      - name: Report original gates and preserve the capacity failure
        run: python3 tools/local-rpc-acceptance/screen.py summary-original "$RUNNER_TEMP/pairs" "$RUNNER_TEMP/selection/plan.json" "$RUNNER_TEMP/summary.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: original-220-summary
          path: ${{ runner.temp }}/summary.json
          if-no-files-found: error
          retention-days: 14
