name: Recovery and staging focused acceptance

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact reviewed candidate commit
        required: true
        type: string
      source_tree:
        description: Exact reviewed candidate tree
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never
  RUST_BACKTRACE: '1'
  CARGO_INCREMENTAL: '0'

jobs:
  focused:
    name: Pinned recovery and staging acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout exact validation carrier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: carrier
          persist-credentials: false
      - name: Checkout exact candidate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
          path: source
          fetch-depth: 0
          persist-credentials: false
      - name: Initialize isolated Cargo home
        working-directory: carrier
        run: bash .github/scripts/initialize-cargo-home.sh
      - name: Check carrier Python syntax
        run: python3 -m py_compile carrier/.github/scripts/recovery-staging-acceptance.py
      - name: Run exact source and counted test inventory
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          SOURCE_TREE: ${{ inputs.source_tree }}
          CARRIER_SHA: ${{ github.sha }}
        run: |
          python3 carrier/.github/scripts/recovery-staging-acceptance.py \
            --source source --source-sha "$SOURCE_SHA" --source-tree "$SOURCE_TREE" \
            --carrier-sha "$CARRIER_SHA" --evidence evidence
      - name: Preserve exact source, inventory and raw execution evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: recovery-staging-acceptance-${{ github.run_id }}
          path: |
            evidence/
            carrier/.github/scripts/recovery-staging-acceptance.py
            carrier/.github/workflows/ci.yml
          if-no-files-found: error
          retention-days: 14
