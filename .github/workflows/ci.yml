# Verification-only carrier; frozen product retains its unchanged normal workflow.
# Freeze reviewed input IDs before publication; this template is NOT an execution result.
# Prepared for R84: 556db8c3a0b1fbe24ecbfdbe63c664bbfb3f07e9
# tree: 64757d33ba3175add9e8299c76379c406c57be3d
# parent: 13b664e9fd41a356ffb7ed982d21e97abb123626
# No source/catalog/golden generation, commits, patches, repository writes or deployment.
# Normal 17-job CI, WASM, real Chrome and foundation/SDK/security remain separate gates.
name: Focused bounded-history R84 native verification

on:
  push:
    branches: [verify/bounded-history-focused-20261029-r84]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bounded-history-r84-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_NET_OFFLINE: 'true'
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: '0'
  CARGO_BUILD_JOBS: '2'
  RUST_BACKTRACE: '1'
  ZXS_PRODUCT_SHA: '39e87c8e56c49ddfb1f8c13ee968d3e481d9349d'
  ZXS_PRODUCT_TREE: '62a906f96eaf70807710ad4ca675c081de8b397c'
  ZXS_PRODUCT_PARENT_SHA: '93cb77f332abe9367ff9b4aec4c85dc904b53016'

jobs:
  focused:
    name: Focused bounded history (${{ matrix.suite }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        suite: [engine, server, web-contracts]
    env:
      ZXS_SUITE: ${{ matrix.suite }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: 39e87c8e56c49ddfb1f8c13ee968d3e481d9349d
          fetch-depth: 2
      - name: Prepare evidence outside the product checkout
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/zxs-history-r84-evidence-$ZXS_SUITE"
          mkdir -p "$evidence"
          test_tmp="$(mktemp -d "$RUNNER_TEMP/t.XXXXXX")"
          printf 'ZXS_EVIDENCE=%s\n' "$evidence" >> "$GITHUB_ENV"
          printf 'TMPDIR=%s\n' "$test_tmp" >> "$GITHUB_ENV"
          printf 'CARGO_TARGET_DIR=%s\n' "$RUNNER_TEMP/zxs-history-r84-target-$ZXS_SUITE" >> "$GITHUB_ENV"
          df -h "$RUNNER_TEMP" "$GITHUB_WORKSPACE" "$test_tmp" | tee "$evidence/filesystem-before.txt"
          cat > "$RUNNER_TEMP/zxs-history-r84-identity.py" <<'IDENTITY'
          import hashlib, json, os, pathlib, subprocess, sys, tomllib
          ROOT = pathlib.Path.cwd()
          OUT = pathlib.Path(os.environ['ZXS_EVIDENCE'])
          OUT.mkdir(parents=True, exist_ok=True)

          def require(condition, message):
              if not condition:
                  raise RuntimeError(message)

          def git(*args):
              return subprocess.check_output(['git', *args])

          def snapshot():
              # Include every tracked file, symlink and mode, not only the protected inputs.
              rows = []
              for item in git('ls-files', '-s', '-z').split(b'\0'):
                  if not item:
                      continue
                  metadata, raw_path = item.split(b'\t', 1)
                  mode, blob, stage = metadata.decode().split()
                  require(stage == '0', 'unmerged index entry')
                  name = os.fsdecode(raw_path)
                  path = ROOT / name
                  data = os.fsencode(os.readlink(path)) if path.is_symlink() else path.read_bytes()
                  rows.append([name, mode, blob, hashlib.sha256(data).hexdigest(), path.lstat().st_mode])
              return rows

          phase = sys.argv[1]
          product, tree, parent = (os.environ[k] for k in
              ('ZXS_PRODUCT_SHA', 'ZXS_PRODUCT_TREE', 'ZXS_PRODUCT_PARENT_SHA'))
          require(os.environ['GITHUB_REF'] == 'refs/heads/verify/bounded-history-focused-20261029-r84', 'wrong verification ref')
          require(git('rev-parse', 'HEAD').decode().strip() == product, 'wrong product SHA')
          require(git('rev-parse', 'HEAD^{tree}').decode().strip() == tree, 'wrong product tree')
          require(git('show', '-s', '--format=%P', 'HEAD').decode().strip() == parent, 'wrong product parent')
          status = git('status', '--porcelain=v1', '--untracked-files=all').decode()
          (OUT / (phase + '-git-status.txt')).write_text(status)
          require(not status, 'product checkout changed: ' + status)
          protected = ['Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', '.cargo/config.toml',
                       'compliance/rust-sources.json', '.github/scripts/check.sh',
                       '.github/scripts/check-foundation-behaviour.py',
                       'test/ci/fixtures/foundation-behaviour-tests.json',
                       'tools/rust-sources/workspaces.json']
          protected += [os.fsdecode(p) for p in git('ls-tree', '-r', '--name-only', '-z', parent,
                                                   '--', '.github/workflows').split(b'\0') if p]
          protected_sha256 = {}
          for name in protected:
              current = (ROOT / name).read_bytes()
              require(current == git('show', parent + ':' + name), 'protected input differs from parent: ' + name)
              protected_sha256[name] = hashlib.sha256(current).hexdigest()
          require(not git('diff', '--name-only', parent, product, '--', '.github/workflows'), 'normal workflow set changed')
          require(not git('diff', '--name-only', parent, product, '--', 'Cargo.toml', ':(glob)**/Cargo.toml'), 'Cargo manifests changed')
          config = tomllib.loads((ROOT / '.cargo/config.toml').read_text())
          require(tomllib.loads((ROOT / 'rust-toolchain.toml').read_text())['toolchain']['channel'] == '1.99.0', 'toolchain is not 1.99.0')
          require(config['net']['offline'] is True and config['source']['crates-io']['replace-with'] == 'unavailable-registry'
                  and config['source']['unavailable-registry']['directory'] == 'compliance/empty-registry', 'offline source policy changed')
          current = snapshot()
          if phase == 'before':
              identity = dict(product_sha=product, product_tree=tree, product_parent=parent,
                              verification_sha=os.environ['GITHUB_SHA'], verification_ref=os.environ['GITHUB_REF'],
                              run_id=os.environ['GITHUB_RUN_ID'], run_attempt=os.environ['GITHUB_RUN_ATTEMPT'],
                              suite=os.environ['ZXS_SUITE'], protected_sha256=protected_sha256,
                              tracked_files=len(current), scope='focused native execution only; not normal 17-job CI, WASM or Chrome',
                              deployment=False, source_generation=False, golden_updates=False)
              (OUT / 'input-identity.json').write_text(json.dumps(identity, indent=2) + '\n')
              (OUT / 'tracked-inputs.json').write_text(json.dumps(current, indent=2) + '\n')
          else:
              require(current == json.loads((OUT / 'tracked-inputs.json').read_text()), 'tracked worktree bytes, mode or index changed')
              (OUT / 'source-unchanged.json').write_text(json.dumps(dict(result='PASS', product_sha=product,
                  product_tree=tree, tracked_files=len(current), protected_sha256=protected_sha256), indent=2) + '\n')
          print(json.dumps(dict(phase=phase, result='PASS', tracked_files=len(current), protected_inputs=len(protected)), indent=2))
          IDENTITY
          cat > "$RUNNER_TEMP/zxs-history-r84-runner.py" <<'RUNNER'
          import hashlib, json, os, pathlib, re, runpy, subprocess, sys, traceback
          ROOT = pathlib.Path.cwd()
          OUT = pathlib.Path(os.environ['ZXS_EVIDENCE'])
