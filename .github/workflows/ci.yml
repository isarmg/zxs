# Verification-only carrier; never merge this workflow override into product ancestry.
name: Paired actual Backend contention R82
on:
  push:
    branches: [verify/backend-contention-20261029-r82]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: backend-contention-${{ github.ref }}
  cancel-in-progress: false
jobs:
  contention:
    name: Backend contention (${{ matrix.files }} files)
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        files: [500, 1500, 3000]
    env:
      CARGO_NET_OFFLINE: 'true'
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
      CARGO_TERM_COLOR: never
      RUST_BACKTRACE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          path: harness
          sparse-checkout: |
            test/server/bench/contention
            test/server/unit/engine_backend
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: e2f33d9882cf7263412d9370b6a703e0b216357d
          path: baseline
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: 13b664e9fd41a356ffb7ed982d21e97abb123626
          path: candidate
      - name: Authenticate exact products and add only private test module wiring
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/contention-evidence"
          printf 'ZXS_CONTENTION_DEADLINE_UNIX=%s\n' "$(( $(date +%s) + 150 * 60 ))" >> "$GITHUB_ENV"
          printf 'CARGO_HOME=%s\n' "$(mktemp -d "$RUNNER_TEMP/contention-cargo.XXXXXX")" >> "$GITHUB_ENV"
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess, tomllib
          root = pathlib.Path.cwd()
          out = pathlib.Path(os.environ['RUNNER_TEMP']) / 'contention-evidence'
          identities = {
              'baseline': ('e2f33d9882cf7263412d9370b6a703e0b216357d', 'bee9d4686088a4af6c659a983c6e711f5f62d272'),
              'candidate': ('13b664e9fd41a356ffb7ed982d21e97abb123626', '861e4820e412fd518212d860a9fa6a3fca111851'),
          }
          fixture_path = 'test/server/unit/engine_backend/contention_measurements.rs'
          source_path = 'src/server/src/engine_backend.rs'
          fixture = (root/'harness'/fixture_path).read_bytes()
          wiring = b'\n#[cfg(test)]\n#[path = "../../../test/server/unit/engine_backend/contention_measurements.rs"]\nmod contention_measurements;\n'
          records = {}
          for name, (sha, tree) in identities.items():
              product = root/name
              def git(*args):
                  return subprocess.check_output(['git','-C',str(product),*args]).decode().strip()
              assert git('rev-parse','HEAD') == sha
              assert git('rev-parse','HEAD^{tree}') == tree
              assert not git('status','--porcelain')
              assert tomllib.loads((product/'rust-toolchain.toml').read_text())['toolchain']['channel'] == '1.99.0'
              original = (product/source_path).read_bytes()
              assert b'mod contention_measurements;' not in original
              assert not (product/fixture_path).exists()
              (product/fixture_path).parent.mkdir(parents=True, exist_ok=True)
              (product/fixture_path).write_bytes(fixture)
              (product/source_path).write_bytes(original + wiring)
              assert git('diff','--name-only').splitlines() == [source_path]
              assert git('ls-files','--others','--exclude-standard').splitlines() == [fixture_path]
              (out/f'{name}-test-wiring.diff').write_text(git('diff')+'\n')
              records[name] = dict(sha=sha, tree=tree,
                  source_before_sha256=hashlib.sha256(original).hexdigest(),
                  source_after_sha256=hashlib.sha256(original+wiring).hexdigest(),
                  fixture_sha256=hashlib.sha256(fixture).hexdigest(),
                  lock_blob=git('rev-parse','HEAD:Cargo.lock'),
                  source_catalog_blob=git('rev-parse','HEAD:compliance/rust-sources.json'),
                  server_manifest_blob=git('rev-parse','HEAD:src/server/Cargo.toml'),
                  engine_manifest_blob=git('rev-parse','HEAD:src/engine/Cargo.toml'))
          records['workflow_sha'] = os.environ['GITHUB_SHA']
          runner = (root/'harness/test/server/bench/contention/run.py').read_bytes()
          records['runner_sha256'] = hashlib.sha256(runner).hexdigest()
          records['configuration'] = 'release server unit-test target, existing dev features and cfg(test) hooks, no injected faults'
          (out/'input-identity.json').write_text(json.dumps(records,indent=2)+'\n')
          (out/'contention_measurements.rs').write_bytes(fixture)
          (out/'run.py').write_bytes(runner)
          PY
          uname -a > "$RUNNER_TEMP/contention-evidence/uname.txt"
          lscpu > "$RUNNER_TEMP/contention-evidence/lscpu.txt"
          free -b > "$RUNNER_TEMP/contention-evidence/memory-before.txt"
          df -B1 > "$RUNNER_TEMP/contention-evidence/disk-before.txt"
      - name: Build isolated release test targets and record actual selected features
        timeout-minutes: 60
        shell: bash
        run: |
          set -euo pipefail
          for product in baseline candidate; do
            (
              cd "$product"
              rustc -Vv > "$RUNNER_TEMP/contention-evidence/$product-rustc.txt"
              cargo --version > "$RUNNER_TEMP/contention-evidence/$product-cargo.txt"
              grep -q '^rustc 1\.99\.0 ' "$RUNNER_TEMP/contention-evidence/$product-rustc.txt"
              grep -q '^cargo 1\.99\.0 ' "$RUNNER_TEMP/contention-evidence/$product-cargo.txt"
              printf '%s\n' 'cargo test --locked --offline --release -p storage-server --lib --no-run --message-format=json -vv' > "$RUNNER_TEMP/contention-evidence/$product-build-command.txt"
              CARGO_TARGET_DIR="$RUNNER_TEMP/contention-target-$product" cargo test --locked --offline --release -p storage-server --lib --no-run --message-format=json -vv > "$RUNNER_TEMP/contention-evidence/$product-build.jsonl" 2> "$RUNNER_TEMP/contention-evidence/$product-build.log"
            )
          done
          python3 - <<'PY'
          import hashlib, json, os, pathlib
          root = pathlib.Path.cwd()
          out = pathlib.Path(os.environ['RUNNER_TEMP'])/'contention-evidence'
          identities = json.loads((out/'input-identity.json').read_text())
          selected = {}
          for name in ('baseline','candidate'):
              # -vv preserves prefixed build-script stdout beside Cargo JSON.
              # Keep the whole raw log; parse only Cargo's JSON object lines.
              rows = [json.loads(line) for line in (out/f'{name}-build.jsonl').read_text().splitlines()
                      if line.startswith('{')]
              finished = [row for row in rows if row['reason'] == 'build-finished']
              assert len(finished) == 1 and finished[0]['success'], 'successful Cargo completion missing'
              artifacts = [row for row in rows if row['reason'] == 'compiler-artifact']
              server = [row for row in artifacts if row['manifest_path'] == str(root/name/'src/server/Cargo.toml')
                        and row['target']['kind'] == ['lib'] and row['profile']['test'] and row['executable'] is not None]
              assert len(server) == 1, 'exactly one real server unit-test binary required'
              engine = [row for row in artifacts if row['manifest_path'] == str(root/name/'src/engine/Cargo.toml')
                        and row['target']['kind'] == ['lib']]
              assert engine, 'engine compiler features missing'
              expected = {'fault-injection'} if name == 'baseline' else {'fault-injection','test-support'}
              assert all(set(row['features']) == expected for row in engine), engine
              assert set(server[0]['features']) == {'core','default'}, server
              binary = pathlib.Path(server[0]['executable'])
              selected[name] = dict(server=server[0], engine=engine, binary_sha256=hashlib.sha256(binary.read_bytes()).hexdigest())
              with open(os.environ['GITHUB_ENV'],'a') as environment:
                  environment.write(f'{name.upper()}_CONTENTION_BIN={binary}\n')
          (out/'actual-targets-and-features.json').write_text(json.dumps(selected,indent=2)+'\n')
          PY
      - name: Run three independent paired contention trials at this scale
        shell: bash
        run: |
          set -euo pipefail
          python3 harness/test/server/bench/contention/run.py \
            --baseline "$BASELINE_CONTENTION_BIN" \
            --candidate "$CANDIDATE_CONTENTION_BIN" \
            --baseline-sha e2f33d9882cf7263412d9370b6a703e0b216357d \
            --candidate-sha 13b664e9fd41a356ffb7ed982d21e97abb123626 \
            --out "$RUNNER_TEMP/contention-evidence/results" \
            --pool-parent "$RUNNER_TEMP/contention-pools" \
            --deadline-unix "$ZXS_CONTENTION_DEADLINE_UNIX" \
            --sizes '${{ matrix.files }}'
      - name: Confirm exact source and authoritative records remain unchanged
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          root = pathlib.Path.cwd()
          out = pathlib.Path(os.environ['RUNNER_TEMP'])/'contention-evidence'
          identities = json.loads((out/'input-identity.json').read_text())
          for name in ('baseline','candidate'):
              product = root/name
              def git(*args):
                  return subprocess.check_output(['git','-C',str(product),*args]).decode().strip()
              assert git('rev-parse','HEAD') == identities[name]['sha']
              assert git('diff','--name-only').splitlines() == ['src/server/src/engine_backend.rs']
              assert git('ls-files','--others','--exclude-standard').splitlines() == ['test/server/unit/engine_backend/contention_measurements.rs']
              assert hashlib.sha256((product/'src/server/src/engine_backend.rs').read_bytes()).hexdigest() == identities[name]['source_after_sha256']
              assert hashlib.sha256((product/'test/server/unit/engine_backend/contention_measurements.rs').read_bytes()).hexdigest() == identities[name]['fixture_sha256']
          (out/'source-unchanged.txt').write_text('Only exact reviewed cfg(test) module wiring and standalone test fixture differ.\n')
          PY
      - name: Upload available raw evidence including failures and incomplete runs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: backend-contention-${{ matrix.files }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/contention-evidence/
          if-no-files-found: error
          retention-days: 14
