              save_summary()
              # Full native targets: ordinary libtest defaults, never --ignored or --include-ignored.
              # Exact contract targets: independently list and execute that exact same name.
              batches = [[name] for name in spec['exact']] if 'exact' in spec else [None]
              passed_total = set()
              for index, exact in enumerate(batches):
                  run_label = label + ('-exact-' + str(index + 1) if exact else '-all')
                  extra = ['--exact', exact[0]] if exact else []
                  planned = listed(run_label + '-list-selected', binary, extra)
                  expected = set(exact) if exact else all_names - ignored
                  expected_ignored = set() if exact else ignored
                  require(planned == expected | expected_ignored and expected, run_label + ': compiled listing differs from plan')
                  status, output = capture(run_label + '-execution', [binary, *extra, '--format', 'pretty', '--color', 'never', '--test-threads=2'])
                  outcomes = re.findall(r'^test (.+?)(?: - should panic)? \.\.\. (ok|FAILED|ignored)(?:, [^\n]*)?$', output, re.M)
                  require(len(outcomes) == len({name for name, _ in outcomes}), run_label + ': duplicate execution outcome')
                  passed = {name for name, outcome in outcomes if outcome == 'ok'}
                  skipped = {name for name, outcome in outcomes if outcome == 'ignored'}
                  failed = {name for name, outcome in outcomes if outcome == 'FAILED'}
                  summaries = re.findall(r'^test result: (\w+)\. (\d+) passed; (\d+) failed; (\d+) ignored; (\d+) measured; (\d+) filtered out;', output, re.M)
                  result = {'label': run_label, 'returncode': status, 'planned_names': sorted(expected),
                            'passed_names': sorted(passed), 'ignored_names': sorted(skipped), 'failed_names': sorted(failed),
                            'summary': summaries, 'listed_count': len(planned), 'executed_count': len(passed)}
                  record['runs'].append(result)
                  save_summary()
                  require(status == 0 and not failed and passed == expected and skipped == expected_ignored,
                          run_label + ': listed/selected/executed mismatch or nonzero exit')
                  require(len(summaries) == 1, run_label + ': expected one final libtest summary')
                  kind, count, failures, skips, measured, filtered = summaries[0]
                  require(kind == 'ok' and int(count) == len(expected) and int(count) > 0 and int(failures) == 0
                          and int(skips) == len(expected_ignored) and int(measured) == 0
                          and int(filtered) == len(all_names - planned), run_label + ': invalid/zero-test summary')
                  passed_total |= passed
              require(passed_total == selected and required <= passed_total, label + ': a critical test body did not pass')
              record.update(result='PASS', executed_count=len(passed_total), critical_witness_count=len(required))
              save_summary()


          try:
              for spec in SPECS[os.environ['ZXS_SUITE']]:
                  execute(spec, build(spec))
              if os.environ['ZXS_SUITE'] == 'web-contracts':
                  # Read-only checker: it does not generate schemas, fixtures or source catalogs.
                  command = ['cargo', '+1.99.0', 'run', '--locked', '--offline', '-p', 'contract-check', '--', '--root', '.']
                  SUMMARY['commands'].append({'label': 'contract-bundle-check', 'argv': command, 'cwd': str(ROOT)})
                  save_summary()
                  with (OUT / 'contract-bundle-report.json').open('w') as output, (OUT / 'contract-bundle-stderr.log').open('w') as error:
                      result = subprocess.run(command, stdout=output, stderr=error, text=True, cwd=ROOT)
                  print((OUT / 'contract-bundle-stderr.log').read_text(), end='', flush=True)
                  print((OUT / 'contract-bundle-report.json').read_text(), end='', flush=True)
                  require(result.returncode == 0, 'contract-check --root failed')
                  report = json.loads((OUT / 'contract-bundle-report.json').read_text())
                  require(report['result'] == 'PASS' and report['schema_files'] > 0 and report['openapi_paths'] > 0
                          and report['schema_and_semantic_vectors'] > 0 and report['local_links_checked'] > 0,
                          'contract bundle report has empty/failed evidence')
                  SUMMARY['contract_bundle_report'] = report
              SUMMARY['result'] = 'PASS'
          except BaseException:
              SUMMARY['result'] = 'FAIL'
              (OUT / 'failure.txt').write_text(traceback.format_exc())
              raise
          finally:
              save_summary()
          RUNNER
      - name: Authenticate frozen product and preserved normal validation inputs
        run: python3 "$RUNNER_TEMP/zxs-history-r84-identity.py" before
      - name: Initialize isolated empty Cargo home
        run: bash .github/scripts/initialize-cargo-home.sh
      - name: Verify pinned Rust 1.99.0 toolchain and isolated Cargo home
        shell: bash
        run: |
          set -euo pipefail
          test -d "$CARGO_HOME"
          test -z "$(find "$CARGO_HOME" -mindepth 1 -print -quit)"
          rustup show active-toolchain | tee "$ZXS_EVIDENCE/active-toolchain.txt"
          rustc +1.99.0 --version | tee "$ZXS_EVIDENCE/rustc.txt"
          cargo +1.99.0 --version | tee "$ZXS_EVIDENCE/cargo.txt"
          grep -q '^rustc 1\.99\.0 ' "$ZXS_EVIDENCE/rustc.txt"
          grep -q '^cargo 1\.99\.0 ' "$ZXS_EVIDENCE/cargo.txt"
          printf 'CARGO_HOME=%s\nCARGO_TARGET_DIR=%s\nTMPDIR=%s\n' "$CARGO_HOME" "$CARGO_TARGET_DIR" "$TMPDIR" > "$ZXS_EVIDENCE/build-paths.txt"
      - name: Compile real targets and execute list-equal nonzero test bodies
        run: python3 "$RUNNER_TEMP/zxs-history-r84-runner.py"
      - name: Prove the product worktree is unchanged after execution
        if: always()
        run: python3 "$RUNNER_TEMP/zxs-history-r84-identity.py" after
      - name: Retain identity, exact test inventories, counts, outcomes and logs only
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bounded-history-r84-${{ matrix.suite }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/zxs-history-r84-evidence-${{ matrix.suite }}/
          if-no-files-found: error
          retention-days: 7
