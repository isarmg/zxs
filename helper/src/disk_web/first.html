<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ZXS 本机首次安装</title>
<link rel="stylesheet" href="/panel.css">
<script defer src="/panel.js"></script>
<main>
  <h1>ZXS 本机首次安装</h1>
  <p>预览终端已选范围，再把当前步骤交回本机终端确认。网页不选盘、不收口令、不写盘、不启动服务。</p>
  <ol id="install-steps" aria-label="首次安装步骤">
    <li id="review-step">核对本次范围</li>
    <li id="init-step">把目录设置交回终端</li>
    <li id="account-step">在终端输入账户密码</li>
    <li>查看终端的实际结果</li>
  </ol>
  <form id="pair-form">
    <label for="code">终端显示的一次性配对码</label>
    <input id="code" type="password" pattern="[0-9a-f]{64}" maxlength="64" autocomplete="off" required>
    <button>配对</button>
  </form>
  <section id="scoped" hidden>
    <p id="plan"></p>
    <details id="unit-preview" hidden>
      <summary>可选：查看只读 systemd 单元预览</summary>
      <p>仅供审阅，不安装、不启用、不启动服务。</p>
      <pre id="unit-preview-text"></pre>
    </details>
    <button id="preview" type="button">重新预览</button>
    <button id="continue" type="button" disabled>请求在原终端确认</button>
    <button id="cancel" type="button">取消并关闭</button>
  </section>
  <p id="status" role="status"></p>
</main>
</html>
