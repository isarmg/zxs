<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ext 镜像工作副本</title>
<link rel="stylesheet" href="/panel.css">
<script defer src="/panel.js"></script>
<main data-purpose="ext-repair">
  <h1>ext 镜像工作副本</h1>
  <p>这里仅预览终端已选的 ext 镜像工作副本请求。请回原终端决定；网页不能选择路径、运行工具、写入工作副本或修改原磁盘。</p>
  <form id="pair-form">
    <label for="code">终端显示的一次性配对码</label>
    <input id="code" type="password" pattern="[0-9a-f]{64}" maxlength="64" autocomplete="off" required>
    <button>配对</button>
  </form>
  <section id="scoped" hidden>
    <p id="plan"></p>
    <button id="continue" type="button">请求在原终端确认</button>
    <button id="cancel" type="button">取消并关闭</button>
  </section>
  <p id="status" role="status"></p>
</main>
</html>
