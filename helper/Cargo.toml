[package]
name = "local-ops-helper"
version = "1.0.0"
edition = "2024"
rust-version = "1.100"
license = "Apache-2.0"
description = "Local storage diagnostics and explicitly authorized offline pool installation"
publish = false

[workspace]
resolver = "3"
members = ["linux-evidence"]

[[bin]]
name = "helper"
path = "src/main.rs"

[features]
private-fresh-install = []
embedded-zxs = ["private-fresh-install"]

[dependencies]
argon2 = { version = "=0.5.3", default-features = false, features = ["zeroize"] }
subtle = { version = "=2.6.1", default-features = false }
zeroize = { version = "=1.9.1", default-features = false, features = ["alloc"] }
rusqlite = { version = "=0.43.0", default-features = false, features = ["bundled", "limits"] }
httparse = "=1.10.1"
helper-linux-evidence = { path = "linux-evidence" }
rustix = { version = "=1.1.5", features = ["event", "fs", "mm", "net", "pipe", "process", "rand", "termios", "thread"] }
sha2 = { version = "=0.10.9", default-features = false }

linux-raw-sys = { version = "=0.12.1", default-features = false, features = ["general", "std"] }

[dev-dependencies]
rustix = { version = "=1.1.5", features = ["pty", "stdio"] }
tempfile = "=3.27.0"

[lints.rust]
unsafe_code = "forbid"
