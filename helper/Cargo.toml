[package]
name = "local-ops-helper"
version = "1.0.0"
edition = "2024"
rust-version = "1.100"
license = "Apache-2.0"
description = "Read-only diagnostics for explicitly selected local directories and files"
publish = false

[workspace]
resolver = "3"
members = ["linux-evidence"]

[[bin]]
name = "helper"
path = "src/main.rs"

[dependencies]
httparse = "=1.10.1"
helper-linux-evidence = { path = "linux-evidence" }
rustix = { version = "=1.1.5", features = ["fs", "pipe", "process", "rand", "termios", "thread"] }
sha2 = { version = "=0.10.9", default-features = false }

[dev-dependencies]
linux-raw-sys = { version = "=0.12.1", default-features = false, features = ["general", "std"] }
tempfile = "=3.27.0"

[lints.rust]
unsafe_code = "forbid"
