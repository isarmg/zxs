[package]
name = "local-ops-helper"
version = "1.0.0"
edition = "2024"
rust-version = "1.100"
license = "Apache-2.0"
description = "Read-only diagnostics for explicitly selected local directories and files"
publish = false

[workspace]
resolver = "3"

[[bin]]
name = "helper"
path = "src/main.rs"

[dependencies]
linux-raw-sys = { version = "=0.12.1", default-features = false, features = ["general", "std"] }
rustix = { version = "=1.1.5", features = ["fs"] }

[dev-dependencies]
tempfile = "=3.27.0"

[lints.rust]
unsafe_code = "forbid"
