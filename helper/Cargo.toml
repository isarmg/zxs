[package]
name = "storage-helper"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "zxs-helper"
path = "src/main.rs"

[dependencies]
tracing = { version = "0.1", default-features = false, features = ["fmt"], path = "../src/foundation/diagnostics/tracing" }
authentication.workspace = true
platform-io.workspace = true
rustix.workspace = true
command-line.workspace = true
data-serialization.workspace = true
json-codec.workspace = true
storage-engine.workspace = true
tokio.workspace = true
sha2 = { version = "0.11.0", path = "../src/foundation/cryptography/sha2" }
http-routing = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio"], path = "../src/foundation/networking/http-routing" }

[build-dependencies]
sha2 = { version = "0.11.0", path = "../src/foundation/cryptography/sha2" }

[dev-dependencies]
service-stack = { version = "0.5", features = ["util"], path = "../src/foundation/networking/service-stack" }
storage-server.workspace = true
tempfile.workspace = true

[[test]]
name = "helper_startup"
path = "../test/helper/startup.rs"

[[test]]
name = "independent_authority"
path = "../test/helper/independent_authority.rs"
