[package]
name = "helper-linux-evidence"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "Apache-2.0"
description = "Bounded Linux filesystem identity reads on an already-held local object"
publish = false

[dependencies]
rusqlite = { version = "=0.43.0", default-features = false, features = ["bundled"] }
zeroize = { version = "=1.9.1", default-features = false }
libsqlite3-sys = { version = "=0.40.0", features = ["bundled"] }
libc = "=0.2.190"
linux-raw-sys = { version = "=0.12.1", default-features = false, features = ["std", "general"] }
rustix = { version = "=1.1.5", features = ["fs", "pipe", "process"] }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
