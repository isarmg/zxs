# Sole configuration for a dedicated Debian 13 nginx, not a sites-enabled snippet.
# No includes, static files, client supplied identity, public listener or rewrites.
daemon off;
worker_processes 1;
pid /run/zxs-management-https/nginx.pid;
error_log /dev/null crit;
events { worker_connections 96; }

http {
    access_log off;
    server_tokens off;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache off;
    ssl_session_tickets off;
    ssl_early_data off;
    ignore_invalid_headers on;
    underscores_in_headers off;
    keepalive_timeout 0;
    client_header_timeout 5s;
    client_body_timeout 5s;
    send_timeout 5s;
    large_client_header_buffers 2 4k;
    client_max_body_size 4096;
    client_body_buffer_size 16k;
    client_body_in_single_buffer on;
    client_body_in_file_only off;
    client_body_temp_path /run/zxs-management-https/body;
    proxy_temp_path /run/zxs-management-https/proxy;
    fastcgi_temp_path /run/zxs-management-https/fastcgi;
    uwsgi_temp_path /run/zxs-management-https/uwsgi;
    scgi_temp_path /run/zxs-management-https/scgi;

    # A fixed raw browser Origin, or no Origin on GET. Repeated Origin lines
    # are joined with a comma by this nginx; they cannot match this regexp.
    map "$request_method:$http_origin" $origin_ok {
        default 0;
        ~^GET:$ 1;
        ~^(GET|POST):https://zxs-admin\.test:8443$ 1;
    }

    # We do not need chunking, trailers, method overrides or arbitrary URLs.
    # nginx already rejects duplicated Host/Content-Length and TE+CL.
    map "$request_method:$content_length" $length_ok {
        default 0;
        "GET:" 1;
        "GET:0" 1;
        ~^POST:[1-9][0-9]?[0-9]?[0-9]?$ 1;
    }
    map "$request_method:$request_uri" $route_ok {
        default 0;
        ~^GET:/(login|management\.css)?$ 1;
        "~^GET:/\?after=[0-9a-f]{32}$" 1;
        ~^POST:/(login|logout|shares/publish|shares/mode)$ 1;
    }
    limit_conn_zone $server_name zone=zxs_local:1m;

    server {
        listen 127.0.0.1:8443 ssl default_server;
        server_name _;
        ssl_reject_handshake on;
        return 421;
    }
    server {
        listen 127.0.0.1:8443 ssl;
        server_name zxs-admin.test;
        ssl_certificate /etc/zxs-management-tls/chain.pem;
        ssl_certificate_key /etc/zxs-management-tls/key.pem;

        if ($ssl_server_name != zxs-admin.test) { return 421; }
        if ($http_host != zxs-admin.test:8443) { return 421; }
        if ($http_transfer_encoding != "") { return 400; }
        if ($http_trailer != "") { return 400; }
        if ($request !~ "^(GET|POST) /[^ ]* HTTP/1[.]1$") { return 400; }
        if ($origin_ok = 0) { return 403; }
        if ($length_ok = 0) { return 400; }
        if ($route_ok = 0) { return 404; }

        location / {
            limit_conn zxs_local 16;
            scgi_pass_request_headers off;
            scgi_pass_request_body on;
            scgi_request_buffering on;
            scgi_buffering off;
            scgi_cache off;
            scgi_store off;
            scgi_max_temp_file_size 0;
            scgi_ignore_headers X-Accel-Redirect X-Accel-Buffering;
            scgi_next_upstream off;
            scgi_connect_timeout 2s;
            scgi_send_timeout 5s;
            scgi_read_timeout 10s;
            # CONTENT_LENGTH is emitted FIRST by nginx's SCGI encoder itself.
            scgi_param SCGI 1;
            scgi_param REQUEST_METHOD $request_method;
            scgi_param REQUEST_URI $request_uri;
            scgi_param HTTPS $https;
            scgi_param HTTP_HOST $http_host;
            scgi_param HTTP_ORIGIN $http_origin;
            scgi_param HTTP_COOKIE $http_cookie;
            scgi_param CONTENT_TYPE $http_content_type;
            scgi_pass unix:/run/zxs-management.sock;
        }
    }
}
