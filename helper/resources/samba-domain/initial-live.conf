[global]
    server role = standalone server
    security = user
    netbios name = ZXSLOCAL
    workgroup = ZXSWORK
    netbios aliases =
    disable netbios = yes
    interfaces = 127.0.0.1
    bind interfaces only = yes
    multicast dns register = no
    smb ports = 445
    server min protocol = SMB2_02
    server signing = mandatory
    server multi channel support = no
    clustering = no
    config backend = file
    registry shares = no
    private dir = /instance/private
    state directory = /instance/state
    cache directory = /instance/cache
    lock directory = /instance/lock
    pid directory = /instance/run
    passdb backend = tdbsam:/instance/accountdb/passdb.tdb
    kerberos method = secrets only
    ntlm auth = ntlmv2-only
    allow trusted domains = no
    null passwords = no
    map to guest = Never
    restrict anonymous = 2
    nt pipe support = no
    host msdfs = no
    usershare path =
    usershare max shares = 0
    usershare allow guests = no
    load printers = no
    disable spoolss = yes
    enable asu support = no
    default service =
    auto services =
    username map =
    username map script =
    guest ok = no
    guest only = no
    printable = no
    wide links = no
    force user =
    force group =
    admin users =
    preexec =
    postexec =
    root preexec =
    root postexec =
