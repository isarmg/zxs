[global]
    server role = standalone server
    security = user
    netbios name = ZXSLOCAL
    workgroup = ZXSWORK
    config backend = file
    private dir = /instance/private
    state directory = /instance/state
    cache directory = /instance/cache
    lock directory = /instance/lock
    pid directory = /instance/run
    passdb backend = zxs_sqlite
    map to guest = Never
    restrict anonymous = 2
    usershare max shares = 0
    usershare allow guests = no
    load printers = no
    clustering = no
