[package]
name = "zxs-browser"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "Apache-2.0"
publish = false

[workspace]
resolver = "3"

[lib]
crate-type = ["cdylib"]

[dependencies]
js-sys = { version = "=0.3.106", default-features = false }
wasm-bindgen = { version = "=0.2.129", default-features = false }
web-sys = { version = "=0.3.106", default-features = false, features = [
    "Document", "Element", "Event", "Headers", "HtmlElement",
    "Location", "NodeList", "Request", "RequestCache", "RequestCredentials",
    "RequestInit", "RequestMode", "RequestRedirect", "Response", "Window",
] }

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
panic = "abort"
strip = "debuginfo"
