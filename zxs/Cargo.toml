[package]
name = "storage-server"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "Apache-2.0"
description = "Single-resident FILE container storage"
build = "build.rs"

[[bin]]
name = "zxs"
path = "src/main.rs"

# This project builds alone, including after removal of its enclosing checkout.
[workspace]
resolver = "3"
# Vendored upstream libraries are dependencies, not ZXS workspace/test members.
exclude = [
    "vendor/rust/hybrid-array-0.4.15",
    "vendor/rust/libc-0.2.191",
    "vendor/rust/typenum-1.20.1",
    "vendor/rust/zeroize-1.9.2",
]

# Native storage libraries are not part of the browser module.
[target.'cfg(target_os = "linux")'.dependencies]
hybrid-array = { version = "=0.4.15", path = "vendor/rust/hybrid-array-0.4.15", features = ["zeroize"] }
libc = { version = "=0.2.191", path = "vendor/rust/libc-0.2.191", default-features = false }
zeroize = { version = "=1.9.2", path = "vendor/rust/zeroize-1.9.2", default-features = false }

[profile.browser]
inherits = "release"
lto = true
codegen-units = 1
opt-level = "s"
panic = "abort"
strip = "debuginfo"

[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = [
    'cfg(aes_backend, values("soft"))',
    'cfg(aes_backend_soft, values("compact"))',
    'cfg(cpubits, values("16", "32", "64"))',
    'cfg(md5_backend, values("soft"))',
    'cfg(sha2_backend, values("soft", "riscv-zknh"))',
    'cfg(sha2_256_backend, values("aarch64-sha2", "soft", "riscv-zknh", "x86-sha"))',
    'cfg(sha2_512_backend, values("aarch64-sha3", "soft", "riscv-zknh", "x86-avx2"))',
    'cfg(sha2_backend_soft, values("compact"))',
    'cfg(sha2_backend_riscv_zknh, values("compact"))',
]
