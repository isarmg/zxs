[package]
name = "storage-server"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "Apache-2.0"
description = "Single-resident FILE container storage"
build = "build.rs"

[[bin]]
name = "zxs"
path = "src/main.rs"

[features]
host-activation = []

[[bin]]
name = "activate-headless"
path = "src/activate_headless.rs"
required-features = ["host-activation"]

# This project builds alone, including after removal of its enclosing checkout.
[workspace]
resolver = "3"
