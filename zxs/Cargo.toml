[package]
name = "zxs"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "Apache-2.0"
description = "Single-resident FILE container storage"
build = "build.rs"

# This project builds alone, including after removal of its enclosing checkout.
[workspace]
resolver = "3"
# Vendored upstream libraries are dependencies, not ZXS workspace/test members.
exclude = [
    "vendor/rust/aes-0.9.4",
    "vendor/rust/block-buffer-0.12.1",
    "vendor/rust/cfg-if-1.0.5",
    "vendor/rust/cipher-0.5.2",
    "vendor/rust/cmov-0.5.4",
    "vendor/rust/cpubits-0.1.1",
    "vendor/rust/cpufeatures-0.3.1",
    "vendor/rust/crypto-common-0.2.2",
    "vendor/rust/ctutils-0.4.8",
    "vendor/rust/digest-0.11.3",
    "vendor/rust/hybrid-array-0.4.15",
    "vendor/rust/inout-0.2.6",
    "vendor/rust/libc-0.2.191",
    "vendor/rust/md-5-0.11.0",
    "vendor/rust/sha2-0.11.1",
    "vendor/rust/typenum-1.20.1",
    "vendor/rust/zeroize-1.9.2",
]

[dependencies]
aes = { version = "=0.9.4", path = "vendor/rust/aes-0.9.4", default-features = false, features = ["zeroize"] }
# The private NTLM key-exchange module keeps the former RC4 package's features.
cipher = { version = "=0.5.2", path = "vendor/rust/cipher-0.5.2", default-features = false, features = ["stream-wrapper", "zeroize"] }
# Internal SMB HMAC and CMAC use the existing RustCrypto buffer and MAC traits.
digest = { version = "=0.11.3", path = "vendor/rust/digest-0.11.3", default-features = false, features = ["block-api", "mac", "zeroize"] }
libc = { version = "=0.2.191", path = "vendor/rust/libc-0.2.191", default-features = false }
md-5 = { version = "=0.11.0", path = "vendor/rust/md-5-0.11.0", default-features = false, features = ["zeroize"] }
sha2 = { version = "=0.11.1", path = "vendor/rust/sha2-0.11.1", default-features = false, features = ["zeroize"] }
zeroize = { version = "=1.9.2", path = "vendor/rust/zeroize-1.9.2", default-features = false }
