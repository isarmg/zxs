<label class="zxs-auth-label" for="zxs-login">
  <svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true" focusable="false"><circle cx="12" cy="8" r="4"/><path d="M5 21v-3a7 7 0 0 1 14 0v3"/></svg>
  账户名
</label>
<div class="zxs-auth-input-row zxs-hover-row">
  <input class="zxs-input" id="zxs-login" name="login" required maxlength="64" autocomplete="username" autocapitalize="none" spellcheck="false">
</div>
<label class="zxs-auth-label" for="zxs-password">
  <svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true" focusable="false"><rect x="5" y="11" width="14" height="10" rx="1"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
  密码
</label>
<div class="zxs-auth-input-row zxs-hover-row">
  <input class="zxs-input" id="zxs-password" type="password" name="password" required maxlength="1024" autocomplete="current-password">
</div>
