# ZXS build manifest for locally maintained source.

[package]
edition = "2024"
rust-version = "1.85"
name = "cpubits"
version = "0.1.1"
authors = ["RustCrypto Developers"]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = """
Compile-time detection heuristics for the optimal word size to use for the
target CPU, which in some cases may differ from its address size a.k.a.
`target_pointer_width`. Implemented as `macro_rules!`
"""
documentation = "https://docs.rs/cpubits"
readme = "README.md"
categories = []
license = "MIT OR Apache-2.0"
repository = "https://github.com/RustCrypto/utils"

[lib]
name = "cpubits"
path = "src/lib.rs"

[lints.rust.unexpected_cfgs]
level = "warn"
priority = 0
check-cfg = ['cfg(cpubits, values("16", "32", "64"))']
