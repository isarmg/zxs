# ZXS build manifest for locally maintained source.

[package]
edition = "2024"
rust-version = "1.85"
name = "cipher"
version = "0.5.2"
authors = ["RustCrypto Developers"]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Traits for describing block ciphers and stream ciphers"
documentation = "https://docs.rs/cipher"
readme = "README.md"
keywords = [
    "crypto",
    "block-cipher",
    "stream-cipher",
    "trait",
]
categories = [
    "cryptography",
    "no-std",
]
license = "MIT OR Apache-2.0"
repository = "https://github.com/RustCrypto/traits"

[package.metadata.docs.rs]
all-features = true

[features]
alloc = []
block-padding = ["inout/block-padding"]
dev = ["blobby"]
getrandom = ["common/getrandom"]
rand_core = ["common/rand_core"]
stream-wrapper = ["block-buffer"]
zeroize = [
    "dep:zeroize",
    "common/zeroize",
    "block-buffer?/zeroize",
]

[lib]
name = "cipher"
path = "src/lib.rs"

[dependencies.blobby]
version = "0.4"
optional = true

[dependencies.block-buffer]
path = "../block-buffer-0.12.1"
version = "0.12"
optional = true

[dependencies.common]
path = "../crypto-common-0.2.2"
version = "0.2.2"
package = "crypto-common"

[dependencies.inout]
path = "../inout-0.2.6"
version = "0.2.2"

[dependencies.zeroize]
path = "../zeroize-1.9.2"
version = "1.8"
optional = true
default-features = false

[dev-dependencies.hex-literal]
version = "1"

[lints.clippy]
borrow_as_ptr = "warn"
cast_lossless = "warn"
cast_possible_truncation = "warn"
cast_possible_wrap = "warn"
cast_precision_loss = "warn"
cast_sign_loss = "warn"
checked_conversions = "warn"
from_iter_instead_of_collect = "warn"
implicit_saturating_sub = "warn"
manual_assert = "warn"
map_unwrap_or = "warn"
missing_errors_doc = "warn"
missing_panics_doc = "warn"
mod_module_files = "warn"
must_use_candidate = "warn"
needless_range_loop = "allow"
ptr_as_ptr = "warn"
redundant_closure_for_method_calls = "warn"
ref_as_ptr = "warn"
return_self_not_must_use = "warn"
semicolon_if_nothing_returned = "warn"
std_instead_of_alloc = "warn"
std_instead_of_core = "warn"
trivially_copy_pass_by_ref = "warn"
undocumented_unsafe_blocks = "warn"
unnecessary_safety_comment = "warn"
unwrap_in_result = "warn"
unwrap_used = "warn"

[lints.rust]
missing_copy_implementations = "warn"
missing_debug_implementations = "warn"
missing_docs = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"
unused_lifetimes = "warn"
unused_qualifications = "warn"
