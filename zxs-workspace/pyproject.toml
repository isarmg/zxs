[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zip-workspace"
version = "0.1.0.dev0"
description = "Local working directories and explicit, portable whole-directory ZIP commits"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
desktop = ["PySide6-Essentials>=6.8,<7"]
mount = ["pyfuse3>=3.5,<4; sys_platform == 'linux'", "trio>=0.22,<1; sys_platform == 'linux'"]

[project.gui-scripts]
zip-workspace-desktop = "zipworkspace.desktop:main"

[project.scripts]
zip-workspace = "zipworkspace.cli:main"
zip-workspace-mount-ro = "zipworkspace.linux_mount:main"

[tool.setuptools]
packages = ["zipworkspace", "zipworkspace.desktop"]
