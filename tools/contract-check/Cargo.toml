[package]
name = "contract-check"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[features]
# Register the optional resolver already exercised by check-schema-validation.py.
# This is not enabled by the production/default contract-check executable.
schema-async = ["schema-validation/resolve-async"]


[dependencies]
blake3 = {version = "1.8.7", path = "../../src/foundation/cryptography/blake3"}
schema-validation = { version = "=0.58.6", default-features = false, features = ["validator"], path = "../../src/foundation/data-storage/schema-validation"}
url-encoding = { path = "../../src/foundation/networking/url-encoding", features = ["std"] }
regex = {version = "1", path = "../../src/foundation/text-unicode/regex"}
data-serialization = { version = "1", features = ["derive"], path = "../../src/foundation/data-storage/data-serialization"}
json-codec = {version = "1", path = "../../src/foundation/data-storage/json-codec"}
toml = {version = "0.8.23", path = "../../src/foundation/data-storage/toml"}
storage-contract.workspace = true

[[test]]
name = "gitignore"
path = "../../test/tools/contract-check/gitignore.rs"

[[test]]
name = "source_export"
path = "../../test/tools/contract-check/source_export.rs"

[[test]]
name = "document_scan"
path = "../../test/tools/contract-check/document_scan.rs"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(walker_oracle)'] }

[dev-dependencies]
tempfile.workspace = true
