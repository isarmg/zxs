[package]
name = "browser-smoke"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[[bin]]
name = "browser-smoke"
path = "../../test/tools/browser-smoke/runner/main.rs"

[dependencies]
http = { version = "1", path = "../../src/foundation/networking/http" }
storage-engine.workspace = true
storage-server.workspace = true
base64 = {version = "0.23.1", path = "../../src/foundation/data-storage/base64", default-features = false, features = ["std"]}
json-codec = {version = "1", path = "../../src/foundation/data-storage/json-codec"}
tempfile = {version = "3", path = "../../src/foundation/platform/tempfile"}
