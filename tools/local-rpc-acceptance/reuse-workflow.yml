name: Resume final paired RPC with sealed binaries
on:
  workflow_dispatch:
    inputs:
      validation_sha:
        description: Exact normal candidate containing only the controller recovery patch
        required: true
        type: string
permissions:
  contents: read
  actions: read
defaults:
  run:
    shell: bash
concurrency:
  group: final-local-rpc-${{ github.ref }}
  cancel-in-progress: false
env:
  RPC_SOURCE_SHA: ${{ inputs.validation_sha }}
  RPC_REUSE_BUILD: '41166634669'
  RPC_MANIFEST_SHA256: bc2cc8e53b796d8aa6fb2bd9fb493133b15445e5e764aa5cb166d199b8975700
jobs:
  controller:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ inputs.validation_sha }}
          fetch-depth: 2
      - name: Fetch the exact sealed source commit
        run: git fetch --no-tags --depth=1 origin 70ff4929252b24c6f4b53719940cbec127b77561
      - name: Authenticate patched normal source and mechanical contracts
        run: |
          python3 -c 'import os,re,subprocess; sha=os.environ["RPC_SOURCE_SHA"]; assert re.fullmatch("[0-9a-f]{40}",sha); assert subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip()==sha'
          bash .github/scripts/check.sh static
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: rpc-build-evidence
          run-id: 41166634669
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/rpc-reuse
      - name: Verify successful build, unchanged compiled sources and original deadline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/isarmg/zxs/actions/runs/41166634669 > "$RUNNER_TEMP/rpc-reuse/reuse-run.json"
          gh api 'repos/isarmg/zxs/actions/runs/41166634669/jobs?per_page=100' > "$RUNNER_TEMP/rpc-reuse/reuse-jobs.json"
          python3 tools/local-rpc-acceptance/screen.py reuse "$RUNNER_TEMP/rpc-reuse"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: rpc-reuse-evidence
          path: ${{ runner.temp }}/rpc-reuse/*
          if-no-files-found: error
          retention-days: 14
  pair:
    needs: controller
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        commits: [22, 220]
        pair: [0, 1]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ inputs.validation_sha }}
          fetch-depth: 2
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: rpc-binaries
          run-id: 41166634669
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/rpc-bundle
      - name: Fetch the exact sealed source commit
        run: git fetch --no-tags --depth=1 origin 70ff4929252b24c6f4b53719940cbec127b77561
      - name: Execute the four previously unstarted pairs
        run: python3 tools/local-rpc-acceptance/screen.py run "$RUNNER_TEMP/rpc-bundle" "$RUNNER_TEMP/rpc-results" '${{ matrix.commits }}' '${{ matrix.pair }}'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: rpc-${{ matrix.commits }}-${{ matrix.pair }}
          path: ${{ runner.temp }}/rpc-results/**
          if-no-files-found: error
          retention-days: 14
  summary:
    if: always()
    needs: [controller, pair]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ inputs.validation_sha }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: rpc-*-*
          path: ${{ runner.temp }}/rpc-pairs
      - name: Evaluate unchanged criteria
        run: python3 tools/local-rpc-acceptance/screen.py summary "$RUNNER_TEMP/rpc-pairs" "$RUNNER_TEMP/rpc-screen.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: rpc-summary
          path: ${{ runner.temp }}/rpc-screen.json
          if-no-files-found: error
          retention-days: 14
