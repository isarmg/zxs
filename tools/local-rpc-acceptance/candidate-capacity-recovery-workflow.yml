name: Recover second candidate continuous-capacity correctness sample
# Reuse sealed binaries; do not alter the original expired plan or failed evidence.
# Candidate-only correctness recovery is not a new baseline performance comparison.
on:
  workflow_dispatch:
    inputs:
      validation_sha:
        description: Exact normal controller commit with its original CI contract
        required: true
        type: string
permissions:
  contents: read
  actions: read
defaults:
  run:
    shell: bash
concurrency:
  group: candidate-capacity-recovery-${{ github.ref }}
  cancel-in-progress: false
env:
  RPC_SOURCE_SHA: ${{ inputs.validation_sha }}
  RPC_OBSERVER_SHA: ${{ github.sha }}
  RPC_MANIFEST_SHA256: '78027232da8013e4b0a46e88be772900afd4c314df9330e61bd55ffd31efd04b'
jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ inputs.validation_sha }}
      - name: Authenticate exact normal controller and run mechanical checks without Rust
        run: |
          python3 -c 'import os,re,subprocess; sha=os.environ["RPC_SOURCE_SHA"]; assert re.fullmatch("[0-9a-f]{40}",sha); assert subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip()==sha; assert not subprocess.check_output(["git","status","--porcelain"],text=True).strip()'
          bash .github/scripts/check.sh static
      - name: Download the existing sealed binaries without rebuilding either arm
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: '13034728252'
          run-id: '41180163138'
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/rpc-bundle
          merge-multiple: true
      - name: Download the original candidate correctness evidence
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: rpc-220-continuous-1
          run-id: '41180163138'
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/prior
      - name: Authenticate prior evidence and select a new bounded recovery window
        run: |
          mkdir -p "$RUNNER_TEMP/capacity-recovery"
          python3 tools/local-rpc-acceptance/capacity_recovery.py select "$RUNNER_TEMP/rpc-bundle" "$RUNNER_TEMP/prior/pair.json" "$RUNNER_TEMP/capacity-recovery/plan.json"
          printf 'RPC_PLAN_SHA256=%s\n' "$(sha256sum "$RUNNER_TEMP/capacity-recovery/plan.json" | cut -d ' ' -f 1)" >> "$GITHUB_ENV"
      - name: Recover one candidate seven-stage correctness sample with original resource limits
        run: python3 tools/local-rpc-acceptance/capacity_recovery.py run "$RUNNER_TEMP/rpc-bundle" "$RUNNER_TEMP/prior/pair.json" "$RUNNER_TEMP/capacity-recovery/plan.json" "$RUNNER_TEMP/capacity-recovery/results"
      - name: Preserve the recovery plan and all partial results even on failure
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: candidate-capacity-recovery
          path: ${{ runner.temp }}/capacity-recovery/**
          if-no-files-found: error
          retention-days: 14
