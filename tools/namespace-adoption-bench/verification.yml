# Publish only as ci.yml on the separate verification carrier; never a product ancestor.
name: Namespace exact-build paired measurements
on:
  push:
    branches: [verify/namespace-build-once-20261029]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: namespace-build-once-${{ github.ref }}
  cancel-in-progress: false
env:
  CARGO_NET_OFFLINE: 'true'
  CARGO_INCREMENTAL: '0'
  CARGO_BUILD_JOBS: '2'
  CARGO_TERM_COLOR: never
  RUST_BACKTRACE: '1'
  CFLAGS: '-march=x86-64 -mtune=generic'
jobs:
  build:
    name: Build exact baseline and candidate once
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    outputs:
      manifest_sha256: ${{ steps.seal.outputs.manifest_sha256 }}
      measurement_deadline_unix: ${{ steps.prepare.outputs.measurement_deadline_unix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          path: harness
          sparse-checkout: |
            tools/namespace-adoption-bench
            test/engine/bench/namespace_adoption
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: e2f33d9882cf7263412d9370b6a703e0b216357d
          path: baseline
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: 99f02cb978bff53f28d1ad8414037a3f52d74cd2
          path: candidate
      - name: Run tooling boundary regressions for this exact carrier
        run: |
          python3 harness/test/engine/bench/namespace_adoption/test_harness.py
      - name: Authenticate products and install only the standalone measurement adapters
        id: prepare
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/namespace-evidence"
          measurement_deadline_unix=$(( $(date +%s) + 150 * 60 ))
          printf 'measurement_deadline_unix=%s\n' "$measurement_deadline_unix" >> "$GITHUB_OUTPUT"
          printf 'ZXS_MEASUREMENT_DEADLINE_UNIX=%s\n' "$measurement_deadline_unix" >> "$GITHUB_ENV"
          printf 'CARGO_BUILD_TARGET=x86_64-unknown-linux-gnu\n' >> "$GITHUB_ENV"
          printf 'CARGO_ENCODED_RUSTFLAGS=-C\x1ftarget-cpu=x86-64\n' >> "$GITHUB_ENV"
          printf 'CARGO_HOME=%s\n' "$(mktemp -d "$RUNNER_TEMP/namespace-cargo.XXXXXX")" >> "$GITHUB_ENV"
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess, tomllib
          root = pathlib.Path.cwd()
          out = pathlib.Path(os.environ['RUNNER_TEMP']) / 'namespace-evidence'
          identities = {
              'baseline': ('e2f33d9882cf7263412d9370b6a703e0b216357d','bee9d4686088a4af6c659a983c6e711f5f62d272'),
              'candidate': ('99f02cb978bff53f28d1ad8414037a3f52d74cd2','96d02c531530729ede98b524af819198cbdb3c8a'),
          }
          records = {}
          for name, (sha, tree) in identities.items():
              product = root / name
              def git(*args):
                  return subprocess.check_output(['git', '-C', str(product), *args]).decode().strip()
              assert git('rev-parse','HEAD') == sha
              assert git('rev-parse','HEAD^{tree}') == tree
              assert not git('status','--porcelain')
              assert tomllib.loads((product/'rust-toolchain.toml').read_text())['toolchain']['channel'] == '1.99.0'
              manifest = product/'src/engine/Cargo.toml'
              original = manifest.read_bytes()
              assert 'task1_adoption' not in original.decode()
              source = root/'harness/test/engine/bench/namespace_adoption'/f'{name}.rs'
              destination = product/'test/engine/bench/task1_adoption.rs'
              destination.parent.mkdir(parents=True, exist_ok=True)
              assert not destination.exists()
              destination.write_bytes(source.read_bytes())
              manifest.write_bytes(original + b'\n[[bin]]\nname="task1_adoption"\npath="../../test/engine/bench/task1_adoption.rs"\ntest=false\nbench=false\n')
              changed = git('diff','--name-only').splitlines()
              untracked = git('ls-files','--others','--exclude-standard').splitlines()
              assert changed == ['src/engine/Cargo.toml'], changed
              assert untracked == ['test/engine/bench/task1_adoption.rs'], untracked
              records[name] = dict(sha=sha, tree=tree,
                  adapter_sha256=hashlib.sha256(destination.read_bytes()).hexdigest(),
                  manifest_before_sha256=hashlib.sha256(original).hexdigest(),
                  manifest_after_sha256=hashlib.sha256(manifest.read_bytes()).hexdigest(),
                  catalog_blob=git('rev-parse','HEAD:compliance/rust-sources.json'),
                  lock_blob=git('rev-parse','HEAD:Cargo.lock'),
                  configuration_blob=git('rev-parse','HEAD:.cargo/config.toml'))
          records['workflow_sha'] = os.environ['GITHUB_SHA']
          records['runner'] = dict(os=os.environ['RUNNER_OS'], arch=os.environ['RUNNER_ARCH'])
          records['scope'] = 'measurement-only adapters; no production/source receipt update'
          (out/'input-identity.json').write_text(json.dumps(records,indent=2)+'\n')
          PY
          uname -a > "$RUNNER_TEMP/namespace-evidence/uname.txt"
          lscpu > "$RUNNER_TEMP/namespace-evidence/lscpu.txt"
          free -b > "$RUNNER_TEMP/namespace-evidence/memory-before.txt"
          df -B1 > "$RUNNER_TEMP/namespace-evidence/disk-before.txt"
          command -v strace
          strace --version > "$RUNNER_TEMP/namespace-evidence/strace.txt"
      - name: Build both fixed Rust 1.99 release adapters without development features
        timeout-minutes: 60
        shell: bash
        run: |
          set -euo pipefail
          for product in baseline candidate; do
            (
              cd "$product"
              rustc --version | tee "$RUNNER_TEMP/namespace-evidence/$product-rustc.txt"
              cargo --version | tee "$RUNNER_TEMP/namespace-evidence/$product-cargo.txt"
              grep -q '^rustc 1\.99\.0 ' "$RUNNER_TEMP/namespace-evidence/$product-rustc.txt"
              grep -q '^cargo 1\.99\.0 ' "$RUNNER_TEMP/namespace-evidence/$product-cargo.txt"
              printf '%s\n' 'cargo build --locked --offline --release --target x86_64-unknown-linux-gnu -p storage-engine --bin task1_adoption --message-format=json -vv' > "$RUNNER_TEMP/namespace-evidence/$product-build-command.txt"
              CARGO_TARGET_DIR="$RUNNER_TEMP/namespace-target-$product" cargo build --locked --offline --release --target x86_64-unknown-linux-gnu -p storage-engine --bin task1_adoption --message-format=json -vv > "$RUNNER_TEMP/namespace-evidence/$product-build.jsonl" 2> "$RUNNER_TEMP/namespace-evidence/$product-build.log"
              sha256sum "$RUNNER_TEMP/namespace-target-$product/x86_64-unknown-linux-gnu/release/task1_adoption" > "$RUNNER_TEMP/namespace-evidence/$product-binary.sha256"
            )
          done
          python3 - <<'PY'
          import json, os, pathlib
          root = pathlib.Path.cwd()
          evidence = pathlib.Path(os.environ['RUNNER_TEMP']) / 'namespace-evidence'
          selected = {}
          for name in ('baseline','candidate'):
              manifest = str(root / name / 'src/engine/Cargo.toml')
              lines = (evidence / f'{name}-build.jsonl').read_text().splitlines()
              # Cargo -vv interleaves bracket-prefixed build-script output with JSON messages.
              records = [json.loads(line) for line in lines if line.startswith('{')]
              assert [row['success'] for row in records if row['reason'] == 'build-finished'] == [True]
              artifacts = [row for row in records if row['reason'] == 'compiler-artifact' and row['manifest_path'] == manifest]
              assert any(row['target']['kind'] == ['lib'] for row in artifacts), 'engine library compile evidence missing'
              assert any(row['target']['kind'] == ['bin'] and row['target']['name'] == 'task1_adoption' for row in artifacts), 'measurement binary evidence missing'
              for row in artifacts:
                  assert not set(row['features']) & {'fault-injection','test-support'}, row
              selected[name] = artifacts
          (evidence / 'actual-engine-features.json').write_text(json.dumps(selected,indent=2)+'\n')
          PY
      - name: Confirm no measurement changed production source or authoritative records
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          root=pathlib.Path.cwd()
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'namespace-evidence'
          records=json.loads((out/'input-identity.json').read_text())
          for name in ('baseline','candidate'):
              def git(*args):
                  return subprocess.check_output(['git','-C',str(root/name),*args]).decode().strip()
              assert git('rev-parse','HEAD') == records[name]['sha']
              assert hashlib.sha256((root/name/'src/engine/Cargo.toml').read_bytes()).hexdigest() == records[name]['manifest_after_sha256']
              assert hashlib.sha256((root/name/'test/engine/bench/task1_adoption.rs').read_bytes()).hexdigest() == records[name]['adapter_sha256']
              assert git('diff','--name-only').splitlines() == ['src/engine/Cargo.toml']
              assert git('ls-files','--others','--exclude-standard').splitlines() == ['test/engine/bench/task1_adoption.rs']
          (out/'source-unchanged.txt').write_text('Only declared standalone benchmark binary and manifest wiring differ.\n')
          PY
      - name: Seal binaries and complete build identity
        id: seal
        shell: bash
        run: |
          set -euo pipefail
          manifest_sha256=$(python3 harness/tools/namespace-adoption-bench/artifacts.py seal \
            --workspace "$GITHUB_WORKSPACE" --harness "$GITHUB_WORKSPACE/harness" \
            --evidence "$RUNNER_TEMP/namespace-evidence" \
            --bundle-dir "$RUNNER_TEMP/namespace-bundle" \
            --baseline-binary "$RUNNER_TEMP/namespace-target-baseline/x86_64-unknown-linux-gnu/release/task1_adoption" \
            --candidate-binary "$RUNNER_TEMP/namespace-target-candidate/x86_64-unknown-linux-gnu/release/task1_adoption")
          printf 'manifest_sha256=%s\n' "$manifest_sha256" >> "$GITHUB_OUTPUT"
      - name: Upload sealed binaries for this run only
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: namespace-exact-build-${{ github.run_attempt }}
          path: ${{ runner.temp }}/namespace-bundle/
          if-no-files-found: error
          retention-days: 14
      - name: Retain all raw build evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: namespace-build-evidence-${{ github.run_attempt }}
          path: ${{ runner.temp }}/namespace-evidence/
          if-no-files-found: error
          retention-days: 14
  paired:
    name: Pair (${{ matrix.files }} files, repetition ${{ matrix.pair }})
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        files: [500, 1500, 3000]
        pair: [0, 1, 2, 3]
    env:
      ZXS_EXPECTED_MANIFEST_SHA256: ${{ needs.build.outputs.manifest_sha256 }}
      ZXS_MEASUREMENT_DEADLINE_UNIX: ${{ needs.build.outputs.measurement_deadline_unix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          path: harness
          sparse-checkout: |
            tools/namespace-adoption-bench
            test/engine/bench/namespace_adoption
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: namespace-exact-build-${{ github.run_attempt }}
          path: ${{ runner.temp }}/namespace-bundle
      - name: Initialize bounded paired measurement
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/namespace-evidence"
          command -v strace
          strace --version > "$RUNNER_TEMP/namespace-evidence/strace.txt"
          uname -a > "$RUNNER_TEMP/namespace-evidence/uname.txt"
          lscpu > "$RUNNER_TEMP/namespace-evidence/lscpu.txt"
          free -b > "$RUNNER_TEMP/namespace-evidence/memory-before.txt"
          df -B1 > "$RUNNER_TEMP/namespace-evidence/disk-before.txt"
      - name: Verify exact artifact identity and actually execute this pair
        shell: bash
        run: |
          set -euo pipefail
          python3 harness/tools/namespace-adoption-bench/run.py \
            --bundle-dir "$RUNNER_TEMP/namespace-bundle" \
            --audit-dir "$RUNNER_TEMP/namespace-evidence/artifact-audit" \
            --output "$RUNNER_TEMP/namespace-evidence/results" \
            --pool-parent "$RUNNER_TEMP/namespace-pools" \
            --deadline-unix "$ZXS_MEASUREMENT_DEADLINE_UNIX" \
            --sizes '${{ matrix.files }}' --pair-index '${{ matrix.pair }}'
      - name: Retain every raw log, failure and partial measurement
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: namespace-pair-${{ matrix.files }}-${{ matrix.pair }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/namespace-evidence/
          if-no-files-found: error
          retention-days: 14
  aggregate:
    name: Account for all twelve executed pairs
    if: always()
    needs: [build, paired]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          path: harness
          sparse-checkout: tools/namespace-adoption-bench
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: namespace-pair-*-${{ github.run_attempt }}
          path: ${{ runner.temp }}/namespace-pairs
        continue-on-error: true
      - name: Report complete, failed and incomplete evidence separately
        if: always()
        env:
          ZXS_BUILD_RESULT: ${{ needs.build.result }}
          ZXS_EXPECTED_MANIFEST_SHA256: ${{ needs.build.outputs.manifest_sha256 }}
        shell: bash
        run: |
          python3 harness/tools/namespace-adoption-bench/summarize.py \
            --input "$RUNNER_TEMP/namespace-pairs" --output "$RUNNER_TEMP/namespace-summary"
      - name: Retain aggregate evidence index
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: namespace-summary-${{ github.run_attempt }}
          path: ${{ runner.temp }}/namespace-summary/
          if-no-files-found: error
          retention-days: 14
