[package]
name = "web-bindings"
version = "0.2.129"
edition = "2021"
rust-version = "1.86"
license = "MIT OR Apache-2.0"
repository = "https://github.com/wasm-bindgen/wasm-bindgen"
description = "ZXS Web-only binding generator derived from wasm-bindgen-cli"
autobins = false

[[bin]]
name = "wasm-bindgen"
path = "src/main.rs"

[dependencies]
anyhow = {version = "1", path = "../../src/foundation/diagnostics/anyhow"}
command-line = { version = "4", features = ["derive"], path = "../../src/foundation/tooling/command-line"}
logging = {version = "0.11.5", default-features = false, features = ["auto-color", "regex"], path = "../../src/foundation/diagnostics/logging"}
wasm-bindgen-cli-support = {version = "=0.2.129", path = "../../src/foundation/web-runtime/wasm-bindgen-cli-support"}

[dev-dependencies]
log = { version = "0.4", path = "../../src/foundation/diagnostics/log" }

[lints]
workspace = true
