[workspace]
resolver = "2"
members = [
    "src/macros",
    "src/auth",
    "src/client",
    "src/contract",
    "src/rescue",
    "src/engine",
    "src/web",
    "src/smb",
    "src/interface",
    "src/platform",
    "src/naming",
    "src/smb-vfs",
    "src/server",
    "tools/unicode-build",
    "tools/contract-check",
    "tools/release-tools",
    "tools/perf-check",
    "tools/web-build",
    "tools/browser-smoke",
    "tools/web-bindings",
    # Explicit regression targets, not default product members.
    "src/foundation/cryptography/ring",
    "src/foundation/diagnostics/tracing-attributes",
    "src/foundation/networking/axum-macros",
    "src/foundation/web-runtime/wasm-bindgen-cli-support",
    "src/foundation/web-runtime/wasm-text-parser",
    "src/foundation/web-runtime/wasm-text-printer",
    "src/foundation/text-unicode/unicode-display-width",
]
exclude = ["src/foundation"]
default-members = [
    "src/auth",
    "src/contract",
    "src/naming",
    "src/platform",
    "src/engine",
    "src/server",
    "src/client",
    "src/rescue",
    "src/smb",
]

[workspace.package]
version = "0.1.1"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"

[workspace.dependencies]
authentication = { path = "src/auth" }
storage-contract = { path = "src/contract" }
name-policy = { path = "src/naming" }
platform-io = { path = "src/platform" }
storage-engine = { path = "src/engine" }
storage-client = { path = "src/client" }
storage-server = { path = "src/server" }
data-serialization = { version = "1", features = ["derive"], path = "src/foundation/data-storage/data-serialization"}
json-codec = {version = "1", path = "src/foundation/data-storage/json-codec"}
error-definition = {version = "2", path = "src/foundation/diagnostics/error-definition"}
blake3 = {version = "=1.8.7", path = "src/foundation/cryptography/blake3"}
uuid = { version = "1", features = ["v4"], path = "src/foundation/core-types/uuid"}
sqlite-access = { version = "=0.9.0", default-features = false, features = ["sqlite-bundled"], path = "src/foundation/data-storage/sqlite-access"}
tokio = { version = "1.53.2", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"], path = "src/foundation/concurrency/tokio"}
rustix = { version = "1.1.5", features = ["fs", "process"], path = "src/foundation/platform/rustix"}
tempfile = {version = "3", path = "src/foundation/platform/tempfile"}
command-line = { version = "4.6.7", features = ["derive"], path = "src/foundation/tooling/command-line"}

bumpalo = { version = "=3.20.3", path = "src/foundation/collections/bumpalo" }
leb128fmt = { version = "=0.1.0", path = "src/foundation/data-storage/leb128fmt", default-features = false }
memchr = { version = "=2.8.3", path = "src/foundation/text-unicode/memchr" }
anyhow = { version = "=1.0.104", path = "src/foundation/diagnostics/anyhow", default-features = false }
wasm-encoder = { version = "=0.245.1", path = "src/foundation/web-runtime/wasm-encoder", default-features = false }
wasmparser = { version = "=0.245.1", path = "src/foundation/web-runtime/wasmparser", default-features = false }
wasm-text-parser = { version = "=245.0.1", path = "src/foundation/web-runtime/wasm-text-parser" }
wasm-text-printer = { version = "=0.245.1", path = "src/foundation/web-runtime/wasm-text-printer" }
unicode-display-width = { version = "=0.2.2", path = "src/foundation/text-unicode/unicode-display-width" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[profile.dev]
debug = 0

[profile.test]
debug = 0
