[package]
name = "storage-server"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "zxs"
path = "src/main.rs"
required-features = ["core"]

[features]
default = ["core"]
core = ["dep:storage-engine"]

[dependencies]
command-line.workspace = true
authentication.workspace = true
http-routing = { version = "0.8.9", default-features = false, features = ["http1", "json", "query", "tokio", "tower-log", "tracing"], path = "../foundation/networking/http-routing"}
blake3.workspace = true
bytes = {version = "1", path = "../foundation/collections/bytes"}
futures = { version = "0.3.34", path = "../foundation/concurrency/futures", default-features = false, features = ["std", "utilities"] }
http = {version = "1", path = "../foundation/networking/http"}
data-serialization.workspace = true
json-codec.workspace = true
error-definition.workspace = true
sysinfo = { version = "=0.39.6", default-features = false, features = ["system"], path = "../foundation/platform/sysinfo"}
tokio.workspace = true
tower-http = { version = "0.6", features = ["fs"], path = "../foundation/networking/tower-http"}
tracing = {version = "0.1", default-features = false, features = ["collector-default", "env-filter"], path = "../foundation/diagnostics/tracing"}
date-time = { version = "0.3.55", features = ["formatting"], path = "../foundation/core-types/date-time"}
url-encoding = { path = "../foundation/networking/url-encoding", default-features = false, features = ["std", "parser"] }
storage-engine = { path = "../engine", optional = true }
platform-io.workspace = true
storage-contract = { path = "../contract" }
rustix.workspace = true
name-policy = { path = "../naming" }
smb-protocol = { path = "../smb" }
tempfile.workspace = true

[dev-dependencies]
# HTTP and admission recovery tests exercise the same engine failpoints.
storage-engine = { path = "../engine", features = ["fault-injection"] }
service-stack = { version = "0.5", features = ["util"], path = "../foundation/networking/service-stack"}

[[test]]
name = "http_engine"
path = "../../test/server/integration/http_engine.rs"

[[test]]
name = "login_admission"
path = "../../test/server/integration/login_admission.rs"

[[test]]
name = "telemetry_status"
path = "../../test/server/integration/telemetry_status.rs"

[[test]]
name = "service_startup"
path = "../../test/server/integration/service_startup.rs"
required-features = ["core"]
