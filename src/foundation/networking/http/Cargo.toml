# Internal source component. Original manifest and origin: compliance/provenance.

[package]
edition = "2021"
rust-version = "1.57.0"
name = "http"
version = "1.5.0"
authors = [
    "Alex Crichton <alex@alexcrichton.com>",
    "Carl Lerche <me@carllerche.com>",
    "Sean McArthur <sean@seanmonstar.com>",
]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = """
A set of types for representing HTTP requests and responses.
"""
documentation = "https://docs.rs/http"
readme = "../../../../docs/upstream/http-1.5.0/README.md"
keywords = ["http"]
categories = ["web-programming"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/hyperium/http"

[features]
default = ["std"]
std = []

[lib]
name = "http"
path = "src/lib.rs"

[dependencies.bytes]
version = "1"
path = "../../collections/bytes"

[dependencies.itoa]
version = "1"
path = "../../core-types/itoa"

[dev-dependencies.data-serialization]
version = "1"
path = "../../data-storage/data-serialization"

[dev-dependencies.json-codec]
version = "1"
path = "../../data-storage/json-codec"

