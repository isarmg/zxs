# Internal source component. Original manifest and origin: compliance/provenance.

[package]
edition = "2021"
rust-version = "1.94.0"
name = "sqlite-access"
version = "0.9.0"
authors = [
    "Ryan Leckey <leckey.ryan@gmail.com>",
    "Austin Bonander <austin.bonander@gmail.com>",
    "Chloe Ross <orangesnowfox@gmail.com>",
    "Daniel Akhterov <akhterovd@gmail.com>",
]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Asynchronous SQLite access: queries, pools, transactions and typed values."
documentation = "https://docs.rs/sqlx"
readme = "../../../../docs/upstream/sqlx-0.9.0/README.md"
license = "MIT OR Apache-2.0"
repository = "https://github.com/launchbadge/sqlx"

[lib]
name = "sqlite_access"
path = "src/lib.rs"

[features]
# Direct SQLite workers need neither a Tokio runtime nor a general URL parser.
pool = ["dep:tokio", "dep:concurrent-collections", "dep:async-notification"]
url = ["url-encoding/parser"]
serialization = ["dep:data-serialization"]
json = ["serialization", "dep:json-codec"]
offline = ["serialization", "either/serialization"]
uuid = ["dep:uuid"]
bit-vec = ["dep:bit-vec"]
ipnet = ["dep:ipnet"]
regexp = ["dep:regex"]
sqlite = ["sqlite-bundled", "sqlite-deserialize", "sqlite-load-extension", "sqlite-unlock-notify"]
sqlite-bundled = ["libsqlite3-sys/bundled"]
sqlite-unbundled = ["libsqlite3-sys/buildtime_bindgen"]
sqlite-deserialize = []
sqlite-load-extension = []
sqlite-preupdate-hook = ["libsqlite3-sys/preupdate_hook"]
sqlite-unlock-notify = ["libsqlite3-sys/unlock_notify"]

[dependencies.bit-vec]
version = "0.8"
optional = true
path = "../../collections/bit-vec"

[dependencies.concurrent-collections]
optional = true
path = "../../concurrency/concurrent-collections"

[dependencies.either]
version = "1.6.1"
path = "../../core-types/either"

[dependencies.async-notification]
optional = true
path = "../../concurrency/async-notification"
default-features = true

[dependencies.futures]
version = "0.3.34"
path = "../../concurrency/futures"
default-features = false
features = ["alloc", "channel", "executor", "sink", "std", "utilities"]

[dependencies.hash-table]
version = "0.17.1"
path = "../../collections/hash-table"

[dependencies.hashlink]
version = "0.11.0"
path = "../../collections/hashlink"

[dependencies.indexmap]
version = "2.0"
path = "../../collections/indexmap"

[dependencies.ipnet]
version = "2.3.0"
optional = true
path = "../../networking/ipnet"

[dependencies.log]
version = "0.4.18"
path = "../../diagnostics/log"

[dependencies.data-serialization]
version = "1.0.219"
features = ["derive", "rc"]
optional = true
path = "../data-serialization"

[dependencies.json-codec]
version = "1.0.142"
features = ["raw_value"]
optional = true
path = "../json-codec"

[dependencies.smallvec]
version = "1.13.1"
path = "../../collections/smallvec"

[dependencies.error-definition]
version = "2.0.18"
features = ["std"]
default-features = false
path = "../../diagnostics/error-definition"

[dependencies.tokio]
optional = true
version = "1.25.0"
features = ["time", "sync", "rt"]
default-features = false
path = "../../concurrency/tokio"

[dependencies.tracing]
version = "0.1.37"
default-features = false
features = ["log", "std"]
path = "../../diagnostics/tracing"

[dependencies.uuid]
version = "1.12.1"
optional = true
path = "../../core-types/uuid"

[dependencies.bytes]
version = "1.2.0"
path = "../../collections/bytes"

[dependencies.flume]
version = "0.12.0"
features = ["async"]
default-features = false
path = "../../concurrency/flume"

[dependencies.futures-intrusive]
version = "0.5.0"
path = "../../concurrency/futures-intrusive"

[dependencies.libsqlite3-sys]
version = "=0.39.1"
features = ["pkg-config"]
default-features = false
path = "../libsqlite3-sys"

[dependencies.regex]
version = "1.6.0"
optional = true
path = "../../text-unicode/regex"

[lints.clippy]
cast_possible_truncation = "deny"
cast_possible_wrap = "deny"
cast_sign_loss = "deny"
disallowed_methods = "deny"

[dependencies.url-encoding]
path = "../../networking/url-encoding"
default-features = false
features = ["form", "std"]
