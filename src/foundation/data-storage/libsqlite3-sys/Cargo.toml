# Internal source component. Original manifest and origin: compliance/provenance.

[package]
edition = "2024"
rust-version = "1.88.0"
name = "libsqlite3-sys"
version = "0.39.1"
authors = ["The rusqlite developers"]
build = "build.rs"
links = "sqlite3"
exclude = ["**/*.sh"]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Native bindings to the libsqlite3 library"
readme = "../../../../docs/upstream/libsqlite3-sys-0.39.1/README.md"
keywords = [
    "sqlite",
    "sqlcipher",
    "ffi",
]
categories = ["external-ffi-bindings"]
license = "MIT"
repository = "https://github.com/rusqlite/rusqlite"

[features]
buildtime_bindgen = ["bindgen", "pkg-config"]
bundled = ["cc", "bundled_bindings"]
bundled-sqlcipher = ["bundled"]
bundled-sqlcipher-vendored-openssl = ["bundled-sqlcipher"]
bundled-windows = ["cc", "bundled_bindings"]
bundled_bindings = []
column_metadata = []
default = ["min_sqlite_version_3_45_3"]
in_gecko = []
loadable_extension = ["rust-source-format", "quote", "rust-syntax"]
min_sqlite_version_3_45_3 = ["pkg-config"]
preupdate_hook = ["buildtime_bindgen"]
session = ["preupdate_hook", "buildtime_bindgen"]
sqlcipher = []
unlock_notify = []
wasm32-wasi-vfs = []
with-asan = []

[lib]
name = "libsqlite3_sys"
path = "src/lib.rs"

[build-dependencies.bindgen]
version = "0.72"
features = ["runtime"]
optional = true
default-features = false
path = "../../tooling/bindgen"

[build-dependencies.cc]
version = "1.2.27"
optional = true
path = "../../tooling/cc"

[build-dependencies.pkg-config]
version = "0.3.19"
optional = true
path = "../../tooling/pkg-config"

[build-dependencies.rust-source-format]
version = "0.3"
optional = true
path = "../../code-generation/rust-source-format"

[build-dependencies.quote]
version = "1.0.36"
optional = true
default-features = false
path = "../../code-generation/quote"

[build-dependencies.rust-syntax]
version = "3"
features = [
    "full",
    "extra-traits",
    "visit-mut",
]
optional = true
path = "../../code-generation/rust-syntax"
