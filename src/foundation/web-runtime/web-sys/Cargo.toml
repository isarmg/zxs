# Internal source component. Original manifest and origin: compliance/provenance.

[package]
edition = "2021"
rust-version = "1.81"
name = "web-sys"
version = "0.3.106"
authors = ["The wasm-bindgen Developers"]
build = false
include = [
    "/LICENSE-*",
    "/src",
]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = """
Bindings for all Web APIs, a procedurally generated crate from WebIDL
"""
homepage = "https://wasm-bindgen.github.io/wasm-bindgen/web-sys/index.html"
documentation = "https://wasm-bindgen.github.io/wasm-bindgen/api/web_sys/"
readme = "../../../../docs/upstream/web-sys-0.3.106/README.md"
license = "MIT OR Apache-2.0"
repository = "https://github.com/wasm-bindgen/wasm-bindgen/tree/master/crates/web-sys"

[features]
AbortController = []
AbortSignal = ["EventTarget"]
AddEventListenerOptions = []
Blob = []
BlobPropertyBag = []
CharacterData = ["EventTarget", "Node"]
Comment = ["CharacterData", "EventTarget", "Node"]
Crypto = []
CssStyleDeclaration = []
CustomEvent = ["Event"]
CustomEventInit = []
Document = ["EventTarget", "Node"]
DocumentFragment = ["EventTarget", "Node"]
DomException = []
DomMatrix = ["DomMatrixReadOnly"]
DomMatrixReadOnly = []
DomRect = ["DomRectReadOnly"]
DomRectList = []
DomRectReadOnly = []
DomStringMap = []
DomTokenList = []
Element = ["EventTarget", "Node"]
Event = []
EventTarget = []
File = ["Blob"]
FileList = []
FocusEvent = ["Event", "UiEvent"]
FontFace = []
FontFaceSet = ["EventTarget"]
Headers = []
HtmlAnchorElement = ["Element", "EventTarget", "HtmlElement", "Node"]
HtmlButtonElement = ["Element", "EventTarget", "HtmlElement", "Node"]
HtmlCollection = []
HtmlDListElement = ["Element", "EventTarget", "HtmlElement", "Node"]
HtmlDetailsElement = ["Element", "EventTarget", "HtmlElement", "Node"]
HtmlDialogElement = ["Element", "EventTarget", "HtmlElement", "Node"]
HtmlDivElement = ["Element", "EventTarget", "HtmlElement", "Node"]
HtmlElement = ["Element", "EventTarget", "Node"]
HtmlFieldSetElement = ["Element", "EventTarget", "HtmlElement", "Node"]
HtmlFormElement = ["Element", "EventTarget", "HtmlElement", "Node"]
HtmlHeadingElement = ["Element", "EventTarget", "HtmlElement", "Node"]
HtmlHtmlElement = ["Element", "EventTarget", "HtmlElement", "Node"]
HtmlImageElement = ["Element", "EventTarget", "HtmlElement", "Node"]
HtmlInputElement = ["Element", "EventTarget", "HtmlElement", "Node"]
HtmlLabelElement = ["Element", "EventTarget", "HtmlElement", "Node"]
HtmlLegendElement = ["Element", "EventTarget", "HtmlElement", "Node"]
HtmlLiElement = ["Element", "EventTarget", "HtmlElement", "Node"]
HtmlParagraphElement = ["Element", "EventTarget", "HtmlElement", "Node"]
HtmlPreElement = ["Element", "EventTarget", "HtmlElement", "Node"]
HtmlSpanElement = ["Element", "EventTarget", "HtmlElement", "Node"]
HtmlTableCellElement = ["Element", "EventTarget", "HtmlElement", "Node"]
HtmlTableElement = ["Element", "EventTarget", "HtmlElement", "Node"]
HtmlTableRowElement = ["Element", "EventTarget", "HtmlElement", "Node"]
HtmlTableSectionElement = ["Element", "EventTarget", "HtmlElement", "Node"]
HtmlTemplateElement = ["Element", "EventTarget", "HtmlElement", "Node"]
HtmlTextAreaElement = ["Element", "EventTarget", "HtmlElement", "Node"]
HtmlTimeElement = ["Element", "EventTarget", "HtmlElement", "Node"]
HtmlTitleElement = ["Element", "EventTarget", "HtmlElement", "Node"]
HtmlUListElement = ["Element", "EventTarget", "HtmlElement", "Node"]
KeyboardEvent = ["Event", "UiEvent"]
Location = []
MediaQueryList = ["EventTarget"]
MediaQueryListEvent = ["Event"]
MouseEvent = ["Event", "UiEvent"]
MutationObserver = []
MutationObserverInit = []
MutationRecord = ["Node", "NodeList"]
Navigator = []
Node = ["EventTarget"]
NodeList = []
PageTransitionEvent = ["Event"]
Performance = ["EventTarget"]
PointerEvent = ["Event", "MouseEvent", "UiEvent"]
ReadableStream = []
ReadableStreamDefaultReader = []
Request = []
RequestCredentials = []
RequestInit = []
RequestMode = []
RequestRedirect = []
ResizeObserver = []
Response = []
ShadowRoot = ["DocumentFragment", "EventTarget", "Node"]
Storage = []
SubmitEvent = ["Event"]
SvgAnimatedRect = []
SvgElement = ["Element", "EventTarget", "Node"]
SvgGraphicsElement = ["Element", "EventTarget", "Node", "SvgElement"]
SvgMatrix = []
SvgRect = []
SvgsvgElement = ["Element", "EventTarget", "Node", "SvgElement", "SvgGraphicsElement"]
Text = ["CharacterData", "EventTarget", "Node"]
TransitionEvent = ["Event"]
UiEvent = ["Event"]
Url = []
UrlSearchParams = []
Window = ["EventTarget"]
console = []
default = ["std"]
std = ["wasm-bindgen/std", "js-sys/std"]

[lib]
name = "web_sys"
path = "src/lib.rs"
test = false
doctest = false

[dependencies.js-sys]
version = "=0.3.106"
default-features = false
path = "../js-sys"

[dependencies.wasm-bindgen]
version = "=0.2.129"
default-features = false
path = "../wasm-bindgen"

[lints.clippy]
large_enum_variant = "allow"
new_without_default = "allow"
overly_complex_bool_expr = "allow"
too_many_arguments = "allow"
type_complexity = "allow"

[lints.rust.unexpected_cfgs]
level = "warn"
priority = 0
check-cfg = ["cfg(web_sys_unstable_apis)"]
