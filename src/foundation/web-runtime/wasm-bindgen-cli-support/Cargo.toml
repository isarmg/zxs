# Internal source component. Original manifest and origin: compliance/provenance.

[package]
edition = "2021"
rust-version = "1.86"
name = "wasm-bindgen-cli-support"
version = "0.2.129"
authors = ["The wasm-bindgen Developers"]
build = false
include = [
    "/LICENSE-*",
    "/src",
]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = """
Shared support for the wasm-bindgen-cli package, an internal dependency
"""
homepage = "https://wasm-bindgen.github.io/wasm-bindgen/"
documentation = "https://docs.rs/wasm-bindgen-cli-support"
readme = false
license = "MIT OR Apache-2.0"
repository = "https://github.com/wasm-bindgen/wasm-bindgen/tree/master/crates/cli-support"

[lib]
name = "wasm_bindgen_cli_support"
path = "src/lib.rs"

[dependencies.anyhow]
version = "1.0"
path = "../../diagnostics/anyhow"

[dependencies.leb128]
version = "0.2"
path = "../../data-storage/leb128"

[dependencies.log]
version = "0.4"
path = "../../diagnostics/log"

[dependencies.rustc-demangle]
version = "0.1.13"
path = "../../diagnostics/rustc-demangle"

[dependencies.data-serialization]
version = "1.0"
features = ["derive"]
path = "../../data-storage/data-serialization"

[dependencies.json-codec]
version = "1.0"
path = "../../data-storage/json-codec"

[dependencies.walrus]
version = "0.27.2"
features = ["parallel"]
path = "../walrus"

[dependencies.wasm-bindgen-shared]
version = "=0.2.129"
path = "../wasm-bindgen-shared"

[dependencies.wasmparser]
version = "0.245"
path = "../wasmparser"

[lints.clippy]
large_enum_variant = "allow"
new_without_default = "allow"
overly_complex_bool_expr = "allow"
too_many_arguments = "allow"
type_complexity = "allow"
uninlined_format_args = "warn"

[lints.rust]
unused_lifetimes = "warn"

[lints.rust.unexpected_cfgs]
level = "warn"
priority = 0
check-cfg = [
    "cfg(wasm_bindgen_unstable_test_coverage)",
    "cfg(wasm_bindgen_use_js_sys)",
    "cfg(xxx_debug_only_print_generated_code)",
    "cfg(legacy_eh)",
    "cfg(tokio_unstable)",
    "cfg(wasm_bindgen_unstable_tokio)",
    "cfg(wasm_bindgen_unstable_jspi)",
]

[dev-dependencies]
wasm-text-parser.workspace = true
wasm-text-printer.workspace = true
