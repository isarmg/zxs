# Internal source component. Original manifest and origin: compliance/provenance.

[package]
edition = "2018"
rust-version = "1.66"
name = "fancy-regex"
version = "0.19.2"
authors = [
    "Raph Levien <raph@google.com>",
    "Robin Stocker <robin@nibor.org>",
    "Keith Hall <keith.hall@available.systems>",
]
build = false
exclude = [
    "/.github/*",
    "/Cargo.lock.msrv",
]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "An implementation of regexes, supporting a relatively rich set of features, including backreferences and look-around. Aims to be compatible with Oniguruma syntax when the relevant flag is set."
documentation = "https://docs.rs/fancy-regex"
readme = "../../../../docs/upstream/fancy-regex-0.19.2/README.md"
categories = ["text-processing"]
license = "MIT"
repository = "https://github.com/fancy-regex/fancy-regex"

[features]
default = ["unicode", "perf", "std", "variable-lookbehinds"]
leftmost_longest = []
perf = ["regex/engine-perf"]
perf-dfa-full = ["regex/dfa-build"]
std = ["regex/std", "bit-set/std"]
track_caller = []
unicode = ["regex/unicode"]
variable-lookbehinds = ["regex/dfa-search"]

[lib]
name = "fancy_regex"
path = "src/lib.rs"

[dependencies.bit-set]
version = "0.8"
default-features = false
path = "../../collections/bit-set"


[dependencies.regex]
version = "1.13.1"
path = "../regex"
default-features = false
features = ["alloc", "automata", "dfa-onepass", "dfa-search", "hybrid", "meta", "nfa", "syntax"]
