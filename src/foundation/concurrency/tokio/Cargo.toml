# Internal source component. Original manifest and origin: compliance/provenance.

[package]
edition = "2021"
rust-version = "1.71"
name = "tokio"
version = "1.53.3"
authors = ["Tokio Contributors <team@tokio.rs>"]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = """
An event-driven, non-blocking I/O platform for writing asynchronous I/O
backed applications.
"""
homepage = "https://tokio.rs"
readme = "../../../../docs/upstream/tokio-1.53.3/README.md"
keywords = [
    "io",
    "async",
    "non-blocking",
    "futures",
]
categories = [
    "asynchronous",
    "network-programming",
]
license = "MIT"
repository = "https://github.com/tokio-rs/tokio"

[features]
adapters = ["sync", "dep:futures"]
adapters-codec = ["adapters", "libc", "bytes"]
adapters-compat = ["adapters", "futures/std"]
adapters-io = ["adapters", "bytes"]
adapters-io-util = ["adapters-io", "rt", "io-util"]
adapters-net = ["adapters", "net"]
adapters-rt = ["adapters", "rt", "futures/async-await-macro", "futures/shared-state", "futures/std", "futures/utilities"]
adapters-time = ["adapters", "time", "dep:slab"]
adapters-join-map = ["adapters-rt", "dep:hash-table"]
adapters-tracing = ["adapters", "tracing"]
adapters-full = ["adapters-codec", "adapters-compat", "adapters-io-util", "adapters-time", "adapters-net", "adapters-rt", "adapters-join-map"]

parking = ["synchronization/locks"]
default = []
fs = []
full = ["fs", "io-util", "io-std", "macros", "net", "parking", "process", "rt", "rt-multi-thread", "signal", "sync", "time"]
io-std = []
io-uring = ["libc", "mio/os-poll", "mio/os-ext", "dep:slab"]
io-util = ["bytes"]
macros = ["tokio-macros"]
net = ["libc", "mio/os-poll", "mio/os-ext", "mio/net", "socket2"]
process = ["bytes", "libc", "mio/os-poll", "mio/os-ext", "mio/net", "signal-hook-registry"]
rt = []
rt-multi-thread = ["rt"]
schedule-latency = []
signal = ["libc", "mio/os-poll", "mio/net", "mio/os-ext", "signal-hook-registry"]
sync = []
taskdump = []
test-util = ["rt", "sync", "time"]
time = []

[lib]
name = "tokio"
path = "src/lib.rs"

[dependencies.bytes]
version = "1.2.1"
optional = true
path = "../../collections/bytes"

[dependencies.mio]
version = "1.2.0"
optional = true
default-features = false
path = "../mio"

[dependencies.synchronization]
path = "../synchronization"
default-features = false
optional = true

[dependencies.pin-project-lite]
version = "0.2.11"
path = "../pin-project-lite"

[dependencies.tokio-macros]
version = "~2.7.0"
optional = true
path = "../tokio-macros"

[target.'cfg(all(tokio_unstable, target_os = "linux"))'.dependencies.libc]
version = "0.2.168"
optional = true
path = "../../platform/libc"

[target.'cfg(all(tokio_unstable, target_os = "linux"))'.dependencies.mio]
version = "1.2.0"
features = [
    "os-poll",
    "os-ext",
]
optional = true
default-features = false
path = "../mio"

[dependencies.slab]
version = "0.4.9"
optional = true
path = "../../collections/slab"

[target.'cfg(any(not(target_family = "wasm"), all(target_os = "wasi", not(target_env = "p1"))))'.dependencies.socket2]
version = "0.6.3"
features = ["all"]
optional = true
path = "../../networking/socket2"

[target.'cfg(target_os = "wasi")'.dependencies.libc]
version = "0.2.168"
optional = true
path = "../../platform/libc"

[dependencies.tracing]
version = "0.1.29"
features = ["std"]
optional = true
default-features = false
path = "../../diagnostics/tracing"

[target."cfg(unix)".dependencies.libc]
version = "0.2.168"
optional = true
path = "../../platform/libc"

[target."cfg(unix)".dependencies.signal-hook-registry]
version = "1.1.1"
optional = true
path = "../signal-hook-registry"

[lints.rust.unexpected_cfgs]
level = "warn"
priority = 0
check-cfg = [
    "cfg(fuzzing)",
    "cfg(loom)",
    "cfg(mio_unsupported_force_poll_poll)",
    "cfg(tokio_allow_from_blocking_fd)",
    "cfg(tokio_internal_mt_counters)",
    "cfg(tokio_no_parking_lot)",
    "cfg(tokio_no_tuning_tests)",
    "cfg(tokio_unstable)",
    'cfg(target_os, values("cygwin"))',
]

[dependencies.futures]
version = "0.3.34"
path = "../futures"
default-features = false
features = ["std"]
optional = true

[dependencies.hash-table]
version = "0.17.1"
path = "../../collections/hash-table"
default-features = false
optional = true

[[test]]
name = "fs_asyncify"
path = "../../../../test/foundation/tokio/tests/fs_asyncify.rs"
required-features = ["fs", "rt"]
