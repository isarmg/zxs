[package]
name = "storage-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
[features]
fault-injection = []

[dependencies]
tracing = { version = "0.1", default-features = false, features = ["std"], path = "../foundation/diagnostics/tracing" }
error-definition.workspace = true
storage-contract.workspace = true
name-policy.workspace = true
platform-io.workspace = true
data-serialization.workspace = true
json-codec.workspace = true
blake3.workspace = true
rustix.workspace = true
sqlite-access = { workspace = true, features = ["sqlite-deserialize"] }
tempfile.workspace = true
date-time = { version = "=0.3.55", features = ["formatting", "parsing"], path = "../foundation/core-types/date-time"}

[[test]]
name = "branch_alias_operations"
path = "../../test/engine/integration/branch_alias_operations.rs"

[[test]]
name = "directory_selection_limits"
path = "../../test/engine/integration/directory_selection_limits.rs"

[[test]]
name = "workspace_commit_replay"
path = "../../test/engine/integration/workspace_commit_replay.rs"

[[test]]
name = "historical_workspace_lifecycle"
path = "../../test/engine/integration/historical_workspace_lifecycle.rs"

[[test]]
name = "workspace_namespace_preconditions"
path = "../../test/engine/integration/workspace_namespace_preconditions.rs"

[[test]]
name = "workspace_upload_retries"
path = "../../test/engine/integration/workspace_upload_retries.rs"

[[test]]
name = "phase1_tag_cold_replay"
path = "../../test/engine/integration/phase1_tag_cold_replay.rs"

[dev-dependencies]
# Resolver 2 enables hooks for all engine tests, never normal product builds.
storage-engine = { path = ".", features = ["fault-injection"] }
hash-table = { version = "0.17.1", path = "../foundation/collections/hash-table" }
hashlink = { version = "0.11.0", path = "../foundation/collections/hashlink" }
sqlite-access = { version = "0.9.0", default-features = false, path = "../foundation/data-storage/sqlite-access" }

[[test]]
name = "hash_table_compatibility"
path = "../../test/engine/integration/hash_table_compatibility.rs"

[[test]]
name = "directory_git_index"
path = "../../test/engine/integration/directory_git_index.rs"

[[test]]
name = "phase1_tag_regressions"
path = "../../test/engine/integration/phase1_tag_regressions.rs"

[[test]]
name = "directory_git_safety"
path = "../../test/engine/integration/directory_git_safety.rs"

[[test]]
name = "directory_git_staged_source"
path = "../../test/engine/integration/directory_git_staged_source.rs"

[[test]]
name = "file_soft_deletion"
path = "../../test/engine/integration/file_soft_deletion.rs"

[[test]]
name = "recursive_backup_paths"
path = "../../test/engine/integration/recursive_backup_paths.rs"

[[test]]
name = "directory_layout_execution"
path = "../../test/engine/integration/directory_layout_execution.rs"

[[test]]
name = "directory_layout_recovery_boundaries"
path = "../../test/engine/integration/directory_layout_recovery_boundaries.rs"

[[test]]
name = "content_matches"
path = "../../test/engine/integration/content_matches.rs"

[[test]]
name = "file_history_copy"
path = "../../test/engine/integration/file_history_copy.rs"

[[test]]
name = "independent_inventory"
path = "../../test/engine/integration/independent_inventory.rs"

[[test]]
name = "foreign_original_databases"
path = "../../test/engine/integration/foreign_original_databases.rs"

[lints]
workspace = true
