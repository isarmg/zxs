[package]
name = "web-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
date-time = { workspace = true, features = ["parsing"] }
data-serialization.workspace = true
error-definition.workspace = true
web-interface = { path = "../interface" }
storage-contract.workspace = true
name-policy.workspace = true
uuid = { version = "1", features = ["js"], path = "../foundation/core-types/uuid"}
json-codec.workspace = true
wasm-bindgen = {version = "=0.2.129", path = "../foundation/web-runtime/wasm-bindgen"}
js-sys = {version = "=0.3.106", path = "../foundation/web-runtime/js-sys"}
gloo-timers = { version = "0.3", path = "../foundation/web-runtime/gloo-timers" }
send_wrapper = {version = "0.6", path = "../foundation/concurrency/send_wrapper"}
web-sys = { version = "=0.3.106", features = ["MutationRecord", "Window", "Document", "Element", "HtmlElement", "HtmlInputElement", "HtmlTextAreaElement", "Crypto", "AbortController", "AbortSignal", "DomException", "Request", "RequestInit", "RequestMode", "RequestCredentials", "RequestRedirect", "Response", "ReadableStream", "ReadableStreamDefaultReader", "Headers", "UrlSearchParams", "Storage", "Event", "MouseEvent", "SubmitEvent", "console"], path = "../foundation/web-runtime/web-sys"}

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
task-dispatch = { path = "../foundation/concurrency/task-dispatch", version = "0.3.0", features = ["futures-executor"] }

[lints]
workspace = true
