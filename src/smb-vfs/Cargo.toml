[package]
name = "smb-vfs"
version.workspace = true
edition = "2024"
license = "GPL-3.0-or-later"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["smb-sdk"]
smb-sdk = ["dep:bindgen"]

[dependencies]
data-serialization.workspace = true
storage-contract.workspace = true
blake3 = {version = "1.8.7", path = "../foundation/cryptography/blake3"}
libc = {version = "0.2", path = "../foundation/platform/libc"}
json-codec = {version = "1", path = "../foundation/data-storage/json-codec"}
smb-protocol = { path = "../smb" }

[build-dependencies]
bindgen = { version = "0.72.1", optional = true, path = "../foundation/tooling/bindgen"}
json-codec = {version = "1", path = "../foundation/data-storage/json-codec"}
