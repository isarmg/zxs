[package]
name = "web-interface"
version.workspace = true
edition = "2024"
license = "Apache-2.0 AND MIT"
description = "Integrated ZXS browser interface, CSR primitives, mounting and presentation"

[features]
default = ["csr"]
csr = ["reactive-state/effects"]

[dependencies]
task-dispatch = { path = "../foundation/concurrency/task-dispatch", version = "0.3.0", features = ["wasm-bindgen"] }
view-alternatives = { path = "../foundation/web-runtime/view-alternatives", version = "0.1.9" }
dom-helpers = { path = "../foundation/web-runtime/dom-helpers", version = "0.8.8" }
view_macros = { package = "view-macros", path = "../macros" }
shared-value = { path = "../foundation/collections/shared-value", version = "0.2.1" }
reactive-state = { path = "../foundation/web-runtime/reactive-state", version = "0.2.14", features = ["serialization"] }
view-renderer = { path = "../foundation/web-runtime/view-renderer", version = "0.2.15", features = ["reactive-state", "shared-value"] }
throw_error = { path = "../foundation/diagnostics/throw_error", version = "0.3.1" }
typed-builder = {version = "0.23", path = "../foundation/code-generation/typed-builder"}
console_error_panic_hook = {version = "0.1", path = "../foundation/diagnostics/console_error_panic_hook"}
gloo-events = {version = "0.2", path = "../foundation/web-runtime/gloo-events"}
gloo-timers = { version = "0.3", path = "../foundation/web-runtime/gloo-timers" }
futures = { version = "0.3.34", path = "../foundation/concurrency/futures", default-features = false, features = ["async-await-macro", "channel", "shared-state", "std", "utilities"] }
js-sys = {version = "=0.3.106", path = "../foundation/web-runtime/js-sys"}
send_wrapper = {version = "0.6", path = "../foundation/concurrency/send_wrapper"}
data-serialization = { version = "1", features = ["derive"], path = "../foundation/data-storage/data-serialization"}
wasm-bindgen = {version = "=0.2.129", path = "../foundation/web-runtime/wasm-bindgen"}
web-sys = { version = "=0.3.106", features = [
  "Window", "Document", "DocumentFragment", "HtmlElement", "Element", "Node", "NodeList", "HtmlCollection", "DomTokenList",
  "Storage", "Location", "Url", "UrlSearchParams", "Navigator", "MediaQueryList", "MediaQueryListEvent", "Event", "EventTarget",
  "AbortController", "AbortSignal",
  "HtmlDialogElement", "HtmlInputElement", "HtmlButtonElement", "HtmlFormElement", "HtmlTextAreaElement", "HtmlTemplateElement",
  "KeyboardEvent", "MouseEvent", "PointerEvent", "FocusEvent", "SubmitEvent", "CustomEvent", "CustomEventInit", "Text",
  "CssStyleDeclaration", "FontFace", "FontFaceSet", "DomException", "DomMatrix", "DomMatrixReadOnly", "DomRect", "DomRectList",
  "MutationObserver", "MutationObserverInit", "MutationRecord", "ResizeObserver", "SvgsvgElement", "SvgElement", "SvgGraphicsElement", "SvgAnimatedRect", "SvgRect", "SvgMatrix",
  "PageTransitionEvent", "TransitionEvent", "Blob", "BlobPropertyBag", "Performance", "console",
], path = "../foundation/web-runtime/web-sys"}

[dev-dependencies]
json-codec = {version = "1", path = "../foundation/data-storage/json-codec"}

[lints.rust]
unsafe_code = "forbid"
unexpected_cfgs = "deny"

[[test]]
name = "component_props"
path = "../../test/interface/integration/component_props.rs"

[[test]]
name = "reactive_state"
path = "../../test/interface/integration/reactive_state.rs"

[[test]]
name = "style_contracts"
path = "../../test/interface/integration/style_contracts.rs"
